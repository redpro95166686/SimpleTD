<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 Achievements</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at 30% 20%, #0a0c16, #020308);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            color: #f0ece3;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(8, 18, 22, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 2.5rem;
            padding: 1.8rem 2rem 2rem;
            border: 1px solid rgba(80, 180, 140, 0.15);
            box-shadow: 0 30px 60px rgba(0,0,0,0.7);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.8rem;
        }
        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffcd94, #ffaa66);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 1px;
        }
        .back-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 0.5rem 1.5rem;
            border-radius: 60px;
            color: #f0ece3;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .back-btn:hover {
            background: rgba(255,255,255,0.1);
            transform: scale(1.02);
        }

        .ach-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 0.8rem;
        }
        .ach-card {
            background: rgba(20, 34, 30, 0.35);
            border-radius: 1.2rem;
            padding: 0.8rem 1rem;
            border: 1px solid rgba(80, 180, 140, 0.06);
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .ach-card.unlocked {
            border-color: rgba(255, 215, 0, 0.2);
            background: rgba(30, 50, 40, 0.35);
        }
        .ach-card.locked {
            opacity: 0.5;
            filter: grayscale(0.5);
        }
        .ach-card:hover {
            transform: translateX(4px);
            border-color: rgba(244, 162, 97, 0.15);
        }
        .ach-card .ach-icon {
            font-size: 2rem;
            width: 48px;
            text-align: center;
            flex-shrink: 0;
        }
        .ach-card .ach-info {
            flex: 1;
        }
        .ach-card .ach-info .name {
            font-weight: 600;
            font-size: 0.9rem;
        }
        .ach-card .ach-info .desc {
            font-size: 0.7rem;
            opacity: 0.5;
        }
        .ach-card .ach-status {
            font-size: 0.8rem;
            flex-shrink: 0;
        }
        .ach-card.unlocked .ach-status { color: #ffd700; }
        .ach-card.locked .ach-status { color: #555; }

        .footer {
            margin-top: 1.8rem;
            text-align: center;
            font-size: 0.6rem;
            opacity: 0.25;
            letter-spacing: 0.5px;
        }

        @media (max-width: 640px) {
            .container { padding: 1rem; }
            .ach-grid { grid-template-columns: 1fr; }
            .ach-card { padding: 0.6rem 0.8rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🏆 ACHIEVEMENTS</h1>
        <span class="progress-text" id="progressText">0 / 0</span>
        <button class="back-btn" id="backBtn">⬅ BACK</button>
    </div>
    <div class="ach-grid" id="achGrid"></div>
    <div class="footer">🏆 Achievements unlock automatically as you play</div>
</div>

<script>
    // ================================================================
    // ACHIEVEMENT DEFINITIONS
    // ================================================================
    const ACHIEVEMENTS = [
        { id: 'first_blood', icon: '💀', name: 'First Blood', desc: 'Kill your first enemy', check: () => getInt('td_totalKills') >= 1 },
        { id: 'wave_10', icon: '🌊', name: 'Wave 10', desc: 'Reach Wave 10', check: () => getWaveBest() >= 10 },
        { id: 'wave_25', icon: '🌊', name: 'Wave 25', desc: 'Reach Wave 25', check: () => getWaveBest() >= 25 },
        { id: 'wave_50', icon: '🌊', name: 'Wave 50', desc: 'Reach Wave 50', check: () => getWaveBest() >= 50 },
        { id: 'wave_100', icon: '🌊', name: 'Wave 100', desc: 'Reach Wave 100', check: () => getWaveBest() >= 100 },
        { id: 'boss_cerberus', icon: '🐕', name: 'Cerberus Slayer', desc: 'Defeat Cerberus (Wave 40)', check: () => getWaveBest() >= 40 },
        { id: 'boss_behemoth', icon: '🐘', name: 'Behemoth Bane', desc: 'Defeat Behemoth (Wave 80)', check: () => getWaveBest() >= 80 },
        { id: 'boss_titan', icon: '👑', name: 'Titan Slayer', desc: 'Defeat Titan (Wave 100)', check: () => getWaveBest() >= 100 },
        { id: 'tower_collector', icon: '🏰', name: 'Tower Collector', desc: 'Unlock all 7 towers', check: () => { const t = getData('td_unlockedTowers', {}); return Object.values(t).filter(Boolean).length >= 7; } },
        { id: 'master_builder', icon: '🔨', name: 'Master Builder', desc: 'Build 100 towers total', check: () => getInt('td_totalTowersBuilt') >= 100 },
        { id: 'heroic', icon: '🦸', name: 'Heroic', desc: 'Place your first hero', check: () => getInt('td_heroPlaced') >= 1 },
        { id: 'all_heroes', icon: '⭐', name: 'All Heroes', desc: 'Unlock all 4 heroes', check: () => { const h = getData('td_heroUnlocked', {}); return Object.values(h).filter(Boolean).length >= 4; } },
        { id: 'prestige_1', icon: '🌟', name: 'Prestige 1', desc: 'Reach Prestige 1', check: () => getInt('td_prestigeLevel') >= 1 },
        { id: 'prestige_5', icon: '🌟', name: 'Prestige 5', desc: 'Reach Prestige 5', check: () => getInt('td_prestigeLevel') >= 5 },
        { id: 'prestige_10', icon: '🌟', name: 'Prestige 10', desc: 'Reach Prestige 10', check: () => getInt('td_prestigeLevel') >= 10 },
        { id: 'millionaire', icon: '💰', name: 'Millionaire', desc: 'Earn 1,000,000 total coins', check: () => getInt('td_totalCoinsEarned') >= 1000000 },
        { id: 'gem_hoarder', icon: '💎', name: 'Gem Hoarder', desc: 'Collect 100 gems total', check: () => getInt('td_totalGems') >= 100 },
        { id: 'shard_collector', icon: '🔮', name: 'Shard Collector', desc: 'Collect 50 shards', check: () => getInt('td_shards') >= 50 },
        { id: 'difficulty_master', icon: '⚔️', name: 'Difficulty Master', desc: 'Unlock all difficulties', check: () => { const d = getData('td_unlockedDifficulties', ['easy']); return d.length >= 7; } },
        { id: 'primal_survivor', icon: '🦍', name: 'Primal Survivor', desc: 'Reach Wave 100 on Primal difficulty', check: () => { const r = getData('td_difficultyWaveRecords', {}); return (r.primal || 0) >= 100; } }
    ];

    // ================================================================
    // HELPERS
    // ================================================================
    function getData(key, fallback) {
        const val = localStorage.getItem(key);
        if (val === null || val === undefined) return fallback;
        try { return JSON.parse(val); } catch(e) { return val; }
    }
    function getInt(key, fallback = 0) {
        const val = localStorage.getItem(key);
        if (val === null || val === undefined) return fallback;
        return parseInt(val) || fallback;
    }
    function getWaveBest() {
        const records = getData('td_difficultyWaveRecords', {});
        let best = 0;
        for (let key in records) {
            if (records[key] > best) best = records[key];
        }
        return best;
    }

    // ================================================================
    // LOAD / CHECK ACHIEVEMENTS
    // ================================================================
    function checkAchievements() {
        const unlocked = getData('td_achievements', {});
        let total = ACHIEVEMENTS.length;
        let count = 0;

        ACHIEVEMENTS.forEach(ach => {
            const isUnlocked = unlocked[ach.id] || false;
            if (isUnlocked) count++;
        });

        let changed = false;
        ACHIEVEMENTS.forEach(ach => {
            if (!unlocked[ach.id] && ach.check()) {
                unlocked[ach.id] = true;
                changed = true;
                console.log(`🏆 Achievement Unlocked: ${ach.name}!`);
            }
        });

        if (changed) {
            localStorage.setItem('td_achievements', JSON.stringify(unlocked));
        }

        return { unlocked, total, count };
    }

    // ================================================================
    // RENDER
    // ================================================================
    function renderAchievements() {
        const { unlocked, total, count } = checkAchievements();
        const grid = document.getElementById('achGrid');
        grid.innerHTML = '';
        document.getElementById('progressText').textContent = `${count} / ${total}`;

        ACHIEVEMENTS.forEach(ach => {
            const isUnlocked = unlocked[ach.id] || false;
            const card = document.createElement('div');
            card.className = `ach-card ${isUnlocked ? 'unlocked' : 'locked'}`;
            card.innerHTML = `
                <div class="ach-icon">${ach.icon}</div>
                <div class="ach-info">
                    <div class="name">${ach.name}</div>
                    <div class="desc">${ach.desc}</div>
                </div>
                <div class="ach-status">${isUnlocked ? '✅' : '🔒'}</div>
            `;
            grid.appendChild(card);
        });
    }

    // ================================================================
    // NAVIGATION – BACK TO MENU
    // ================================================================
    document.getElementById('backBtn').addEventListener('click', () => {
        window.parent.postMessage({ type: 'navigate', page: 'menu' }, '*');
    });

    // ================================================================
    // INIT
    // ================================================================
    renderAchievements();
    setInterval(renderAchievements, 5000);

    console.log('🏆 Achievements page loaded – back to menu');
</script>
</body>
</html>
