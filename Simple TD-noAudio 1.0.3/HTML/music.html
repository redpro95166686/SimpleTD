<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Music Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at 30% 20%, #0a0c16, #020308);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: #f0ece3;
        }
        .player-container {
            height: 100vh;
            max-height: 100vh;
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            background: rgba(12, 24, 28, 0.92);
            backdrop-filter: blur(20px);
            padding: 1.2rem 1.2rem 0.8rem;
            border-left: 1px solid rgba(80, 180, 140, 0.25);
            border-right: 1px solid rgba(80, 180, 140, 0.25);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        @media (min-width: 521px) {
            .player-container {
                border-radius: 2.5rem;
                margin-top: 1rem;
                margin-bottom: 1rem;
                max-height: calc(100vh - 2rem);
            }
        }
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            margin-bottom: 0.6rem;
        }
        .player-header h1 {
            font-size: 1rem;
            font-weight: 600;
            background: linear-gradient(135deg, #ffcd94, #ffaa66);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .back-btn {
            background: rgba(255,255,255,0.06);
            border: none;
            padding: 0.3rem 0.9rem;
            border-radius: 40px;
            color: #c9d1d9;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .back-btn:hover {
            background: rgba(255,255,255,0.12);
        }
        .art-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1/1;
            max-height: calc(100vh - 380px);
            border-radius: 1.4rem;
            overflow: hidden;
            background: linear-gradient(145deg, #1a2a2a, #0d1a1a);
            flex-shrink: 1;
            min-height: 120px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .art-container canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .art-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 0.8rem 1.2rem;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
            pointer-events: none;
        }
        .art-overlay .track-title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.2px;
            text-shadow: 0 2px 12px rgba(0,0,0,0.5);
        }
        .art-overlay .track-artist {
            font-size: 0.75rem;
            opacity: 0.7;
            margin-top: 1px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .progress-section {
            flex-shrink: 0;
            margin: 0.3rem 0 0.2rem;
        }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            cursor: pointer;
            position: relative;
        }
        .progress-bar .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #f4a261, #ffcd94);
            border-radius: 10px;
            width: 0%;
            position: relative;
            transition: width 0.05s linear;
        }
        .progress-bar .progress-fill::after {
            content: '';
            position: absolute;
            right: -5px;
            top: -3px;
            width: 10px;
            height: 10px;
            background: #ffcd94;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.2s;
            box-shadow: 0 0 12px rgba(255,205,148,0.4);
        }
        .progress-bar:hover .progress-fill::after { opacity: 1; }
        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.6rem;
            opacity: 0.5;
            margin-top: 2px;
            font-family: monospace;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.4rem;
            flex-shrink: 0;
            margin: 0.2rem 0 0.2rem;
        }
        .controls button {
            background: none;
            border: none;
            color: #e0e0e0;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0.3rem;
            border-radius: 50%;
            transition: 0.15s;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .controls button:hover {
            background: rgba(255,255,255,0.06);
            transform: scale(1.05);
        }
        .controls button:active { transform: scale(0.92); }
        .controls .play-btn {
            background: linear-gradient(135deg, #f4a261, #e07c3a);
            color: #0a1f1a;
            font-size: 1.5rem;
            width: 50px;
            height: 50px;
            box-shadow: 0 4px 16px rgba(244,162,97,0.3);
        }
        .controls .play-btn:hover {
            transform: scale(1.06);
            box-shadow: 0 6px 22px rgba(244,162,97,0.45);
        }
        .controls .play-btn:active { transform: scale(0.94); }
        .controls .small-btn {
            font-size: 0.9rem;
            width: 32px;
            height: 32px;
        }
        .controls .small-btn.active { color: #f4a261; }
        .volume-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-shrink: 0;
            margin: 0.1rem 0 0.2rem;
            padding: 0 0.2rem;
        }
        .volume-row .vol-icon {
            font-size: 0.9rem;
            opacity: 0.6;
            cursor: pointer;
            transition: 0.15s;
            width: 20px;
            text-align: center;
        }
        .volume-row .vol-icon:hover { opacity: 1; }
        .volume-row input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 3px;
            background: rgba(255,255,255,0.15);
            border-radius: 10px;
            outline: none;
        }
        .volume-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #f4a261;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(244,162,97,0.3);
        }
        .volume-row input[type="range"]::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #f4a261;
            cursor: pointer;
            border: none;
        }
        .volume-row .vol-label {
            font-size: 0.6rem;
            font-family: monospace;
            opacity: 0.4;
            min-width: 32px;
            text-align: right;
        }
        .playlist {
            flex-shrink: 1;
            overflow-y: auto;
            margin-top: 0.3rem;
            padding-top: 0.3rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            min-height: 0;
            max-height: 200px;
        }
        .playlist::-webkit-scrollbar { width: 3px; }
        .playlist::-webkit-scrollbar-track { background: transparent; }
        .playlist::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 10px; }
        .playlist-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.3rem 0.4rem;
            border-radius: 0.6rem;
            cursor: pointer;
            transition: 0.12s;
            margin-bottom: 1px;
        }
        .playlist-item:hover { background: rgba(255,255,255,0.04); }
        .playlist-item.active {
            background: rgba(244,162,97,0.10);
            border-left: 2px solid #f4a261;
        }
        .playlist-item .track-info .name {
            font-size: 0.75rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .playlist-item .track-info .artist {
            font-size: 0.55rem;
            opacity: 0.4;
        }
        .playlist-item .track-status {
            font-size: 0.6rem;
            opacity: 0.3;
            font-family: monospace;
            flex-shrink: 0;
            margin-left: 0.5rem;
        }
        .playlist-item.active .track-status {
            opacity: 1;
            color: #f4a261;
        }
        .shortcuts-hint {
            flex-shrink: 0;
            margin-top: 0.2rem;
            font-size: 0.45rem;
            opacity: 0.15;
            text-align: center;
            letter-spacing: 0.3px;
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            padding-bottom: 0.2rem;
        }
        .shortcuts-hint kbd {
            background: rgba(255,255,255,0.06);
            padding: 0.05rem 0.3rem;
            border-radius: 3px;
            font-family: monospace;
            font-size: 0.45rem;
        }
        .egg-btn {
            position: absolute;
            bottom: 6px;
            right: 12px;
            background: none;
            border: none;
            color: rgba(255,255,255,0.15);
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            z-index: 50;
            padding: 4px 6px;
            border-radius: 30px;
        }
        .egg-btn:hover {
            color: rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.05);
        }
        .piano-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(12px);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 10px;
            overflow: hidden;
        }
        .piano-overlay.active { display: flex; }
        .piano-overlay .piano-container {
            max-width: 800px;
            width: 100%;
            max-height: 100vh;
            background: rgba(8, 20, 24, 0.9);
            border-radius: 2rem;
            padding: 0.8rem;
            border: 1px solid rgba(255, 200, 100, 0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .piano-overlay .piano-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            padding: 0 0.2rem 0.4rem;
        }
        .piano-overlay .piano-header h2 {
            font-size: 1.2rem;
            background: linear-gradient(135deg, #ffda88, #ffaa44);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .piano-overlay .piano-stats {
            display: flex;
            gap: 0.8rem;
            font-size: 0.7rem;
            font-weight: bold;
            flex-wrap: wrap;
        }
        .piano-overlay .piano-stats span {
            background: rgba(0,0,0,0.4);
            padding: 0.1rem 0.6rem;
            border-radius: 30px;
        }
        .piano-overlay .piano-close {
            background: #5e3a2a;
            border: none;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            color: #f9e6cf;
            cursor: pointer;
            font-size: 0.7rem;
        }
        .piano-overlay .piano-close:hover { background: #7e4a3a; }
        .piano-overlay .piano-canvas-wrap {
            flex-shrink: 1;
            min-height: 0;
            display: flex;
            justify-content: center;
            background: #030f0b;
            border-radius: 1.2rem;
            padding: 3px;
            margin-bottom: 0.3rem;
        }
        .piano-overlay #pianoCanvas {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 1rem;
            background: #151e1b;
            cursor: pointer;
        }
        .piano-overlay .piano-controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            flex-shrink: 0;
            padding: 0.3rem 0;
        }
        .piano-overlay .piano-controls button {
            background: #1f3e36;
            border: none;
            padding: 0.3rem 0.7rem;
            border-radius: 40px;
            color: #ffeac2;
            cursor: pointer;
            font-size: 0.6rem;
            font-weight: 600;
            transition: 0.08s;
            box-shadow: 0 2px 0 #0e2a24;
        }
        .piano-overlay .piano-controls button:active {
            transform: translateY(2px);
            box-shadow: 0 0px 0 #0e2a24;
        }
        .piano-overlay .piano-controls .space-btn {
            background: #b87c3e;
            min-width: 80px;
            box-shadow: 0 2px 0 #6e3a1a;
        }
        .piano-overlay .piano-controls .reset-btn { background: #6e3a2c; }
        .piano-overlay .piano-tip {
            font-size: 0.5rem;
            text-align: center;
            opacity: 0.4;
            flex-shrink: 0;
            padding-top: 0.2rem;
        }
        @media (max-width: 480px) {
            .piano-overlay .piano-header h2 { font-size: 0.9rem; }
            .piano-overlay .piano-stats { font-size: 0.6rem; gap: 0.4rem; }
            .piano-overlay .piano-controls button { font-size: 0.5rem; padding: 0.2rem 0.5rem; }
        }
        @media (max-height: 600px) {
            .piano-overlay .piano-container { padding: 0.4rem; }
            .piano-overlay .piano-canvas-wrap { border-radius: 0.6rem; }
            .piano-overlay .piano-controls { gap: 4px; }
        }
    </style>
</head>
<body>

<div class="player-container">
    <div class="player-header">
        <h1>🎵 MUSIC</h1>
        <button class="back-btn" id="backBtn">⬅ BACK</button>
    </div>
    <div class="art-container">
        <canvas id="visualizerCanvas"></canvas>
        <div class="art-overlay">
            <div class="track-title" id="trackTitle">Calm Tower Defense</div>
            <div class="track-artist" id="trackArtist">Ambient</div>
        </div>
    </div>
    <div class="progress-section">
        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill" style="width:0%"></div>
        </div>
        <div class="time-display">
            <span id="currentTime">0:00</span>
            <span id="totalTime">0:00</span>
        </div>
    </div>
    <div class="controls">
        <button class="small-btn" id="shuffleBtn" title="Shuffle">🔀</button>
        <button class="small-btn" id="prevBtn" title="Previous">⏮</button>
        <button class="play-btn" id="playBtn">▶</button>
        <button class="small-btn" id="nextBtn" title="Next">⏭</button>
        <button class="small-btn" id="repeatBtn" title="Repeat">🔁</button>
    </div>
    <div class="volume-row">
        <span class="vol-icon" id="muteBtn">🔊</span>
        <input type="range" id="volumeSlider" min="0" max="100" value="80">
        <span class="vol-label" id="volumeLabel">80%</span>
    </div>
    <div class="playlist" id="playlistContainer"></div>
    <div class="shortcuts-hint">
        <span><kbd>Space</kbd> Play/Pause</span>
        <span><kbd>←</kbd> <kbd>→</kbd> Seek</span>
        <span><kbd>↑</kbd> <kbd>↓</kbd> Volume</span>
    </div>
    <button class="egg-btn" id="eggBtn" title="🎹 Hidden Piano Game">🎹</button>
</div>

<div class="piano-overlay" id="pianoOverlay">
    <div class="piano-container">
        <div class="piano-header">
            <h2>🎹 PIANO MASTER (Easter Egg)</h2>
            <div class="piano-stats">
                <span>⭐ <span id="pScore">0</span></span>
                <span>🔥 <span id="pCombo">0</span></span>
                <span>❤️ <span id="pLives">3</span></span>
                <span>🪙 <span id="pCoins">0</span></span>
            </div>
            <button class="piano-close" id="pianoCloseBtn">✕ CLOSE</button>
        </div>
        <div class="piano-canvas-wrap">
            <canvas id="pianoCanvas" width="700" height="400"></canvas>
        </div>
        <div class="piano-controls">
            <button data-key="left">◀</button>
            <button data-key="down">▼</button>
            <button data-key="up">▲</button>
            <button data-key="right">▶</button>
            <button class="space-btn" data-key="space">␣ WIDE</button>
            <button class="reset-btn" id="pianoResetBtn">🔄 RESTART</button>
        </div>
        <div class="piano-tip">
            ⌨️ Arrow keys = lanes ｜ SPACE = WIDE hit ｜ Tiles sync with the song!
        </div>
    </div>
</div>

<script>
    (function() {
        'use strict';

        const TRACKS = [
            { id: 'calm',     label: 'Calm Tower Defense',  artist: 'Ambient' },
            { id: 'quiet',    label: 'A Quiet Room',        artist: 'Piano'    },
            { id: 'chill',    label: 'Chill Vibes',         artist: 'Lo-Fi'    },
            { id: 'highway',  label: 'Midnight Highway',    artist: 'sethcobbaut' },
            { id: 'watchtower', label: 'Watchtower Lullaby', artist: 'sethcobbaut' }
        ];
        const TRACK_COLORS = {
            calm: ['#1a3a3a', '#2a6a5a', '#f4a261'],
            quiet: ['#1a1a3a', '#3a3a7a', '#7a7acc'],
            chill: ['#2a1a3a', '#5a2a6a', '#cc7acc'],
            highway: ['#1a1a2a', '#2a2a5a', '#6a6aee'],
            watchtower: ['#2a1a1a', '#4a2a1a', '#d4a373']
        };

        const backBtn = document.getElementById('backBtn');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const repeatBtn = document.getElementById('repeatBtn');
        const muteBtn = document.getElementById('muteBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeLabel = document.getElementById('volumeLabel');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const trackTitleEl = document.getElementById('trackTitle');
        const trackArtistEl = document.getElementById('trackArtist');
        const playlistContainer = document.getElementById('playlistContainer');
        const canvas = document.getElementById('visualizerCanvas');
        const ctx = canvas.getContext('2d');

        const pianoOverlay = document.getElementById('pianoOverlay');
        const pianoCanvas = document.getElementById('pianoCanvas');
        const pCtx = pianoCanvas.getContext('2d');
        const pScoreEl = document.getElementById('pScore');
        const pComboEl = document.getElementById('pCombo');
        const pLivesEl = document.getElementById('pLives');
        const pCoinsEl = document.getElementById('pCoins');

        let currentTrack = 'calm';
        let isPlaying = false;
        let volume = 80;
        let shuffle = false;
        let repeat = false;
        let isMuted = false;
        let prevVolume = 80;
        let currentTime = 0;
        let duration = 180;
        let animFrame = null;

        // ---------- BACK BUTTON – always navigate to menu ----------
        backBtn.addEventListener('click', function() {
            window.parent.postMessage({
                type: 'navigate',
                page: 'menu'
            }, '*');
        });

        // ---------- VISUALIZER ----------
        let vizParticles = [];
        function initParticles() {
            vizParticles = [];
            for (let i=0; i<60; i++) {
                vizParticles.push({
                    x: Math.random(),
                    y: Math.random(),
                    size: 0.015 + Math.random() * 0.04,
                    speed: 0.002 + Math.random() * 0.008,
                    phase: Math.random() * Math.PI * 2,
                    amp: 0.3 + Math.random() * 0.7,
                    color: `hsl(${30 + Math.random() * 30}, 70%, ${40 + Math.random() * 40}%)`
                });
            }
        }
        initParticles();

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width || 400;
            canvas.height = rect.height || 400;
        }
        window.addEventListener('resize', resizeCanvas);

        function drawVisualizer() {
            const w = canvas.width;
            const h = canvas.height;
            if (!w || !h) {
                animFrame = requestAnimationFrame(drawVisualizer);
                return;
            }
            ctx.clearRect(0, 0, w, h);
            const barCount = 32;
            const barW = w / barCount * 0.5;
            const gap = w / barCount * 0.5;
            const time = Date.now() / 1000;
            for (let i=0; i<barCount; i++) {
                const freq = i / barCount;
                const amp = 0.3 + 0.7 * Math.sin(freq * 12 + time * 0.8) * 0.5 + 0.5;
                const height = 0.1 + amp * 0.7 * (isPlaying ? 0.9 : 0.25);
                const x = i * (barW + gap) + gap/2;
                const y = h * (1 - height);
                const hue = 30 + freq * 40 + Math.sin(time * 0.5 + i * 0.1) * 10;
                const lightness = 40 + 40 * height;
                ctx.fillStyle = `hsl(${hue}, 70%, ${lightness}%)`;
                ctx.shadowColor = `hsla(${hue}, 80%, 60%, 0.2)`;
                ctx.shadowBlur = 15;
                ctx.fillRect(x, y, barW, h * height);
            }
            ctx.shadowBlur = 0;
            for (let p of vizParticles) {
                const yOffset = isPlaying ? Math.sin(time * p.speed * 3 + p.phase) * p.amp * 0.06 : 0;
                const px = p.x * w;
                const py = p.y * h + yOffset * h;
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'rgba(255,205,148,0.1)';
                ctx.beginPath();
                ctx.arc(px, py, p.size * w * 0.3, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;
            const grad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w*0.25);
            grad.addColorStop(0, `rgba(244,162,97,${isPlaying ? 0.06 : 0.02})`);
            grad.addColorStop(1, 'rgba(244,162,97,0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(w/2, h/2, w*0.25, 0, Math.PI*2);
            ctx.fill();
            if (isPlaying) {
                const pulse = 0.3 + 0.3 * Math.sin(time * 2.5);
                ctx.strokeStyle = `rgba(244,162,97,${0.04 * pulse})`;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(w/2, h/2, w*0.18 + pulse * w*0.08, 0, Math.PI*2);
                ctx.stroke();
            }
            animFrame = requestAnimationFrame(drawVisualizer);
        }

        // ---------- UI UPDATES ----------
        function updateTrackInfo(trackId) {
            const track = TRACKS.find(t => t.id === trackId) || TRACKS[0];
            trackTitleEl.textContent = track.label;
            trackArtistEl.textContent = track.artist;
            const colors = TRACK_COLORS[trackId] || ['#1a3a3a', '#2a6a5a', '#f4a261'];
            document.querySelector('.art-container').style.background =
                `linear-gradient(145deg, ${colors[0]}, ${colors[1]})`;
            trackTitleEl.style.color = colors[2] || '#ffcd94';
        }

        function updatePlaylist() {
            playlistContainer.innerHTML = '';
            TRACKS.forEach((track) => {
                const div = document.createElement('div');
                div.className = 'playlist-item' + (track.id === currentTrack ? ' active' : '');
                div.innerHTML = `
                    <div class="track-info">
                        <div class="name">${track.label}</div>
                        <div class="artist">${track.artist}</div>
                    </div>
                    <div class="track-status">${track.id === currentTrack ? (isPlaying ? '▶' : '⏸') : ''}</div>
                `;
                div.addEventListener('click', () => {
                    if (track.id !== currentTrack) {
                        sendCommand('setTrack', { track: track.id });
                    } else {
                        sendCommand('toggle');
                    }
                });
                playlistContainer.appendChild(div);
            });
            const active = playlistContainer.querySelector('.playlist-item.active');
            if (active) active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }

        function updateProgress(time, dur) {
            currentTime = time || 0;
            duration = dur || 180;
            const pct = duration > 0 ? (currentTime / duration) * 100 : 0;
            progressFill.style.width = Math.min(100, pct) + '%';
            currentTimeEl.textContent = formatTime(currentTime);
            totalTimeEl.textContent = formatTime(duration);
        }

        function formatTime(seconds) {
            if (!seconds || isNaN(seconds)) return '0:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        function sendCommand(action, payload) {
            window.parent.postMessage({
                type: 'musicControl',
                action: action,
                ...payload
            }, '*');
        }

        // ---------- EVENT LISTENERS ----------
        playBtn.addEventListener('click', () => sendCommand('toggle'));
        prevBtn.addEventListener('click', () => sendCommand('prev'));
        nextBtn.addEventListener('click', () => sendCommand('next'));

        shuffleBtn.addEventListener('click', function() {
            shuffle = !shuffle;
            this.classList.toggle('active', shuffle);
        });

        repeatBtn.addEventListener('click', function() {
            repeat = !repeat;
            this.classList.toggle('active', repeat);
            sendCommand('repeat', { state: repeat });
        });

        volumeSlider.addEventListener('input', function() {
            const val = parseInt(this.value);
            volumeLabel.textContent = val + '%';
            sendCommand('setVolume', { volume: val });
            if (val === 0) muteBtn.textContent = '🔇';
            else muteBtn.textContent = '🔊';
        });

        muteBtn.addEventListener('click', function() {
            if (isMuted) {
                sendCommand('setVolume', { volume: prevVolume });
                volumeSlider.value = prevVolume;
                volumeLabel.textContent = prevVolume + '%';
                this.textContent = '🔊';
                isMuted = false;
            } else {
                prevVolume = parseInt(volumeSlider.value) || 80;
                sendCommand('setVolume', { volume: 0 });
                volumeSlider.value = 0;
                volumeLabel.textContent = '0%';
                this.textContent = '🔇';
                isMuted = true;
            }
        });

        const progressBar = document.getElementById('progressBar');
        progressBar.addEventListener('click', function(e) {
            const rect = this.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            const pos = x * duration;
            sendCommand('seek', { position: pos });
        });

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (pianoOverlay.classList.contains('active')) return;
            if (e.code === 'Space') { e.preventDefault(); sendCommand('toggle'); }
            else if (e.code === 'ArrowRight') { e.preventDefault(); sendCommand('seek', { position: currentTime + 5 }); }
            else if (e.code === 'ArrowLeft') { e.preventDefault(); sendCommand('seek', { position: Math.max(0, currentTime - 5) }); }
            else if (e.code === 'ArrowUp') { e.preventDefault(); const newVol = Math.min(100, parseInt(volumeSlider.value) + 5); volumeSlider.value = newVol; volumeLabel.textContent = newVol+'%'; sendCommand('setVolume', { volume: newVol }); }
            else if (e.code === 'ArrowDown') { e.preventDefault(); const newVol = Math.max(0, parseInt(volumeSlider.value) - 5); volumeSlider.value = newVol; volumeLabel.textContent = newVol+'%'; sendCommand('setVolume', { volume: newVol }); }
        });

        window.addEventListener('message', (e) => {
            const data = e.data;
            if (data?.type === 'musicStatus') {
                if (data.track && data.track !== currentTrack) {
                    currentTrack = data.track;
                    updateTrackInfo(currentTrack);
                    updatePlaylist();
                }
                if (data.isPlaying !== undefined) {
                    isPlaying = data.isPlaying;
                    playBtn.textContent = isPlaying ? '⏸' : '▶';
                }
                if (data.volume !== undefined) {
                    volume = data.volume;
                    volumeSlider.value = volume;
                    volumeLabel.textContent = volume + '%';
                    if (volume === 0) muteBtn.textContent = '🔇';
                    else muteBtn.textContent = '🔊';
                }
                if (data.currentTime !== undefined || data.duration !== undefined) {
                    updateProgress(data.currentTime || 0, data.duration || 180);
                }
                updatePlaylist();
            }
        });

        function requestStatus() {
            window.parent.postMessage({ type: 'musicControl', action: 'requestStatus' }, '*');
        }

        // ---------- INIT ----------
        function init() {
            resizeCanvas();
            drawVisualizer();
            setTimeout(requestStatus, 300);
            updatePlaylist();
            console.log('🎵 Music player ready – back always to menu.');
        }

        if (document.readyState === 'complete') init();
        else window.addEventListener('load', init);

        setInterval(requestStatus, 3000);
        window.addEventListener('resize', resizeCanvas);

        // ========== PIANO EASTER EGG (unchanged) ==========
        let pActive = false, pGameOver = false, pScore = 0, pCombo = 0, pLives = 3, pCoins = 0, pMultiplier = 1;
        let pTiles = [], pSpeed = 2.2, pLaneCount = 4, pLaneW = 700 / pLaneCount, pHitLineY = 320, pTileW = pLaneW * 0.65, pTileH = 32;
        let pFrameCount = 0, pSpawnCounter = 0, pLastAudioTime = 0;
        const eggBtn = document.getElementById('eggBtn');
        const pianoCloseBtn = document.getElementById('pianoCloseBtn');
        const pianoResetBtn = document.getElementById('pianoResetBtn');

        function resizePianoCanvas() {
            const container = pianoCanvas.parentElement;
            const rect = container.getBoundingClientRect();
            const w = Math.min(rect.width, 700);
            const aspect = 400 / 700;
            pianoCanvas.width = w;
            pianoCanvas.height = w * aspect;
            pLaneW = pianoCanvas.width / pLaneCount;
        }
        window.addEventListener('resize', resizePianoCanvas);

        function drawPiano() {
            const W = pianoCanvas.width, H = pianoCanvas.height;
            if (!W || !H) return;
            pCtx.clearRect(0, 0, W, H);
            const grad = pCtx.createLinearGradient(0,0,0,H);
            grad.addColorStop(0, "#162b25");
            grad.addColorStop(1, "#0a1916");
            pCtx.fillStyle = grad;
            pCtx.fillRect(0,0,W,H);
            pCtx.strokeStyle = "#ffd580";
            pCtx.lineWidth = 1.5;
            for (let i=1; i<pLaneCount; i++) {
                const x = i * pLaneW;
                pCtx.beginPath();
                pCtx.moveTo(x, 0);
                pCtx.lineTo(x, H);
                pCtx.stroke();
            }
            const hitY = pHitLineY * (H / 400);
            pCtx.shadowBlur = 10;
            pCtx.shadowColor = "#ffaa66";
            pCtx.beginPath();
            pCtx.moveTo(10, hitY);
            pCtx.lineTo(W-10, hitY);
            pCtx.lineWidth = 3;
            pCtx.strokeStyle = "#ffd966";
            pCtx.stroke();
            pCtx.shadowBlur = 0;
            pCtx.globalAlpha = 0.12;
            pCtx.fillStyle = "#ffdd99";
            pCtx.fillRect(0, hitY - 35, W, 70);
            pCtx.globalAlpha = 1;
            const arrows = ['←', '↓', '↑', '→'];
            pCtx.font = "bold 14px monospace";
            pCtx.fillStyle = "#ffecb3";
            for (let i=0; i<pLaneCount; i++) {
                pCtx.fillText(arrows[i], i * pLaneW + pLaneW/2 - 8, hitY - 12);
            }
            const skin = { tileColor: "#2c3e50", highlight: "#e67e22", border: "#f39c12" };
            for (let t of pTiles) {
                const y = t.y * (H / 400);
                const h = t.height * (H / 400);
                let x, w = t.width * (W / 700);
                if (t.isWide) {
                    x = 0;
                    const grad2 = pCtx.createLinearGradient(0, y, W, y+h);
                    grad2.addColorStop(0, "#ff4d4d");
                    grad2.addColorStop(0.25, "#ffd966");
                    grad2.addColorStop(0.5, "#66ff66");
                    grad2.addColorStop(0.75, "#66ccff");
                    grad2.addColorStop(1, "#cc66ff");
                    pCtx.fillStyle = grad2;
                    pCtx.shadowBlur = 6;
                    pCtx.beginPath();
                    roundRect(pCtx, x, y, w, h, 10);
                    pCtx.fill();
                    pCtx.shadowBlur = 0;
                    pCtx.fillStyle = "#fff3b0";
                    pCtx.font = `bold ${Math.floor(h*0.4)}px monospace`;
                    pCtx.fillText("✨ WIDE ✨", W/2 - 40, y + h - 8);
                } else {
                    x = t.lane * pLaneW + (pLaneW/2) - (pTileW * (W/700))/2;
                    const tw = pTileW * (W/700);
                    const th = pTileH * (H/400);
                    pCtx.fillStyle = skin.tileColor;
                    pCtx.beginPath();
                    roundRect(pCtx, x, y, tw, th, 8);
                    pCtx.fill();
                    pCtx.fillStyle = skin.highlight;
                    pCtx.fillRect(x+3, y+3, tw-6, 5);
                    pCtx.fillStyle = skin.border;
                    pCtx.fillRect(x+2, y+th-4, tw-4, 3);
                    pCtx.fillStyle = "#fff3cf";
                    pCtx.font = `${Math.floor(th*0.5)}px monospace`;
                    pCtx.fillText("♪", x + tw*0.3, y + th - 8);
                }
            }
            pCtx.shadowBlur = 0;
            if (pGameOver) {
                pCtx.fillStyle = "rgba(0,0,0,0.6)";
                pCtx.fillRect(0,0,W,H);
                pCtx.font = "bold 28px monospace";
                pCtx.fillStyle = "#ffb347";
                pCtx.fillText("GAME OVER", W/2 - 90, H/2 - 10);
                pCtx.font = "12px monospace";
                pCtx.fillStyle = "#eedd99";
                pCtx.fillText("Press RESTART or ENTER", W/2 - 75, H/2 + 30);
            }
            pCtx.font = "bold 14px monospace";
            pCtx.fillStyle = "#fbe6b0";
            pCtx.fillText(`SCORE ${Math.floor(pScore)}`, 12, 30);
            pCtx.fillStyle = "#ffcc88";
            pCtx.fillText(`COMBO x${pMultiplier}`, 12, 55);
        }

        function roundRect(ctx, x, y, w, h, r) {
            if (w < 2*r) r = w/2;
            if (h < 2*r) r = h/2;
            ctx.moveTo(x+r, y);
            ctx.lineTo(x+w-r, y);
            ctx.quadraticCurveTo(x+w, y, x+w, y+r);
            ctx.lineTo(x+w, y+h-r);
            ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
            ctx.lineTo(x+r, y+h);
            ctx.quadraticCurveTo(x, y+h, x, y+h-r);
            ctx.lineTo(x, y+r);
            ctx.quadraticCurveTo(x, y, x+r, y);
            return ctx;
        }

        function resetPianoGame() {
            pActive = true; pGameOver = false; pScore = 0; pCombo = 0; pLives = 3; pCoins = 0; pMultiplier = 1;
            pTiles = []; pSpeed = 2.2; pFrameCount = 0; pSpawnCounter = 0; pLastAudioTime = 0;
            updatePianoUI(); drawPiano();
        }

        function updatePianoUI() {
            pScoreEl.textContent = Math.floor(pScore);
            pComboEl.textContent = pCombo;
            pLivesEl.textContent = pLives;
            pCoinsEl.textContent = pCoins;
            pMultiplier = Math.min(4, 1 + Math.floor(pCombo / 10));
        }

        function spawnPianoTile() {
            if (!pActive || pGameOver) return;
            const audioTime = currentTime;
            const beatInterval = 0.6 + Math.random() * 0.4;
            const timeSinceLast = audioTime - pLastAudioTime;
            if (timeSinceLast < beatInterval * 0.8) return;
            pLastAudioTime = audioTime;
            const isWide = (Math.random() < 0.12);
            if (isWide) {
                pTiles.push({ isWide: true, lane: -1, y: -pTileH * 1.2, width: pianoCanvas.width, height: pTileH * 1.1 });
            } else {
                const lane = Math.floor(Math.random() * pLaneCount);
                pTiles.push({ isWide: false, lane: lane, y: -pTileH, width: pTileW, height: pTileH });
            }
        }

        function updatePianoTiles() {
            if (!pActive || pGameOver) return;
            const W = pianoCanvas.width, H = pianoCanvas.height, scaleY = H / 400;
            for (let i=pTiles.length-1; i>=0; i--) {
                const t = pTiles[i];
                t.y += pSpeed * 0.6;
                const missY = t.isWide ? (pHitLineY + 70) * scaleY : (pHitLineY + 60) * scaleY;
                if (t.y > missY) {
                    pTiles.splice(i,1);
                    pCombo = 0; pLives--;
                    updatePianoUI();
                    if (pLives <= 0) { pGameOver = true; pActive = false; }
                }
            }
        }

        function hitPianoLane(laneIdx) {
            if (!pActive || pGameOver) return false;
            let hitIdx = -1;
            const scaleY = pianoCanvas.height / 400;
            const hitLine = pHitLineY * scaleY;
            for (let i=0; i<pTiles.length; i++) {
                const t = pTiles[i];
                if (t.isWide) continue;
                if (t.lane === laneIdx) {
                    const bottom = t.y + t.height;
                    if (bottom >= hitLine - 40 * scaleY && t.y <= hitLine + 35 * scaleY) {
                        hitIdx = i; break;
                    }
                }
            }
            if (hitIdx !== -1) {
                const t = pTiles[hitIdx];
                pTiles.splice(hitIdx,1);
                const points = Math.floor(10 * pMultiplier);
                pScore += points; pCombo++; pCoins += 1;
                updatePianoUI();
                return true;
            } else {
                pCombo = 0; pLives--;
                updatePianoUI();
                if (pLives <= 0) { pGameOver = true; pActive = false; }
                return false;
            }
        }

        function hitPianoWide() {
            if (!pActive || pGameOver) return false;
            let hitIdx = -1;
            const scaleY = pianoCanvas.height / 400;
            const hitLine = pHitLineY * scaleY;
            for (let i=0; i<pTiles.length; i++) {
                const t = pTiles[i];
                if (t.isWide) {
                    const bottom = t.y + t.height;
                    if (bottom >= hitLine - 50 * scaleY && t.y <= hitLine + 45 * scaleY) {
                        hitIdx = i; break;
                    }
                }
            }
            if (hitIdx !== -1) {
                pTiles.splice(hitIdx,1);
                const points = Math.floor(35 * pMultiplier);
                pScore += points; pCombo += 2; pCoins += 2;
                updatePianoUI();
                return true;
            } else {
                pCombo = 0; pLives--;
                updatePianoUI();
                if (pLives <= 0) { pGameOver = true; pActive = false; }
                return false;
            }
        }

        let pianoLoopId = null;
        function pianoGameLoop() {
            if (!pianoOverlay.classList.contains('active')) {
                if (pianoLoopId) { cancelAnimationFrame(pianoLoopId); pianoLoopId = null; }
                return;
            }
            if (pActive && !pGameOver && isPlaying) {
                spawnPianoTile();
                updatePianoTiles();
            }
            drawPiano();
            pianoLoopId = requestAnimationFrame(pianoGameLoop);
        }

        function handlePianoArrow(keyName) {
            if (!pActive && !pGameOver) { resetPianoGame(); return; }
            if (pGameOver) return;
            const map = { 'left': 0, 'down': 1, 'up': 2, 'right': 3 };
            if (keyName in map) {
                hitPianoLane(map[keyName]);
                const btn = document.querySelector(`.piano-controls button[data-key="${keyName}"]`);
                if (btn) { btn.style.background = "#ffdd99"; setTimeout(() => btn.style.background = "", 100); }
            }
        }

        function handlePianoSpace() {
            if (!pActive && !pGameOver) { resetPianoGame(); return; }
            if (pGameOver) return;
            hitPianoWide();
            const btn = document.querySelector('.piano-controls .space-btn');
            if (btn) { btn.style.background = "#f1c40f"; setTimeout(() => btn.style.background = "", 120); }
        }

        document.querySelectorAll('.piano-controls button[data-key]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const key = btn.dataset.key;
                if (key === 'space') handlePianoSpace();
                else handlePianoArrow(key);
            });
        });

        pianoResetBtn.addEventListener('click', resetPianoGame);

        document.addEventListener('keydown', (e) => {
            if (!pianoOverlay.classList.contains('active')) return;
            if (e.target.tagName === 'INPUT') return;
            const key = e.key;
            if (key === 'Enter') { e.preventDefault(); resetPianoGame(); }
            else if (key === 'ArrowLeft') { handlePianoArrow('left'); e.preventDefault(); }
            else if (key === 'ArrowDown') { handlePianoArrow('down'); e.preventDefault(); }
            else if (key === 'ArrowUp') { handlePianoArrow('up'); e.preventDefault(); }
            else if (key === 'ArrowRight') { handlePianoArrow('right'); e.preventDefault(); }
            else if (key === ' ' || key === 'Space') { handlePianoSpace(); e.preventDefault(); }
        });

        eggBtn.addEventListener('click', () => {
            pianoOverlay.classList.add('active');
            resizePianoCanvas();
            resetPianoGame();
            if (pianoLoopId) cancelAnimationFrame(pianoLoopId);
            pianoGameLoop();
            requestStatus();
        });

        pianoCloseBtn.addEventListener('click', () => {
            pianoOverlay.classList.remove('active');
            if (pianoLoopId) { cancelAnimationFrame(pianoLoopId); pianoLoopId = null; }
        });

        pianoOverlay.addEventListener('click', (e) => {
            if (e.target === pianoOverlay) {
                pianoOverlay.classList.remove('active');
                if (pianoLoopId) { cancelAnimationFrame(pianoLoopId); pianoLoopId = null; }
            }
        });

        window.addEventListener('resize', () => {
            if (pianoOverlay.classList.contains('active')) resizePianoCanvas();
        });

        const observer = new MutationObserver(() => {
            if (pianoOverlay.classList.contains('active')) setTimeout(resizePianoCanvas, 50);
        });
        observer.observe(pianoOverlay, { attributes: true, attributeFilter: ['class'] });

        console.log('🎹 Piano easter egg ready – back always to menu.');
    })();
</script>
</body>
</html>
