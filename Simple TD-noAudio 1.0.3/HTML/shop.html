<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏪 Shop</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: radial-gradient(circle at 30% 20%, #0a0c16, #020308);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            color: #f0ece3;
            padding: 20px;
        }
        .shop-container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(8, 18, 22, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 2.5rem;
            padding: 1.8rem 2rem 2rem;
            border: 1px solid rgba(80, 180, 140, 0.15);
            box-shadow: 0 30px 60px rgba(0,0,0,0.7);
        }
        .shop-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.8rem;
        }
        .shop-header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffcd94, #ffaa66);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 1px;
        }
        .shop-header .stats {
            display: flex;
            gap: 1.2rem;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .shop-header .stats span {
            background: rgba(255,255,255,0.04);
            padding: 0.3rem 1rem;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.06);
            backdrop-filter: blur(4px);
        }
        .shop-header .stats .gem-stat { color: #b0f0ff; border-color: rgba(110, 255, 240, 0.2); }
        .shop-header .stats .shard-stat { color: #ffd700; border-color: rgba(255, 215, 0, 0.2); }
        .shop-header .back-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 0.5rem 1.5rem;
            border-radius: 60px;
            color: #f0ece3;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .shop-header .back-btn:hover {
            background: rgba(255,255,255,0.1);
            transform: scale(1.02);
        }
        .tab-bar {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 1.8rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 0.6rem;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: rgba(255,255,255,0.03);
            border: none;
            padding: 0.5rem 1.4rem;
            border-radius: 40px;
            color: #8b9a9a;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn:hover {
            background: rgba(255,255,255,0.06);
            color: #d0ddd0;
        }
        .tab-btn.active {
            background: rgba(244, 162, 97, 0.15);
            color: #ffcd94;
            box-shadow: inset 0 0 0 1px rgba(244, 162, 97, 0.2);
        }
        .tab-content {
            display: none;
            animation: fadeUp 0.25s ease-out;
        }
        .tab-content.active { display: block; }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .shop-item {
            background: rgba(20, 34, 30, 0.5);
            backdrop-filter: blur(4px);
            border-radius: 1.2rem;
            padding: 0.8rem 1rem;
            margin-bottom: 0.7rem;
            border: 1px solid rgba(80, 180, 140, 0.08);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }
        .shop-item:hover {
            border-color: rgba(244, 162, 97, 0.2);
            background: rgba(30, 50, 44, 0.5);
            transform: translateX(4px);
        }
        .shop-item .left {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .shop-item .left img {
            width: 38px;
            height: 38px;
            object-fit: contain;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 4px;
        }
        .shop-item .left .info .name { font-weight: 600; font-size: 0.95rem; }
        .shop-item .left .info .sub { font-size: 0.7rem; opacity: 0.5; }
        .shop-item .right {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .shop-item .right button {
            background: rgba(74, 110, 60, 0.6);
            border: none;
            padding: 0.25rem 0.9rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #f0ece3;
            cursor: pointer;
            transition: 0.15s;
        }
        .shop-item .right button:hover:not(:disabled) {
            background: rgba(74, 110, 60, 0.9);
            transform: scale(1.03);
        }
        .shop-item .right button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .shop-item .right .btn-gem { background: rgba(42, 95, 110, 0.6); }
        .shop-item .right .btn-gem:hover:not(:disabled) { background: rgba(42, 95, 110, 0.9); }
        .shop-item .right .btn-owned {
            background: rgba(42, 75, 62, 0.4);
            color: #88aa88;
            cursor: default;
        }

        .skill-tree {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }
        .tree-branch {
            background: rgba(16, 28, 24, 0.4);
            border-radius: 1.2rem;
            padding: 1rem 1.2rem;
            border-left: 3px solid rgba(244, 162, 97, 0.3);
            transition: 0.2s;
        }
        .tree-branch:hover {
            border-left-color: rgba(244, 162, 97, 0.6);
            background: rgba(20, 36, 30, 0.4);
        }
        .tree-branch h3 {
            color: #ffcd94;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .tree-branch h3 img {
            width: 28px;
            height: 28px;
            object-fit: contain;
            background: rgba(0,0,0,0.3);
            border-radius: 6px;
            padding: 3px;
        }
        .tree-node {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.2);
            border-radius: 0.6rem;
            padding: 0.4rem 0.8rem;
            margin-bottom: 0.3rem;
            border: 1px solid transparent;
            transition: 0.15s;
        }
        .tree-node:hover {
            border-color: rgba(244, 162, 97, 0.15);
        }
        .tree-node .node-info {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex: 1;
        }
        .tree-node .node-info .node-icon { font-size: 1rem; width: 24px; text-align: center; }
        .tree-node .node-info .node-desc { font-size: 0.8rem; }
        .tree-node .node-info .node-desc .name { font-weight: 500; }
        .tree-node .node-info .node-desc .sub { font-size: 0.65rem; opacity: 0.5; }
        .tree-node .node-action button {
            background: rgba(74, 110, 60, 0.5);
            border: none;
            padding: 0.15rem 0.7rem;
            border-radius: 40px;
            font-size: 0.65rem;
            font-weight: 600;
            color: #f0ece3;
            cursor: pointer;
            transition: 0.15s;
        }
        .tree-node .node-action button:hover:not(:disabled) { background: rgba(74, 110, 60, 0.8); }
        .tree-node .node-action button:disabled { opacity: 0.4; cursor: not-allowed; }
        .tree-node .node-action button.purchased {
            background: rgba(42, 75, 62, 0.3);
            color: #88aa88;
            cursor: default;
        }
        .tree-node .node-action button.knowledge { background: rgba(110, 74, 42, 0.5); }
        .tree-node .node-action button.knowledge:hover:not(:disabled) { background: rgba(110, 74, 42, 0.8); }

        .mini-track {
            width: 50px;
            height: 4px;
            background: rgba(255,255,255,0.06);
            border-radius: 2px;
            overflow: hidden;
        }
        .mini-fill {
            height: 100%;
            background: linear-gradient(90deg, #f4a261, #ffcd94);
            transition: width 0.3s;
        }
        .knowledge-section {
            margin-top: 0.8rem;
            padding-top: 0.8rem;
            border-top: 1px solid rgba(184, 134, 11, 0.2);
        }
        .knowledge-section h3 {
            color: #ffd700;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .hero-card {
            background: rgba(20, 34, 30, 0.5);
            border-radius: 1.2rem;
            padding: 0.8rem 1rem;
            margin-bottom: 0.7rem;
            border: 1px solid rgba(80, 180, 140, 0.08);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }
        .hero-card:hover {
            border-color: rgba(184, 134, 11, 0.2);
            background: rgba(30, 50, 44, 0.5);
            transform: translateX(4px);
        }
        .hero-card.selected {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.04);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.04);
        }
        .hero-card .left {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .hero-card .left img {
            width: 42px;
            height: 42px;
            object-fit: contain;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 4px;
        }
        .hero-card .left .info .name { font-weight: 600; font-size: 0.95rem; }
        .hero-card .left .info .desc { font-size: 0.7rem; opacity: 0.5; }
        .hero-card .right {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .hero-card .right button {
            background: rgba(74, 110, 60, 0.5);
            border: none;
            padding: 0.25rem 0.9rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #f0ece3;
            cursor: pointer;
            transition: 0.15s;
        }
        .hero-card .right button:hover:not(:disabled) {
            background: rgba(74, 110, 60, 0.8);
            transform: scale(1.03);
        }
        .hero-card .right .btn-gem { background: rgba(42, 95, 110, 0.5); }
        .hero-card .right .btn-gem:hover:not(:disabled) { background: rgba(42, 95, 110, 0.8); }
        .hero-card .right .btn-selected {
            background: rgba(255, 215, 0, 0.08);
            color: #ffd700;
            cursor: default;
        }
        .footer {
            margin-top: 1.8rem;
            text-align: center;
            font-size: 0.65rem;
            opacity: 0.3;
            letter-spacing: 0.5px;
        }
        @media (max-width: 640px) {
            .shop-container { padding: 1rem; }
            .shop-header h1 { font-size: 1.4rem; }
            .shop-header .stats { font-size: 0.7rem; gap: 0.6rem; }
            .shop-item, .hero-card { flex-direction: column; align-items: stretch; }
            .shop-item .right, .hero-card .right { justify-content: flex-start; margin-top: 0.4rem; }
            .tree-node { flex-direction: column; align-items: stretch; }
            .tree-node .node-action { margin-top: 0.3rem; text-align: right; }
            .tab-btn { padding: 0.3rem 0.8rem; font-size: 0.75rem; }
        }
    </style>
</head>
<body>
<div class="shop-container">
    <div class="shop-header">
        <h1>🏪 UPGRADES</h1>
        <div class="stats">
            <span class="gem-stat">💎 <span id="gemDisplay">0</span></span>
            <span class="shard-stat">🔮 <span id="shardDisplay">0</span></span>
        </div>
        <button class="back-btn" id="backBtn">⬅ BACK</button>
    </div>

    <div class="tab-bar">
        <button class="tab-btn active" data-tab="gems">💎 Gems</button>
        <button class="tab-btn" data-tab="shards">🔮 Skill Tree</button>
        <button class="tab-btn" data-tab="heroes">🦸 Heroes</button>
    </div>

    <div id="tab-gems" class="tab-content active"><div id="shopList"></div></div>
    <div id="tab-shards" class="tab-content"><div id="skillTreeContainer" class="skill-tree"></div></div>
    <div id="tab-heroes" class="tab-content"><div id="heroShopList"></div></div>

    <div class="footer">💎 All purchases save automatically</div>
</div>

<script>
    // ================================================================
    // GLOBAL DATA (from localStorage)
    // ================================================================
    let totalGems = parseInt(localStorage.getItem('td_totalGems') || '1');
    let shards = parseInt(localStorage.getItem('td_shards') || '0');
    let playerLevel = parseInt(localStorage.getItem('td_playerLevel') || '1');

    let unlockedTowers = JSON.parse(localStorage.getItem('td_unlockedTowers')) || { archer: true };
    let towerMaxLevels = JSON.parse(localStorage.getItem('td_towerMaxLevels')) || { archer: 1 };
    let boughtExtraCash = localStorage.getItem('td_boughtExtraCash') === 'true';
    let boughtExtraLives = localStorage.getItem('td_boughtExtraLives') === 'true';
    let extraStartingCash = parseInt(localStorage.getItem('td_extraCash') || '0');
    let extraLives = parseInt(localStorage.getItem('td_extraLives') || '0');

    let towerUpgrades = JSON.parse(localStorage.getItem('td_towerUpgrades')) || {
        archer:[false,false,false], bomber:[false,false,false],
        poison:[false,false,false], dart:[false,false,false],
        farm:[false,false,false], sniper:[false,false,false],
        mage:[false,false,false]
    };
    let knowledgeUpgrades = JSON.parse(localStorage.getItem('td_knowledgeUpgrades')) || {
        archery:false, serpants:false, heroesChant:false, heroesWallet:false
    };
    let heroUnlocked = JSON.parse(localStorage.getItem('td_heroUnlocked')) || {
        clacks:false, spoder:false, minifun:false, trae:false
    };
    let heroUpgrades = JSON.parse(localStorage.getItem('td_heroUpgrades')) || {
        clacks:[false,false,false], spoder:[false,false,false],
        minifun:[false,false,false], trae:[false,false,false]
    };
    let selectedHero = localStorage.getItem('td_selectedHero') || null;

    // ================================================================
    // CONSTANTS
    // ================================================================
    const TOWER_TYPES = {
        archer: { name:"🏹 Archer", baseCost:250, icon:"archer", gemCost:0, unlockCost:0 },
        bomber: { name:"💣 Bomber", baseCost:380, icon:"bomber", gemCost:5 },
        poison: { name:"☠️ Venom", baseCost:400, icon:"poison", gemCost:12 },
        dart: { name:"🎯 Dart", baseCost:384, icon:"dart", gemCost:17 },
        farm: { name:"🌾 Farm", baseCost:576, icon:"farm", gemCost:20 },
        sniper: { name:"🔭 Sniper", baseCost:500, icon:"sniper", gemCost:25 },
        mage: { name:"🧙 Mage", baseCost:450, icon:"mage", gemCost:70 }
    };
    const IMG_BASE = '../MISC/Tiles/Tower/';

    const HERO_DEFS = {
        clacks: { name:'Clacks', icon:'clacks', gemCost:400, goldCost:800, desc:'Shoots mini bombs. Boosts tower fire rate.' },
        spoder: { name:'Spoder', icon:'spoder', gemCost:900, goldCost:750, desc:'Shoots all directions. Applies poison. Gives discount.' },
        minifun: { name:'Mini Fun', icon:'minifun', gemCost:1200, goldCost:1000, desc:'Archer with + shape range. Can rotate.' },
        trae: { name:'Trae', icon:'trae', gemCost:1000, goldCost:1600, desc:'Tree that gives gold and buffs farms.' }
    };
    const HERO_IMG_BASE = '../MISC/Tiles/Hero/';

    const UPGRADE_DEFS = {
        archer: { name: 'Archer', upgrades: [
            { name: 'Archer boot camp', desc: '10% faster fire rate, 4% critical (150% damage)', levelReq: 0 },
            { name: 'Sharper arrows', desc: '8% critical chance, tower cost -10%', levelReq: 50 },
            { name: 'One with the bow', desc: 'Targets two enemies, shoots two arrows', levelReq: 100 }
        ]},
        bomber: { name: 'Bomber', upgrades: [
            { name: 'Bombs away', desc: 'Unexploded bombs give 1$ each at wave end', levelReq: 0 },
            { name: 'Sticky bomb', desc: 'Bombs stun enemies for 0.5s', levelReq: 50 },
            { name: 'Atomic bomb', desc: 'Cost -20%, explosion range +100%', levelReq: 100 }
        ]},
        poison: { name: 'Venom', upgrades: [
            { name: 'Alternative poison', desc: 'Base cost -10%, upgrade cost -5%', levelReq: 0 },
            { name: 'Thick poison', desc: 'Poison slows enemies by 30%', levelReq: 50 },
            { name: 'Clouds of hell', desc: 'Slow lasts 1s after leaving; poison towers lv30+ give +1 life/round (max 25)', levelReq: 100 }
        ]},
        dart: { name: 'Dart', upgrades: [
            { name: 'New recruits', desc: 'Cost -10%, damage +5%', levelReq: 0 },
            { name: 'Sharper aim', desc: '8% critical chance', levelReq: 50 },
            { name: 'Steel Darts', desc: 'Projectile speed +200%, 12% critical', levelReq: 100 }
        ]},
        farm: { name: 'Farm', upgrades: [
            { name: 'Fertilizer', desc: 'Produces 150% as often', levelReq: 0 },
            { name: 'Big plantation', desc: 'Base cost -10%', levelReq: 50 },
            { name: 'The Jungle', desc: 'First farm each game 30% off', levelReq: 100 }
        ]},
        sniper: { name: 'Sniper', upgrades: [
            { name: 'Heavy run', desc: 'Damage +200%', levelReq: 0 },
            { name: 'Dark snow', desc: 'Projectile speed +200%', levelReq: 50 },
            { name: 'Dead eye', desc: 'Lv30+ snipers 5% instakill', levelReq: 100 }
        ]},
        mage: { name: 'Mage', upgrades: [
            { name: 'Cheaper spells', desc: '-8% base cost', levelReq: 0 },
            { name: 'Chain Mastery', desc: 'Now hits three enemies', levelReq: 50 },
            { name: 'Arcane Speed', desc: '25% faster fire rate', levelReq: 100 }
        ]}
    };
    const HERO_UPGRADE_DEFS = {
        clacks: { name:'Clacks', icon:'clacks', upgrades: [
            { name: 'Faster Clacks', desc: 'Clacks gains 5% fire rate', levelReq: 100 },
            { name: 'Bigger Bombs', desc: 'Mini bombs explosion +1 tile', levelReq: 180 },
            { name: 'Stunning Bombs', desc: 'Mini bombs stun enemies for 0.5s', levelReq: 200 }
        ]},
        spoder: { name:'Spoder', icon:'spoder', upgrades: [
            { name: 'Wider Range', desc: '4 tile range', levelReq: 100 },
            { name: 'Cheaper Spoder', desc: 'Base cost reduced to 500', levelReq: 180 },
            { name: 'Double Damage', desc: 'Double Damage', levelReq: 200 }
        ]},
        minifun: { name:'Mini Fun', icon:'minifun', upgrades: [
            { name: 'Two Directions', desc: 'Can select two directions to fire', levelReq: 100 },
            { name: 'Cheaper Mini Fun', desc: 'Base cost 800', levelReq: 180 },
            { name: 'Faster Shots', desc: 'Now (lv*4) shots per second', levelReq: 200 }
        ]},
        trae: { name:'Trae', icon:'trae', upgrades: [
            { name: 'Life Giver', desc: 'Generates one life per round once level 5', levelReq: 100 },
            { name: 'Fertile Ground', desc: 'Farms adjacent to Trae get (+10*lv%) instead of +lv%', levelReq: 180 },
            { name: 'Cheaper Trae', desc: 'Trae costs 1200 gold', levelReq: 200 }
        ]}
    };
    const KNOWLEDGE_UPGRADES = [
        { id: 'archery', name: 'ARCHERY', desc: 'First Archer tower each game is free',
            reqs: { playerLevel: 75, tower: 'archer', upgradeIndex: 1 }, cost: 2 },
        { id: 'serpants', name: 'SERPANTS',
            desc: 'Venom extra lives have no limit (requires extra lives purchased, Venom lv3, player lv150)',
            reqs: { playerLevel: 150, tower: 'poison', upgradeIndex: 2, extraLivesPurchased: true }, cost: 2 },
        { id: 'heroesChant', name: 'Heroes Chant',
            desc: 'When a hero is placed, all towers get +5% fire rate (stacks with other buffs)',
            reqs: { playerLevel: 220 }, cost: 2 },
        { id: 'heroesWallet', name: 'Heroes Wallet',
            desc: 'Heroes level up with half the required damage', reqs: { playerLevel: 300 }, cost: 5 }
    ];

    // ================================================================
    // SAVE / UI
    // ================================================================
    function saveAllPersistent() {
        localStorage.setItem('td_totalGems', totalGems);
        localStorage.setItem('td_shards', shards);
        localStorage.setItem('td_unlockedTowers', JSON.stringify(unlockedTowers));
        localStorage.setItem('td_towerMaxLevels', JSON.stringify(towerMaxLevels));
        localStorage.setItem('td_boughtExtraCash', boughtExtraCash);
        localStorage.setItem('td_boughtExtraLives', boughtExtraLives);
        localStorage.setItem('td_extraCash', extraStartingCash);
        localStorage.setItem('td_extraLives', extraLives);
        localStorage.setItem('td_towerUpgrades', JSON.stringify(towerUpgrades));
        localStorage.setItem('td_knowledgeUpgrades', JSON.stringify(knowledgeUpgrades));
        localStorage.setItem('td_heroUnlocked', JSON.stringify(heroUnlocked));
        localStorage.setItem('td_heroUpgrades', JSON.stringify(heroUpgrades));
        localStorage.setItem('td_selectedHero', selectedHero);
        updateUI();
    }

    function updateUI() {
        document.getElementById('gemDisplay').innerText = totalGems;
        document.getElementById('shardDisplay').innerText = shards;
    }

    // ================================================================
    // GEMS TAB
    // ================================================================
    function refreshShop() {
        let container = document.getElementById('shopList');
        container.innerHTML = '';
        for (let [id, data] of Object.entries(TOWER_TYPES)) {
            const owned = unlockedTowers[id];
            const maxLvl = towerMaxLevels[id] || 1;
            const div = document.createElement('div');
            div.className = 'shop-item';
            const left = document.createElement('div');
            left.className = 'left';
            const img = document.createElement('img');
            img.src = IMG_BASE + (id === 'bomber' ? 'bomb.png' : id + '.png');
            img.alt = data.name;
            const info = document.createElement('div');
            info.className = 'info';
            const nameSpan = document.createElement('div');
            nameSpan.className = 'name';
            nameSpan.textContent = data.name;
            const subSpan = document.createElement('div');
            subSpan.className = 'sub';
            subSpan.textContent = `💎 unlock: ${data.gemCost || 0} | MAX LV: ${maxLvl}`;
            info.appendChild(nameSpan);
            info.appendChild(subSpan);
            left.appendChild(img);
            left.appendChild(info);
            const right = document.createElement('div');
            right.className = 'right';
            if (!owned && data.gemCost > 0) {
                const btn = document.createElement('button');
                btn.className = 'btn-gem';
                btn.textContent = `UNLOCK (${data.gemCost}💎)`;
                btn.onclick = () => {
                    if (totalGems >= data.gemCost) {
                        totalGems -= data.gemCost;
                        unlockedTowers[id] = true;
                        saveAllPersistent();
                        refreshShop();
                    } else alert('Not enough gems');
                };
                right.appendChild(btn);
            } else if (owned) {
                const btn = document.createElement('button');
                btn.className = 'btn-owned';
                btn.textContent = '✓ OWNED';
                right.appendChild(btn);
            }
            if (owned) {
                const btn = document.createElement('button');
                btn.textContent = `⬆ MAX LV+1 (${maxLvl}💎)`;
                btn.onclick = () => {
                    if (totalGems >= maxLvl) {
                        totalGems -= maxLvl;
                        towerMaxLevels[id] = maxLvl + 1;
                        saveAllPersistent();
                        refreshShop();
                    } else alert('Not enough gems');
                };
                right.appendChild(btn);
            }
            div.appendChild(left);
            div.appendChild(right);
            container.appendChild(div);
        }
        const extraCash = document.createElement('div');
        extraCash.className = 'shop-item';
        extraCash.innerHTML = `
            <div class="left">
                <div class="info"><div class="name">💰 Extra Starting Cash</div><div class="sub">+200 coins (one time)</div></div>
            </div>
            <div class="right">
                <button class="btn-gem" id="buyExtraCash" ${boughtExtraCash ? 'disabled' : ''}>
                    ${boughtExtraCash ? '✓ BOUGHT' : 'BUY (35💎)'}
                </button>
            </div>
        `;
        container.appendChild(extraCash);
        const extraLivesDiv = document.createElement('div');
        extraLivesDiv.className = 'shop-item';
        extraLivesDiv.innerHTML = `
            <div class="left">
                <div class="info"><div class="name">❤️ Fortifications</div><div class="sub">+5 lives (one time)</div></div>
            </div>
            <div class="right">
                <button class="btn-gem" id="buyExtraLives" ${boughtExtraLives ? 'disabled' : ''}>
                    ${boughtExtraLives ? '✓ BOUGHT' : 'BUY (50💎)'}
                </button>
            </div>
        `;
        container.appendChild(extraLivesDiv);

        document.getElementById('buyExtraCash')?.addEventListener('click', () => {
            if (!boughtExtraCash && totalGems >= 35) {
                totalGems -= 35;
                extraStartingCash += 200;
                boughtExtraCash = true;
                saveAllPersistent();
                refreshShop();
            } else alert('Cannot buy');
        });
        document.getElementById('buyExtraLives')?.addEventListener('click', () => {
            if (!boughtExtraLives && totalGems >= 50) {
                totalGems -= 50;
                extraLives += 5;
                boughtExtraLives = true;
                saveAllPersistent();
                refreshShop();
            } else alert('Cannot buy');
        });
    }

    // ================================================================
    // SKILL TREE (Shards)
    // ================================================================
    function buildSkillTree() {
        const container = document.getElementById('skillTreeContainer');
        container.innerHTML = '';

        const towerKeys = ['archer', 'bomber', 'poison', 'dart', 'farm', 'sniper', 'mage'];
        for (let key of towerKeys) {
            const def = UPGRADE_DEFS[key];
            if (!def) continue;
            const upgrades = towerUpgrades[key] || [false, false, false];
            const branch = document.createElement('div');
            branch.className = 'tree-branch';
            const header = document.createElement('h3');
            const img = document.createElement('img');
            img.src = IMG_BASE + (key === 'bomber' ? 'bomb.png' : key + '.png');
            img.alt = def.name;
            header.appendChild(img);
            header.appendChild(document.createTextNode(` ${def.name} Upgrades`));
            branch.appendChild(header);

            def.upgrades.forEach((upg, idx) => {
                const purchased = upgrades[idx];
                const available = (idx === 0 || upgrades[idx-1]) && playerLevel >= upg.levelReq;
                const node = document.createElement('div');
                node.className = 'tree-node';
                const info = document.createElement('div');
                info.className = 'node-info';
                const iconSpan = document.createElement('span');
                iconSpan.className = 'node-icon';
                iconSpan.textContent = purchased ? '✅' : (available ? '🔓' : '🔒');
                const desc = document.createElement('div');
                desc.className = 'node-desc';
                desc.innerHTML = `<span class="name">${upg.name}</span> <span class="sub">– ${upg.desc}</span>`;
                info.appendChild(iconSpan);
                info.appendChild(desc);
                const action = document.createElement('div');
                action.className = 'node-action';
                const btn = document.createElement('button');
                if (purchased) {
                    btn.className = 'purchased';
                    btn.textContent = '✓ Bought';
                    btn.disabled = true;
                } else if (!available) {
                    btn.textContent = `🔒 Lv${upg.levelReq}`;
                    btn.disabled = true;
                } else {
                    btn.textContent = `Buy (1🔮)`;
                    btn.onclick = () => {
                        if (shards < 1) { alert('Not enough shards'); return; }
                        shards--;
                        upgrades[idx] = true;
                        towerUpgrades[key] = upgrades;
                        saveAllPersistent();
                        buildSkillTree();
                    };
                }
                action.appendChild(btn);
                node.appendChild(info);
                node.appendChild(action);
                branch.appendChild(node);
            });
            container.appendChild(branch);
        }

        // Hero upgrades branch
        const heroBranch = document.createElement('div');
        heroBranch.className = 'tree-branch';
        heroBranch.style.borderLeftColor = '#b8860b';
        const heroHeader = document.createElement('h3');
        heroHeader.innerHTML = '🦸 Hero Upgrades';
        heroBranch.appendChild(heroHeader);

        for (let [hkey, hdef] of Object.entries(HERO_UPGRADE_DEFS)) {
            const upgrades = heroUpgrades[hkey] || [false, false, false];
            const hBranch = document.createElement('div');
            hBranch.style.marginLeft = '0.5rem';
            hBranch.style.marginBottom = '0.5rem';
            hBranch.style.borderLeft = '2px solid rgba(184, 134, 11, 0.2)';
            hBranch.style.paddingLeft = '0.8rem';
            const hTitle = document.createElement('div');
            hTitle.style.fontWeight = '600';
            hTitle.style.color = '#ffd700';
            hTitle.style.fontSize = '0.85rem';
            hTitle.textContent = HERO_DEFS[hkey]?.name || hkey;
            hBranch.appendChild(hTitle);

            hdef.upgrades.forEach((upg, idx) => {
                const purchased = upgrades[idx];
                const reqLevel = [100, 180, 200][idx];
                const available = (idx === 0 || upgrades[idx-1]) && playerLevel >= reqLevel;
                const node = document.createElement('div');
                node.className = 'tree-node';
                node.style.marginBottom = '0.2rem';
                const info = document.createElement('div');
                info.className = 'node-info';
                const iconSpan = document.createElement('span');
                iconSpan.className = 'node-icon';
                iconSpan.textContent = purchased ? '✅' : (available ? '🔓' : '🔒');
                const desc = document.createElement('div');
                desc.className = 'node-desc';
                desc.innerHTML = `<span class="name">${upg.name}</span> <span class="sub">– ${upg.desc}</span>`;
                info.appendChild(iconSpan);
                info.appendChild(desc);
                const action = document.createElement('div');
                action.className = 'node-action';
                const btn = document.createElement('button');
                if (purchased) {
                    btn.className = 'purchased';
                    btn.textContent = '✓ Bought';
                    btn.disabled = true;
                } else if (!available) {
                    btn.textContent = `🔒 Lv${reqLevel}`;
                    btn.disabled = true;
                } else {
                    btn.textContent = `Buy (1🔮)`;
                    btn.onclick = () => {
                        if (shards < 1) { alert('Not enough shards'); return; }
                        shards--;
                        upgrades[idx] = true;
                        heroUpgrades[hkey] = upgrades;
                        saveAllPersistent();
                        buildSkillTree();
                    };
                }
                action.appendChild(btn);
                node.appendChild(info);
                node.appendChild(action);
                hBranch.appendChild(node);
            });
            heroBranch.appendChild(hBranch);
        }
        container.appendChild(heroBranch);

        // Knowledge
        const knowledgeSection = document.createElement('div');
        knowledgeSection.className = 'knowledge-section';
        const kHeader = document.createElement('h3');
        kHeader.textContent = '📜 THE KNOWLEDGE';
        knowledgeSection.appendChild(kHeader);

        for (let k of KNOWLEDGE_UPGRADES) {
            const purchased = knowledgeUpgrades[k.id] || false;
            let available = true;
            if (k.reqs.playerLevel && playerLevel < k.reqs.playerLevel) available = false;
            if (k.reqs.tower) {
                const towerUpg = towerUpgrades[k.reqs.tower] || [false,false,false];
                if (k.reqs.upgradeIndex !== undefined && !towerUpg[k.reqs.upgradeIndex]) available = false;
            }
            if (k.reqs.extraLivesPurchased && !boughtExtraLives) available = false;
            const node = document.createElement('div');
            node.className = 'tree-node';
            node.style.borderColor = 'rgba(184, 134, 11, 0.2)';
            const info = document.createElement('div');
            info.className = 'node-info';
            const iconSpan = document.createElement('span');
            iconSpan.className = 'node-icon';
            iconSpan.textContent = purchased ? '✅' : (available ? '🔓' : '🔒');
            const desc = document.createElement('div');
            desc.className = 'node-desc';
            desc.innerHTML = `<span class="name">${k.name}</span> <span class="sub">– ${k.desc}</span>`;
            info.appendChild(iconSpan);
            info.appendChild(desc);
            const action = document.createElement('div');
            action.className = 'node-action';
            const btn = document.createElement('button');
            btn.className = 'knowledge';
            if (purchased) {
                btn.className = 'purchased knowledge';
                btn.textContent = '✓ Bought';
                btn.disabled = true;
            } else if (!available) {
                btn.textContent = `🔒 locked`;
                btn.disabled = true;
            } else {
                btn.textContent = `Buy (${k.cost}🔮)`;
                btn.onclick = () => {
                    if (shards < k.cost) { alert('Not enough shards'); return; }
                    shards -= k.cost;
                    knowledgeUpgrades[k.id] = true;
                    saveAllPersistent();
                    buildSkillTree();
                };
            }
            action.appendChild(btn);
            node.appendChild(info);
            node.appendChild(action);
            knowledgeSection.appendChild(node);
        }
        container.appendChild(knowledgeSection);
    }

    // ================================================================
    // HEROES TAB (with postMessage for hero selection)
    // ================================================================
    function refreshHeroShop() {
        const container = document.getElementById('heroShopList');
        container.innerHTML = '';
        for (let [key, def] of Object.entries(HERO_DEFS)) {
            const unlocked = heroUnlocked[key];
            const card = document.createElement('div');
            card.className = 'hero-card' + (selectedHero === key ? ' selected' : '');
            const left = document.createElement('div');
            left.className = 'left';
            const img = document.createElement('img');
            const imgFile = key === 'minifun' ? 'miniFun.png' : key + '.png';
            img.src = HERO_IMG_BASE + imgFile;
            img.alt = def.name;
            const info = document.createElement('div');
            info.className = 'info';
            const nameSpan = document.createElement('div');
            nameSpan.className = 'name';
            nameSpan.textContent = def.name;
            const descSpan = document.createElement('div');
            descSpan.className = 'desc';
            descSpan.textContent = def.desc;
            info.appendChild(nameSpan);
            info.appendChild(descSpan);
            left.appendChild(img);
            left.appendChild(info);
            const right = document.createElement('div');
            right.className = 'right';
            if (!unlocked) {
                const btn = document.createElement('button');
                btn.className = 'btn-gem';
                btn.textContent = `UNLOCK (${def.gemCost}💎)`;
                btn.onclick = () => {
                    if (totalGems >= def.gemCost) {
                        totalGems -= def.gemCost;
                        heroUnlocked[key] = true;
                        saveAllPersistent();
                        refreshHeroShop();
                    } else alert('Not enough gems');
                };
                right.appendChild(btn);
            } else {
                if (selectedHero === key) {
                    const btn = document.createElement('button');
                    btn.className = 'btn-selected';
                    btn.textContent = '✅ SELECTED';
                    right.appendChild(btn);
                } else {
                    const btn = document.createElement('button');
                    btn.textContent = 'SELECT';
                    btn.onclick = () => {
                        selectedHero = key;
                        localStorage.setItem('td_selectedHero', key);
                        refreshHeroShop();
                        window.parent.postMessage({ type: 'heroSelected', hero: key }, '*');
                    };
                    right.appendChild(btn);
                }
            }
            card.appendChild(left);
            card.appendChild(right);
            container.appendChild(card);
        }
    }

    // ================================================================
    // TABS
    // ================================================================
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById('tab-' + this.dataset.tab).classList.add('active');
            if (this.dataset.tab === 'gems') refreshShop();
            if (this.dataset.tab === 'shards') buildSkillTree();
            if (this.dataset.tab === 'heroes') refreshHeroShop();
        });
    });

    // ================================================================
    // NAVIGATION – BACK TO MENU
    // ================================================================
    document.getElementById('backBtn').addEventListener('click', () => {
        window.parent.postMessage({ type: 'navigate', page: 'menu' }, '*');
    });

    // ================================================================
    // INIT
    // ================================================================
    refreshShop();
    buildSkillTree();
    refreshHeroShop();
    updateUI();
</script>
</body>
</html>
