<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple TD</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0c16;
      height: 100vh;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }
    .container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    .page {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
    }
    .page.active {
      display: block;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #0a0c16;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Global audio player -->
  <audio id="bgm" loop preload="auto"></audio>

  <div class="container">
    <!-- Menu page (default) -->
    <div id="menuPage" class="page active">
      <iframe id="menuFrame" src="HTML/menu.html"></iframe>
    </div>

    <!-- Game page -->
    <div id="gamePage" class="page">
      <iframe id="gameFrame" src="HTML/game.html"></iframe>
    </div>

    <!-- Other pages (shop, bestiary, etc.) -->
    <div id="otherPage" class="page">
      <iframe id="otherFrame" src=""></iframe>
    </div>
  </div>

  <script>
    // -------- GLOBAL MUSIC CONTROLLER --------
    const audio = document.getElementById('bgm');
    let currentTrack = localStorage.getItem('td_currentTrack') || 'calm';
    let volume = parseInt(localStorage.getItem('td_volume')) || 80;
    let isPlaying = false;
    let isMusicPageVisible = false;
    let statusInterval = null;

    const TRACK_LIST = ['calm', 'quiet', 'chill', 'highway', 'watchtower'];
    const trackFiles = {
      calm: './MISC/Music/calm.mp3',
      quiet: './MISC/Music/quiet.mp3',
      chill: './MISC/Music/chill.mp3',
      highway: './MISC/Music/highway.mp3',
      watchtower: './MISC/Music/watchtower.mp3'
    };

    function loadTrack(trackId) {
      if (trackFiles[trackId]) {
        audio.src = trackFiles[trackId];
        currentTrack = trackId;
        localStorage.setItem('td_currentTrack', trackId);
        if (isPlaying) {
          audio.play().catch(() => {});
        }
        sendStatusToMusic();
      }
    }

    function setVolume(val) {
      volume = Math.min(100, Math.max(0, val));
      audio.volume = volume / 100;
      localStorage.setItem('td_volume', volume);
      sendStatusToMusic();
    }

    function togglePlay() {
      if (isPlaying) {
        audio.pause();
        isPlaying = false;
      } else {
        audio.play().catch(() => {});
        isPlaying = true;
      }
      sendStatusToMusic();
    }

    function seekTo(seconds) {
      if (audio.duration) {
        audio.currentTime = Math.min(seconds, audio.duration);
        sendStatusToMusic();
      }
    }

    function sendStatusToMusic() {
      if (!isMusicPageVisible) return;
      const otherFrame = document.getElementById('otherFrame');
      if (!otherFrame || !otherFrame.contentWindow) return;
      const status = {
        type: 'musicStatus',
        track: currentTrack,
        isPlaying: isPlaying,
        volume: volume,
        currentTime: audio.currentTime || 0,
        duration: audio.duration || 0
      };
      try {
        otherFrame.contentWindow.postMessage(status, '*');
      } catch(e) {}
    }

    audio.addEventListener('timeupdate', () => {
      if (isMusicPageVisible) sendStatusToMusic();
    });
    audio.addEventListener('loadedmetadata', () => {
      if (isMusicPageVisible) sendStatusToMusic();
    });
    audio.addEventListener('ended', () => {
      isPlaying = false;
      sendStatusToMusic();
    });

    loadTrack(currentTrack);
    setVolume(volume);

    // -------- NAVIGATION --------
    const menuPage = document.getElementById('menuPage');
    const gamePage = document.getElementById('gamePage');
    const otherPage = document.getElementById('otherPage');
    const menuFrame = document.getElementById('menuFrame');
    const gameFrame = document.getElementById('gameFrame');
    const otherFrame = document.getElementById('otherFrame');

    // Track if game is currently active
    let isGameActive = true;

    function navigateTo(page, params) {
      const srcMap = {
        game: 'HTML/game.html',
        shop: 'HTML/shop.html',
        bestiary: 'HTML/bestiary.html',
        settings: 'HTML/settings.html',
        music: 'HTML/music.html',
        stats: 'HTML/stats.html',
        tutorial: 'HTML/tutorial.html',
        achievements: 'HTML/achievements.html',
        menu: 'HTML/menu.html',
        play: 'HTML/play.html',
        roguelike: 'HTML/roguelike.html',
        learn: 'HTML/learn.html',
        roguelikeHard: 'HTML/roguelikeHard.html',
        roguelikeChallenger: 'HTML/roguelikeChallenger.html',
        roguelike_select: 'HTML/roguelike_select.html',
      };

      // ---- Send appHidden to game iframe if leaving game ----
      if (isGameActive && page !== 'game') {
        if (gameFrame && gameFrame.contentWindow) {
          try {
            gameFrame.contentWindow.postMessage({ type: 'appHidden' }, '*');
          } catch(e) {}
        }
        isGameActive = false;
      }

      // Hide all pages
      menuPage.classList.remove('active');
      gamePage.classList.remove('active');
      otherPage.classList.remove('active');

      if (page === 'menu') {
        menuPage.classList.add('active');
      } else if (page === 'game') {
        gamePage.classList.add('active');
        let url = srcMap.game;
        if (params) {
          url += '?' + params;
        }
        gameFrame.src = url;
        // Send appVisible after a short delay to ensure the iframe is loaded
        setTimeout(() => {
          if (gameFrame && gameFrame.contentWindow) {
            try {
              gameFrame.contentWindow.postMessage({ type: 'appVisible', page: 'game' }, '*');
            } catch(e) {}
          }
          isGameActive = true;
        }, 200);
      } else if (srcMap[page]) {
        otherPage.classList.add('active');
        otherFrame.src = srcMap[page];
        isMusicPageVisible = (page === 'music');
        if (isMusicPageVisible) {
          setTimeout(() => sendStatusToMusic(), 200);
          if (statusInterval) clearInterval(statusInterval);
          statusInterval = setInterval(() => {
            sendStatusToMusic();
          }, 500);
        } else {
          if (statusInterval) { clearInterval(statusInterval); statusInterval = null; }
        }
      }
    }

    // -------- MESSAGE HANDLER --------
    window.addEventListener('message', (e) => {
      const data = e.data;

      // ---- NAVIGATION ----
      if (data?.type === 'navigate') {
        navigateTo(data.page, data.params);
      }

      // ---- MUSIC CONTROLS ----
      else if (data?.type === 'musicControl') {
        const action = data.action;
        if (action === 'play') { if (!isPlaying) togglePlay(); }
        else if (action === 'pause') { if (isPlaying) togglePlay(); }
        else if (action === 'toggle') { togglePlay(); }
        else if (action === 'setTrack') { loadTrack(data.track); }
        else if (action === 'setVolume') { setVolume(data.volume); }
        else if (action === 'seek') { seekTo(data.position); }
        else if (action === 'requestStatus') { sendStatusToMusic(); }
        else if (action === 'prev') {
          const idx = TRACK_LIST.indexOf(currentTrack);
          const newIdx = (idx - 1 + TRACK_LIST.length) % TRACK_LIST.length;
          loadTrack(TRACK_LIST[newIdx]);
        } else if (action === 'next') {
          const idx = TRACK_LIST.indexOf(currentTrack);
          const newIdx = (idx + 1) % TRACK_LIST.length;
          loadTrack(TRACK_LIST[newIdx]);
        } else if (action === 'repeat') {
          audio.loop = data.state || false;
        }
      }

      // ---- FORWARD TO GAME IFRAME (settings toggles, hero, custom map) ----
      else if (data?.type === 'heroSelected' ||
               data?.type === 'freeDrawToggle' ||
               data?.type === 'unlimitedHeroesToggle' ||
               data?.type === 'customMap') {
        if (gameFrame && gameFrame.contentWindow) {
          gameFrame.contentWindow.postMessage(data, '*');
        }
      }

      // ---- HARD RESET ----
      else if (data?.type === 'hardReset') {
        // Forward to game iframe to stop saving and reset state
        if (gameFrame && gameFrame.contentWindow) {
          try {
            gameFrame.contentWindow.postMessage({ type: 'hardReset' }, '*');
          } catch(e) {}
        }
        // Navigate to menu
        navigateTo('menu');
        // Force reload the menu to ensure clean state
        setTimeout(() => {
          if (menuFrame) {
            menuFrame.src = 'HTML/menu.html';
          }
        }, 100);
      }
    });

    console.log('✅ Big Screen ready – hard reset handler added.');
  </script>
</body>
</html>
