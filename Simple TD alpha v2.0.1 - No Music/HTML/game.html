        turboEnabled = !turboEnabled;
        const icon = turboItem.querySelector('.icon');
        if (turboEnabled) {
            icon.textContent = '⏩';
            turboItem.innerHTML = '<span class="icon">⏩</span> Turbo ON';
            speedMultiplier = TURBO_SPEED;
        } else {
            icon.textContent = '⏩';
            turboItem.innerHTML = '<span class="icon">⏩</span> Turbo OFF';
            speedMultiplier = DEFAULT_SPEED;
        }
        log(turboEnabled ? '🚀 Turbo ON' : '⏹️ Turbo OFF');
    }

    // ================================================================
    // FORCE WAVE
    // ================================================================
    function forceWave() {
        if (isScoutWave) { log("Scout wave in progress, let him finish!"); return; }
        if (!waveActive && !gameOverFlag && lives > 0) {
            if (!scoutWaveComplete && wave===0) { log("Scout wave hasn't completed yet!"); return; }
            if (wave===0 && scoutWaveComplete) wave=1;
            startWave();
        } else log("Cannot start");
    }

    // ================================================================
    // DRAW CANVAS (with projectile images and poison)
    // ================================================================
    function drawCanvas() {
        if (!ctx) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const dW = cellW, dH = cellH;
        const grassTiles = IMG.grass || [];
        const hasGrass = grassTiles.length > 0 && grassTiles.every(img => img && img.complete && img.naturalWidth > 0);

        for (let r=0; r<ROWS; r++) {
            for (let c=0; c<COLS; c++) {
                const x = c*dW, y = r*dH;
                const isPath = pathCells.some(p=>p.x===c && p.y===r);
                const idx = pathCells.findIndex(p=>p.x===c && p.y===r);
                if (isPath) {
                    if (IMG.path && IMG.path.complete && IMG.path.naturalWidth > 0) {
                        ctx.drawImage(IMG.path, x, y, dW, dH);
                    } else {
                        ctx.fillStyle="#6f4f37";
                        ctx.fillRect(x, y, dW-0.5, dH-0.5);
                        ctx.fillStyle="#9c7a4d";
                        ctx.fillRect(x+2, y+2, dW-5, dH-5);
                    }
                    if (idx === 0) {
                        ctx.fillStyle = "#ffdd44";
                        ctx.font = "16px monospace";
                        ctx.fillText("→", x+dW/2-8, y+dH/2+6);
                    }
                    if (idx === pathCells.length-1 && flagPlanted) {
                        ctx.fillStyle = "#ff3333";
                        ctx.font = "20px monospace";
                        ctx.fillText("🚩", x+dW/2-10, y+dH/2+8);
                    }
                } else {
                    if (hasGrass) {
                        const grassIdx = ((r * 7 + c * 13) % grassTiles.length);
                        ctx.drawImage(grassTiles[grassIdx], x, y, dW, dH);
                    } else {
                        ctx.fillStyle="#2a6b4e";
                        ctx.fillRect(x, y, dW-0.5, dH-0.5);
                        ctx.fillStyle="#398067";
                        ctx.fillRect(x+1, y+1, dW-3, dH-3);
                    }
                }
                if (flagCarrier && !flagCarrier.done) {
                    let fx=flagCarrier.x, fy=flagCarrier.y;
                    let grad = ctx.createRadialGradient(fx,fy,2,fx,fy,Math.min(dW,dH)*0.6);
                    grad.addColorStop(0,"rgba(255,215,0,0.4)");
                    grad.addColorStop(1,"rgba(255,215,0,0)");
                    ctx.fillStyle=grad;
                    ctx.beginPath();
                    ctx.arc(fx,fy,Math.min(dW,dH)*0.6,0,Math.PI*2);
                    ctx.fill();
                    ctx.fillStyle="#FFD700";
                    ctx.beginPath();
                    ctx.arc(fx,fy,Math.min(dW,dH)*0.28,0,Math.PI*2);
                    ctx.fill();
                    ctx.fillStyle="#FFA500";
                    ctx.beginPath();
                    ctx.arc(fx-2,fy-2,Math.min(dW,dH)*0.12,0,Math.PI*2);
                    ctx.fill();
                    ctx.fillStyle="#ff3333";
                    ctx.font="22px monospace";
                    ctx.fillText("🚩", fx-12, fy-16);
                }
            }
        }

        // Spikes – draw mine.png
        for (let s of spikes) {
            const x = s.x * dW, y = s.y * dH;
            const img = IMG.projectile['bomber'];
            const size = Math.min(dW, dH) * 0.7;
            if (img && img.complete && img.naturalWidth > 0) {
                ctx.drawImage(img, x + (dW - size) / 2, y + (dH - size) / 2, size, size);
            } else {
                // fallback
                ctx.fillStyle = "#ddbb55";
                ctx.beginPath();
                ctx.moveTo(x + dW/2, y + 4);
                ctx.lineTo(x + dW - 8, y + dH - 8);
                ctx.lineTo(x + 8, y + dH - 8);
                ctx.fill();
            }
        }

        // Explosions – use smallMine.png for Clacks, mine.png for Bomber, else colored circles
        for (let exp of explosions) {
            let alpha = exp.life / exp.maxLife;
            let rad = exp.radius * (1 + (1 - exp.life / exp.maxLife) * 0.8);
            const imgKey = exp.imgKey || null;
            if (imgKey === 'clacks' && IMG.projectile['clacks']) {
                const img = IMG.projectile['clacks'];
                if (img && img.complete && img.naturalWidth > 0) {
                    const size = rad * 2.5;
                    ctx.globalAlpha = alpha * 0.9;
                    ctx.drawImage(img, exp.x - size/2, exp.y - size/2, size, size);
                    ctx.globalAlpha = 1;
                    continue;
                }
            } else if (imgKey === 'bomber' && IMG.projectile['bomber']) {
                const img = IMG.projectile['bomber'];
                if (img && img.complete && img.naturalWidth > 0) {
                    const size = rad * 2.2;
                    ctx.globalAlpha = alpha * 0.9;
                    ctx.drawImage(img, exp.x - size/2, exp.y - size/2, size, size);
                    ctx.globalAlpha = 1;
                    continue;
                }
            }
            // fallback colored circles
            ctx.globalAlpha = alpha * 0.8;
            ctx.fillStyle = "#ff6600";
            ctx.beginPath();
            ctx.arc(exp.x, exp.y, rad, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#ffcc00";
            ctx.beginPath();
            ctx.arc(exp.x, exp.y, rad * 0.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(exp.x - rad * 0.2, exp.y - rad * 0.2, rad * 0.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }

        // Towers & Heroes
        for (let i=0; i<towers.length; i++) {
            let t = towers[i];
            let x=t.col*dW, y=t.row*dH;
            let img = null;
            let isHero = false;
            let heroKey = null;

            if (t.type === 'hero') {
                heroKey = t.heroType;
                if (IMG.hero && IMG.hero[heroKey] && IMG.hero[heroKey].complete && IMG.hero[heroKey].naturalWidth > 0) {
                    img = IMG.hero[heroKey];
                }
                isHero = true;
            } else {
                const towerKey = TOWER_ICON_MAP[t.type] || t.type;
                if (IMG.tower && IMG.tower[towerKey] && IMG.tower[towerKey].complete && IMG.tower[towerKey].naturalWidth > 0) {
                    img = IMG.tower[towerKey];
                }
            }

            ctx.fillStyle = "rgba(0,0,0,0.3)";
            ctx.beginPath();
            ctx.arc(x+dW/2, y+dH/2, Math.min(dW,dH)*0.4, 0, Math.PI*2);
            ctx.fill();

            if (img) {
                ctx.drawImage(img, x+2, y+2, dW-4, dH-4);
            } else {
                ctx.fillStyle="#1E2F2C";
                ctx.fillRect(x+4, y+4, dW-8, dH-8);
                let icon = isHero ? (HERO_DEFS[heroKey]?.icon || '🦸') : (TOWER_TYPES[t.type]?.icon || '🏰');
                ctx.fillStyle="#FFD966";
                ctx.font=`${Math.max(16,dW*0.4)}px monospace`;
                ctx.fillText(icon, x+dW/2-12, y+dH/2+7);
            }

            ctx.fillStyle = isHero ? "#b8860b" : "#f2e8c9";
            ctx.font = "bold 9px monospace";
            ctx.fillText(isHero ? `H${t.level}` : `Lv${t.level}`, x+dW-18, y+12);

            if (selectedTowerIndex === i) {
                ctx.strokeStyle = isHero ? "#ffd700" : "#f4a261";
                ctx.lineWidth = 2.5;
                ctx.setLineDash([4,4]);
                ctx.strokeRect(x+2, y+2, dW-4, dH-4);
                ctx.setLineDash([]);

                if (t.type === 'poison' && waveActive) {
                    let rad = TOWER_TYPES.poison.auraRadius + (t.level-1)*12;
                    ctx.beginPath();
                    ctx.arc(x+dW/2, y+dH/2, rad, 0, Math.PI*2);
                    ctx.fillStyle = "rgba(0,255,100,0.15)";
                    ctx.fill();
                    ctx.strokeStyle = "#88ffaa";
                    ctx.lineWidth = 2;
                    ctx.setLineDash([8,8]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }

                if (isHero && heroKey) {
                    let def = HERO_DEFS[heroKey];
                    if (def) {
                        let range = def.range + (t.level-1)*10;
                        if (range > 0) {
                            ctx.beginPath();
                            ctx.arc(x+dW/2, y+dH/2, range, 0, Math.PI*2);
                            ctx.strokeStyle="#88ffaa";
                            ctx.lineWidth=1.8;
                            ctx.setLineDash([6,8]);
                            ctx.stroke();
                            ctx.setLineDash([]);
                        }
                    }
                } else {
                    let stats = getTowerStats(t.type, t.level);
                    if (t.type !== 'sniper' && stats.range > 0) {
                        ctx.beginPath();
                        ctx.arc(x+dW/2, y+dH/2, stats.range, 0, Math.PI*2);
                        ctx.strokeStyle="#ffff88";
                        ctx.lineWidth=1.8;
                        ctx.setLineDash([6,8]);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    } else if (t.type === 'sniper') {
                        ctx.beginPath();
                        ctx.arc(x+dW/2, y+dH/2, Math.max(dW,dH)*8, 0, Math.PI*2);
                        ctx.strokeStyle="#88ffaa";
                        ctx.lineWidth=1.2;
                        ctx.setLineDash([10,12]);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }
                }
            }
        }

        // Enemies
        for (let e of enemies) {
            let hpPercent = e.hp/e.maxHp;
            ctx.fillStyle = e.color;
            ctx.beginPath();
            ctx.arc(e.posXWorld, e.posYWorld, Math.min(dW,dH)*0.33, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = "#FFE0B3";
            ctx.font = "bold 8px monospace";
            let label = e.icon ? e.icon : (e.name ? e.name.substring(0,2) : "");
            ctx.fillText(`${label} ${Math.floor(e.hp)}`, e.posXWorld-15, e.posYWorld-15);
            ctx.fillStyle = "#8b0000";
            ctx.fillRect(e.posXWorld-14, e.posYWorld-18, 28, 4);
            ctx.fillStyle = "#4eff6e";
            ctx.fillRect(e.posXWorld-14, e.posYWorld-18, 28*hpPercent, 4);
        }

        // Poison effect on enemies
        for (let e of enemies) {
            if (e.poisonTimer > 0) {
                const img = IMG.projectile['poison'];
                if (img && img.complete && img.naturalWidth > 0) {
                    const size = Math.min(cellW, cellH) * 0.4;
                    ctx.drawImage(img, e.posXWorld - size/2, e.posYWorld - size/2, size, size);
                } else {
                    ctx.fillStyle = '#66ff44';
                    ctx.beginPath();
                    ctx.arc(e.posXWorld, e.posYWorld, 6, 0, Math.PI*2);
                    ctx.fill();
                }
            }
        }

        // Projectiles (with images)
        for (let p of projectiles) {
            const imgKey = p.imgKey || 'default';
            const img = IMG.projectile[imgKey];
            if (img && img.complete && img.naturalWidth > 0) {
                const size = Math.max(16, Math.min(cellW, cellH) * 0.4);
                ctx.drawImage(img, p.x - size/2, p.y - size/2, size, size);
            } else {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
                ctx.fillStyle = p.dx !== undefined ? "#ffdd44" : "#ffe484";
                ctx.fill();
            }
        }

        // Placement preview
        if (placementActive && previewTowerType && pendingPlaceCol>=0) {
            let stats = TOWER_TYPES[previewTowerType];
            if (stats.baseRange > 0 && previewTowerType !== 'sniper') {
                let cx = pendingPlaceCol*dW + dW/2, cy = pendingPlaceRow*dH + dH/2;
                ctx.beginPath();
                ctx.arc(cx, cy, stats.baseRange, 0, Math.PI*2);
                ctx.strokeStyle = "#ffffaa";
                ctx.lineWidth = 2;
                ctx.setLineDash([6,10]);
                ctx.stroke();
                ctx.setLineDash([]);
            } else if (previewTowerType === 'sniper') {
                let cx = pendingPlaceCol*dW + dW/2, cy = pendingPlaceRow*dH + dH/2;
                ctx.beginPath();
                ctx.arc(cx, cy, Math.max(dW,dH)*8, 0, Math.PI*2);
                ctx.strokeStyle = "#aaffcc";
                ctx.lineWidth = 1.5;
                ctx.setLineDash([8,12]);
                ctx.stroke();
                ctx.setLineDash([]);
            }
        }

        if (gameOverFlag) {
            ctx.font = "bold 28px monospace";
            ctx.fillStyle = "#FFB347";
            ctx.fillText("💀 GAME OVER", canvas.width/2-100, canvas.height/2);
        }
    }

    // ================================================================
    // POPUPS
    // ================================================================
    function closePopup(){ if(activePopup && activePopup.parentNode) activePopup.remove(); activePopup=null; }

    function showTowerPopup(idx) {
        closePopup();
        let t = towers[idx];
        if (t.type === 'hero') {
            let hero = placedHeroes.find(h => h.towerIndex === idx);
            if (!hero) return;
            let def = HERO_DEFS[hero.type];
            let rect = canvas.getBoundingClientRect();
            let x = t.col * cellW + cellW/2, y = t.row * cellH + cellH/2;
            let sx = rect.left + (x / (canvas.width/rect.width)), sy = rect.top + (y / (canvas.width/rect.width));
            let popup = document.createElement('div');
            popup.className = 'tower-popup';
            let left = sx + 20, top = sy - 40;
            if (left + 200 > window.innerWidth) left = sx - 200;
            if (left < 10) left = 10;
            if (top + 180 > window.innerHeight) top = sy - 180;
            if (top < 10) top = 10;
            popup.style.left = `${left}px`;
            popup.style.top = `${top}px`;
            let content = `<div class="popup-close">✕</div><div><b>${def.icon} ${def.name} Lv${t.level}</b></div>`;
            if (hero.type === 'trae') {
                let farmBonus = hero.level, killBonus = hero.level, waveGold = 100 * hero.level;
                content += `<div>🌾 Farm Bonus: +${farmBonus}%</div><div>💀 Kill Bonus: +${killBonus}%</div><div>💰 Wave Gold: +${waveGold}🪙</div><div>💵 Total Earned: ${Math.floor(towerIncome[idx] || 0)}🪙</div><div>🌳 Farms: ${towers.filter(t=>t.type==='farm').length}</div>`;
            } else {
                content += `<div>💥 Damage dealt: ${Math.floor(hero.damageDealt)}</div>`;
                if (hero.type === 'minifun') {
                    let dirs = ['↑', '→', '↓', '←'];
                    content += `<div>Direction: ${dirs[hero.direction]}</div>`;
                    content += `<div><button class="popup-btn" data-action="rotate">🔄 Rotate</button></div>`;
                }
            }
            content += `<div><span class="popup-btn popup-sell" data-action="sell">💰 SELL</span></div>`;
            popup.innerHTML = content;
            popup.querySelector('.popup-close').onclick = () => closePopup();
            popup.querySelector('[data-action="sell"]').addEventListener('click', (e) => { e.stopPropagation(); sellTower(idx); });
            let rotateBtn = popup.querySelector('[data-action="rotate"]');
            if (rotateBtn) {
                rotateBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    hero.direction = (hero.direction + 1) % 4;
                    log(`🔄 Mini Fun direction changed`);
                    closePopup();
                    showTowerPopup(idx);
                });
            }
            document.body.appendChild(popup);
            activePopup = popup;
            selectedTowerIndex = idx;
            return;
        }
        let stats = getTowerStats(t.type, t.level);
        let maxLvl = towerMaxLevels[t.type] || 1;
        let canUpgrade = (t.level < maxLvl);
        let rect = canvas.getBoundingClientRect();
        let x = t.col * cellW + cellW/2, y = t.row * cellH + cellH/2;
        let sx = rect.left + (x / (canvas.width/rect.width)), sy = rect.top + (y / (canvas.width/rect.width));
        let popup = document.createElement('div');
        popup.className = 'tower-popup';
        let left = sx + 20, top = sy - 40;
        if (left + 180 > window.innerWidth) left = sx - 180;
        if (left < 10) left = 10;
        if (top + 170 > window.innerHeight) top = sy - 170;
        if (top < 10) top = 10;
        popup.style.left = `${left}px`;
        popup.style.top = `${top}px`;
        let content = `<div class="popup-close">✕</div><div><b>${TOWER_TYPES[t.type].icon} ${TOWER_TYPES[t.type].name} Lv${t.level}</b></div>`;
        if (t.type === 'farm') {
            content += `<div>💰 Total earned: ${Math.floor(towerIncome[idx] || 0)}🪙</div>`;
        } else {
            content += `<div>💥 Damage: ${stats.damage}</div><div>📡 Range: ${t.type === 'sniper' ? '∞' : Math.floor(stats.range)}</div><div>⚡ Fire rate: ${Math.floor(1000 / stats.cooldownMax)}/s</div><div>🗡️ Kills: ${towerKills[idx] || 0}</div><div>💢 Total Dmg: ${Math.floor(towerDamage[idx] || 0)}</div>`;
            if (t.type === 'mage') {
                let hits = 2;
                if (towerUpgrades.mage[1]) hits = 3;
                content += `<div>⚡ Chain hits: ${hits}</div>`;
            }
        }
        content += `<div style="margin-top:8px;">`;
        if (canUpgrade) {
            let cost = Math.floor((TOWER_TYPES[t.type].upgradeCost + (t.level - 1) * 25) * getUpgradeCostMultiplier());
            content += `<span class="popup-btn" data-action="upgrade">⬆ UPGRADE (${cost}🪙)</span>`;
        }
        content += `<span class="popup-btn popup-sell" data-action="sell">💰 SELL</span></div>`;
        popup.innerHTML = content;
        popup.querySelector('.popup-close').onclick = () => closePopup();
        popup.querySelector('[data-action="upgrade"]')?.addEventListener('click', (e) => { e.stopPropagation(); upgradeTower(idx); });
        popup.querySelector('[data-action="sell"]').addEventListener('click', (e) => { e.stopPropagation(); sellTower(idx); });
        document.body.appendChild(popup);
        activePopup = popup;
        selectedTowerIndex = idx;
    }

    // ================================================================
    // TOWER SIDEBAR – RENDER
    // ================================================================
    function renderSidebar() {
        sidebar.innerHTML = '';
        const heroBuff = getHeroGlobalBuff();

        const towerKeys = Object.keys(TOWER_TYPES);
        for (let type of towerKeys) {
            const data = TOWER_TYPES[type];
            const slot = document.createElement('div');
            slot.className = 'tower-slot';
            slot.dataset.type = type;

            const locked = !unlockedTowers[type];
            if (locked) {
                slot.classList.add('locked');
                slot.draggable = false;
            } else {
                slot.draggable = true;
                slot.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', type);
                    slot.classList.add('dragging');
                });
                slot.addEventListener('dragend', () => {
                    slot.classList.remove('dragging');
                });
                slot.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (selectedTowerType === type) {
                        selectedTowerType = null;
                        slot.classList.remove('selected');
                    } else {
                        document.querySelectorAll('.tower-slot.selected').forEach(el => el.classList.remove('selected'));
                        selectedTowerType = type;
                        slot.classList.add('selected');
                    }
                });
            }

            let cost = data.baseCost;
            let discount = 0;
            if (type === 'archer' && towerUpgrades.archer[1]) discount += 0.10;
            if (type === 'dart' && towerUpgrades.dart[0]) discount += 0.10;
            if (type === 'farm') {
                if (towerUpgrades.farm[1]) discount += 0.10;
                if (towerUpgrades.farm[2] && !firstFarmBuilt) discount += 0.30;
            }
            if (type === 'poison' && towerUpgrades.poison[0]) discount += 0.10;
            if (type === 'bomber' && towerUpgrades.bomber[2]) discount += 0.20;
            if (type === 'mage' && towerUpgrades.mage[0]) discount += 0.08;
            if (type === 'archer' && knowledgeUpgrades.archery && !firstArcherFreeUsed) cost = 0;
            else {
                cost = Math.floor(cost * (1 - discount));
                if (cost < 0) cost = 0;
                if (heroBuff.discount > 0) cost = Math.floor(cost * (1 - heroBuff.discount));
                if (diffSettings.towerCostMult) cost = Math.floor(cost * diffSettings.towerCostMult);
            }

            const img = document.createElement('img');
            img.className = 'tower-icon';
            const towerKey = TOWER_ICON_MAP[type] || type;
            if (IMG.tower && IMG.tower[towerKey]) {
                img.src = IMG.tower[towerKey].src;
            } else {
                img.alt = '🔲';
            }
            img.draggable = false;
            slot.appendChild(img);

            const costSpan = document.createElement('div');
            costSpan.className = 'tower-cost';
            costSpan.textContent = cost + '🪙';
            slot.appendChild(costSpan);

            const indicator = document.createElement('div');
            indicator.className = 'indicator';
            if (locked) {
                indicator.className = 'indicator locked-indicator';
                indicator.textContent = '🔒';
            } else if (coins < cost) {
                indicator.classList.add('red');
            } else {
                indicator.classList.add('green');
            }
            slot.appendChild(indicator);

            sidebar.appendChild(slot);
        }

        let heroKeysToShow = [];
        if (unlimitedHeroesMode) {
            const placedTypes = placedHeroes.map(h => h.type);
            heroKeysToShow = Object.keys(HERO_DEFS).filter(h => heroUnlocked[h] && !placedTypes.includes(h));
        } else {
            if (selectedHero && heroUnlocked[selectedHero] && !placedHeroes.some(h => h.type === selectedHero)) {
                heroKeysToShow = [selectedHero];
            }
        }

        for (let hkey of heroKeysToShow) {
            const def = HERO_DEFS[hkey];
            const slot = document.createElement('div');
            slot.className = 'tower-slot';
            slot.dataset.type = 'hero_' + hkey;

            let cost = def.goldCost;
            if (hkey === 'spoder' && heroUpgrades.spoder[1]) cost = 500;
            if (hkey === 'minifun' && heroUpgrades.minifun[1]) cost = 800;
            if (hkey === 'trae' && heroUpgrades.trae[2]) cost = 1200;

            slot.draggable = true;
            slot.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', 'hero_' + hkey);
                slot.classList.add('dragging');
            });
            slot.addEventListener('dragend', () => {
                slot.classList.remove('dragging');
            });
            slot.addEventListener('click', (e) => {
                e.stopPropagation();
                if (selectedTowerType === 'hero_' + hkey) {
                    selectedTowerType = null;
                    slot.classList.remove('selected');
                } else {
                    document.querySelectorAll('.tower-slot.selected').forEach(el => el.classList.remove('selected'));
                    selectedTowerType = 'hero_' + hkey;
                    slot.classList.add('selected');
                }
            });

            const img = document.createElement('img');
            img.className = 'tower-icon';
            if (IMG.hero && IMG.hero[hkey]) {
                img.src = IMG.hero[hkey].src;
            } else {
                img.alt = '🦸';
            }
            img.draggable = false;
            slot.appendChild(img);

            const costSpan = document.createElement('div');
            costSpan.className = 'tower-cost';
            costSpan.textContent = cost + '🪙';
            slot.appendChild(costSpan);

            const indicator = document.createElement('div');
            indicator.className = 'indicator';
            if (coins < cost) {
                indicator.classList.add('red');
            } else {
                indicator.classList.add('green');
            }
            slot.appendChild(indicator);

            sidebar.appendChild(slot);
        }
    }

    // ================================================================
    // CANVAS DRAG & DROP
    // ================================================================
    canvas.addEventListener('dragover', (e) => {
        e.preventDefault();
    });

    canvas.addEventListener('drop', (e) => {
        e.preventDefault();
        const data = e.dataTransfer.getData('text/plain');
        if (!data) return;

        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const col = Math.floor(mx / cellW);
        const row = Math.floor(my / cellH);

        if (col >= 0 && col < COLS && row >= 0 && row < ROWS && isBuildable(col, row)) {
            if (data.startsWith('hero_')) {
                const heroType = data.substring(5);
                placeHero(col, row, heroType);
            } else {
                addTower(col, row, data);
            }
        } else {
            log('❌ Cannot place tower here');
        }
    });

    // ================================================================
    // CANVAS CLICK
    // ================================================================
    function canvasClick(e) {
        if (gameOverFlag) return;
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const col = Math.floor(mx / cellW);
        const row = Math.floor(my / cellH);

        if (col >= 0 && col < COLS && row >= 0 && row < ROWS) {
            const idx = towers.findIndex(t => t.col === col && t.row === row);
            if (idx !== -1) {
                showTowerPopup(idx);
                drawCanvas();
                return;
            } else {
                closePopup();
                selectedTowerIndex = -1;

                if (isBuildable(col, row)) {
                    if (selectedTowerType) {
                        if (selectedTowerType.startsWith('hero_')) {
                            const heroType = selectedTowerType.substring(5);
                            if (placeHero(col, row, heroType)) {
                                log(`✅ Placed ${HERO_DEFS[heroType].name}`);
                                updateUI();
                            }
                        } else {
                            if (addTower(col, row, selectedTowerType)) {
                                log(`✅ Placed ${TOWER_TYPES[selectedTowerType].name}`);
                                updateUI();
                            }
                        }
                    } else {
                        log('👆 Select a tower/hero from the sidebar first, or drag it onto the map.');
                    }
                } else {
                    log('❌ Path tile');
                }
                drawCanvas();
            }
        } else {
            closePopup();
            selectedTowerIndex = -1;
            drawCanvas();
        }
    }

    // ================================================================
    // RESIZE
    // ================================================================
    function resizeGameCanvas() {
        const container = canvas.parentElement;
        const rect = container.getBoundingClientRect();
        const w = rect.width;
        const h = rect.height;
        const aspect = ROWS / COLS;
        let cw, ch;
        if (w / h > COLS / ROWS) {
            ch = h;
            cw = ch / aspect;
        } else {
            cw = w;
            ch = cw * aspect;
        }
        canvas.width = cw;
        canvas.height = ch;
        canvas.style.width = cw + 'px';
        canvas.style.height = ch + 'px';
        cellW = canvas.width / COLS;
        cellH = canvas.height / ROWS;
        drawCanvas();
        for (let h of placedHeroes) {
            const t = towers[h.towerIndex];
            if (t) {
                h.x = t.col * cellW + cellW/2;
                h.y = t.row * cellH + cellH/2;
            }
        }
    }

    // ================================================================
    // GAME LOOP
    // ================================================================
    let lastFrame = 0;
    function gameLoop(now) {
        let delta = Math.min(60, (now - lastFrame) || 16) * speedMultiplier;
        lastFrame = now;
        if (flagCarrier && !flagCarrier.done) updateFlagCarrier(delta);
        if (!gameOverFlag && waveActive && !paused) {
            if (!isScoutWave) {
                updateEnemies(delta);
                updateTowers(delta);
                updateProjectiles(delta);
                updateSpikes(delta);
                updateSpawning(delta);
                updateHero(delta);
                if (enemies.length === 0 && spawnRemaining === 0 && miniGroupRemaining === 0 && waveActive) endWave(true);
                if (lives <= 0) gameOver();
                updateUI();
            }
        }
        drawCanvas();
        requestAnimationFrame(gameLoop);
    }

    // ================================================================
    // DIFFICULTY MODAL
    // ================================================================
    let selectedDiff = currentDifficulty;

    function showDifficultyModal() {
        diffOptions.innerHTML = '';
        for (let [key, def] of Object.entries(DIFFICULTY_UNLOCK)) {
            const unlocked = unlockedDifficulties.includes(key);
            const opt = document.createElement('div');
            opt.className = 'diff-option' + (unlocked ? '' : ' locked') + (key === selectedDiff ? ' selected' : '');
            opt.innerHTML = `<div class="name">${def.label}</div><div class="desc">${def.desc}</div><div class="unlock">${unlocked ? '✅ Unlocked' : '🔒 ' + def.unlockText}</div>`;
            if (unlocked) {
                opt.addEventListener('click', () => {
                    document.querySelectorAll('.diff-option').forEach(el => el.classList.remove('selected'));
                    opt.classList.add('selected');
                    selectedDiff = key;
                });
            }
            diffOptions.appendChild(opt);
        }
        diffModal.classList.add('active');
    }

    function hideDifficultyModal() {
        diffModal.classList.remove('active');
    }

    function confirmDifficultySelection() {
        if (selectedDiff !== currentDifficulty) {
            setDifficulty(selectedDiff);
        } else {
            fullReset();
        }
        hideDifficultyModal();
    }

    diffCancel.addEventListener('click', hideDifficultyModal);
    diffConfirm.addEventListener('click', confirmDifficultySelection);

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Override difficulty from URL
        if (urlParams.difficulty) {
            currentDifficulty = urlParams.difficulty;
            localStorage.setItem('td_difficulty', currentDifficulty);
            diffSettings = applyDifficultySettings();
        }

        // Mode
        if (urlParams.mode === 'continue') {
            const loaded = loadGameState();
            if (!loaded) {
                log('📂 No save found, starting new game.');
                regenerateMap(true);
            } else {
                if (waveActive && !gameOverFlag) {
                    for (let i=0; i<towers.length; i++) {
                        if (towers[i].type === 'farm') startFarmIncome(i);
                        if (towers[i].type === 'poison') startPoisonAura(i);
                        if (towers[i].type === 'bomber') startSpikeFactory(i);
                    }
                }
                for (let h of placedHeroes) {
                    const t = towers[h.towerIndex];
                    if (t) {
                        h.x = t.col * cellW + cellW/2;
                        h.y = t.row * cellH + cellH/2;
                    }
                }
                updateUI();
                drawCanvas();
                log('📂 Game continued from save!');
            }
        } else if (urlParams.mode === 'custom') {
            const stored = localStorage.getItem('td_customMap');
            if (stored) {
                try {
                    const pathData = JSON.parse(stored);
                    if (pathData && pathData.length > 1) {
                        importMapFromData(pathData);
                    }
                } catch(e) {}
            } else {
                log('❌ No custom map found. Generating random.');
                regenerateMap(true);
            }
        } else {
            // New game: reset state and generate a fresh random map
            localStorage.removeItem('td_saveGame');
            let livesOverride = diffSettings.livesOverride;
            if (livesOverride !== null) lives = livesOverride;
            else lives = baseLives + extraLives;
            coins = baseStartingCoins + extraStartingCash;
            currentKills = 0; wave = 0;
            waveActive = false; gameOverFlag = false;
            enemies = []; towers = []; projectiles = []; spikes = []; explosions = [];
            towerKills = []; towerDamage = []; towerIncome = [];
            selectedTowerIndex = -1; closePopup();
            firstFarmBuilt = false; firstArcherFreeUsed = false; placedHeroes = [];
            if (autoWaveTimer) clearTimeout(autoWaveTimer);
            stopAllIntervals();
            flagCarrier = null; flagCarrierActive = false; flagPlanted = false;
            isScoutWave = false; scoutWaveComplete = false;
            regenerateMap(true);
            updateUI();
            log("🆕 New game started with random map.");
        }

        resizeGameCanvas();
        updateUI();
        canvas.addEventListener('click', canvasClick);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            canvasClick({ clientX: touch.clientX, clientY: touch.clientY });
        }, { passive: false });

        window.addEventListener('resize', resizeGameCanvas);

        // ---- SAVE INTERVAL (auto-save) ----
        let saveIntervalId = null;

        function startSaveInterval() {
            if (saveIntervalId) clearInterval(saveIntervalId);
            saveIntervalId = setInterval(saveGameState, 10000);
        }

        function stopSaveInterval() {
            if (saveIntervalId) {
                clearInterval(saveIntervalId);
                saveIntervalId = null;
            }
        }

        // Start the interval
        startSaveInterval();

        // ---- Handle visibility changes ----
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopSaveInterval();
            } else {
                startSaveInterval();
            }
        });

        // ---- Save on page unload ----
        window.addEventListener('beforeunload', () => {
            if (saveIntervalId) {
                saveGameState();
            }
        });

        // ---- Message listener ----
        window.addEventListener('message', (e) => {
            const data = e.data;

            // ---- APP HIDDEN / VISIBLE – stop/restart auto-save ----
            if (data?.type === 'appHidden') {
                stopSaveInterval();
                saveGameState();
                if (!paused) { togglePause(); pausedByParent = true; }
            } else if (data?.type === 'appVisible') {
                startSaveInterval();
                if (pausedByParent) { togglePause(); pausedByParent = false; }
            }

            // ---- HARD RESET – full wipe ----
            else if (data?.type === 'hardReset') {
                stopSaveInterval();
                // Clear ALL game data from localStorage
                clearAllGameData();
                // Reset the game state
                fullReset();
                // Also reset the in-memory variables that fullReset might not touch
                // (We already reset them in clearAllGameData)
                // Force a reload of the map and game state
                regenerateMap(true);
                updateUI();
                drawCanvas();
                log('💥 Hard reset complete – all data wiped.');
            }

            // ---- OTHER MESSAGES ----
            else if (data?.type === 'freeDrawToggle') {
                freeDrawMode = data.state;
                localStorage.setItem('td_freeDrawMode', freeDrawMode);
                log(freeDrawMode ? '🔓 Free Draw Mode ON' : '🔒 Free Draw Mode OFF');
            } else if (data?.type === 'unlimitedHeroesToggle') {
                unlimitedHeroesMode = data.state;
                localStorage.setItem('td_unlimitedHeroesMode', unlimitedHeroesMode);
                log(unlimitedHeroesMode ? '🔓 Unlimited Heroes ON' : '🔒 Unlimited Heroes OFF');
            } else if (data?.type === 'customMap') {
                importMapFromData(data.path);
            } else if (data?.type === 'heroSelected') {
                selectedHero = data.hero;
                localStorage.setItem('td_selectedHero', selectedHero);
                log(`🦸 Hero selected: ${selectedHero || 'none'}`);
                updateUI();
            }
        });

        requestAnimationFrame(gameLoop);
        log("⚔️ Game ready. Build a tower to start!");
    }

    function importMapFromData(pathData) {
        if (!pathData || pathData.length < 2) {
            log("❌ Invalid path data");
            return;
        }
        let valid = true;
        for (let i=1; i<pathData.length; i++) {
            let dx = Math.abs(pathData[i].x - pathData[i-1].x);
            let dy = Math.abs(pathData[i].y - pathData[i-1].y);
            if (dx + dy !== 1) { valid = false; break; }
        }
        if (pathData[0].x !== 0) valid = false;
        if (pathData[pathData.length-1].x !== 23) valid = false;
        if (!valid) {
            log("❌ Path must be contiguous, start at column 0, and end at column 23");
            return;
        }
        localStorage.setItem('td_customMap', JSON.stringify(pathData));
        if (autoWaveTimer) clearTimeout(autoWaveTimer);
        stopAllIntervals();
        closePopup();
        pathCells = pathData.map(p => ({x:p.x, y:p.y}));
        towers = []; spikes = []; projectiles = []; enemies = []; explosions = [];
        towerKills = []; towerDamage = []; towerIncome = [];
        waveActive = false; wave = 0;
        selectedTowerIndex = -1;
        flagCarrier = null; flagCarrierActive = false; flagPlanted = false;
        isScoutWave = false; scoutWaveComplete = false;
        firstFarmBuilt = false; firstArcherFreeUsed = false; placedHeroes = [];
        gameOverFlag = false;
        let livesOverride = diffSettings.livesOverride;
        lives = (livesOverride !== null) ? livesOverride : (baseLives + extraLives);
        coins = baseStartingCoins + extraStartingCash;
        currentKills = 0;
        drawCanvas();
        updateUI();
        log("🗺️ Custom map loaded! Build a tower to start.");
        saveGameState();
    }

    // ================================================================
    // EXPOSE FUNCTIONS
    // ================================================================
    window.fullReset = fullReset;
    window.setDifficulty = setDifficulty;
    window.togglePause = togglePause;
    window.forceWave = forceWave;
    window.showDifficultyModal = showDifficultyModal;
    window.toggleTurbo = toggleTurbo;

    // ================================================================
    // LOAD IMAGES THEN START
    // ================================================================
    loadImages(() => {
        console.log('✅ All images loaded!');
        init();
    });

})();
</script>
