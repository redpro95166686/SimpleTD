<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>⚔️ SIMPLE TD</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0c16; font-family: 'Inter', system-ui, sans-serif; height: 100vh; overflow: hidden; color: #f0ece3; }
        .canvas-wrapper { position: relative; width: 100vw; height: 100vh; background: #030b07; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        canvas { display: block; background: #1c3b2f; cursor: crosshair; border-radius: 0; image-rendering: pixelated; }

        .hamburger-btn { position: absolute; top: 16px; left: 16px; width: 40px; height: 40px; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; cursor: pointer; z-index: 20; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; padding: 6px; transition: 0.2s; }
        .hamburger-btn:hover { background: rgba(0,0,0,0.8); border-color: rgba(255,255,255,0.15); }
        .hamburger-btn .line { width: 22px; height: 2px; background: #f0ece3; border-radius: 2px; transition: 0.2s; }
        .hamburger-btn .line.middle { width: 16px; align-self: flex-start; margin-left: 6px; }

        .dropdown { position: absolute; top: 64px; left: 16px; background: rgba(8,18,22,0.92); backdrop-filter: blur(16px); border: 1px solid rgba(80,180,140,0.2); border-radius: 12px; padding: 6px; z-index: 20; min-width: 160px; display: none; flex-direction: column; gap: 2px; box-shadow: 0 12px 40px rgba(0,0,0,0.6); }
        .dropdown.open { display: flex; }
        .dropdown-item { padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 500; color: #f0ece3; transition: 0.15s; display: flex; align-items: center; gap: 8px; border: none; background: transparent; width: 100%; text-align: left; }
        .dropdown-item:hover { background: rgba(255,255,255,0.06); }
        .dropdown-item:active { transform: scale(0.97); }
        .dropdown-item .icon { font-size: 1.1rem; width: 22px; text-align: center; }
        .dropdown-divider { height: 1px; background: rgba(255,255,255,0.06); margin: 4px 8px; }

        .canvas-stats-overlay { position: absolute; top: 16px; left: 70px; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); padding: 5px 14px; border-radius: 40px; font-size: 0.75rem; font-weight: bold; color: #ffecb3; display: flex; gap: 14px; z-index: 10; pointer-events: none; font-family: monospace; flex-wrap: wrap; }
        .canvas-stats-overlay span { display: inline-flex; align-items: center; gap: 4px; }
        .level-progress { position: absolute; top: 16px; right: 16px; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); padding: 5px 14px; border-radius: 40px; font-size: 0.7rem; color: #ffecb3; display: flex; align-items: center; gap: 8px; z-index: 10; pointer-events: none; font-family: monospace; }
        .level-progress .track { width: 70px; height: 4px; background: #2a3a2a; border-radius: 2px; overflow: hidden; }
        .level-progress .fill { height: 100%; background: #ffd700; width: 0%; transition: width 0.1s; }

        .tower-sidebar {
            position: fixed;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(8,18,22,0.92);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(80,180,140,0.2);
            border-radius: 12px;
            padding: 8px 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 15;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            max-height: 90vh;
            overflow-y: auto;
            min-width: 70px;
            align-items: center;
            pointer-events: auto;
        }
        .tower-sidebar::-webkit-scrollbar { width: 3px; }
        .tower-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 10px; }

        .tower-slot {
            width: 60px;
            padding: 4px 2px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: grab;
            transition: all 0.15s;
            border: 2px solid transparent;
            position: relative;
            background: rgba(255,255,255,0.04);
            color: #f0ece3;
            font-size: 0.55rem;
            font-weight: 600;
            user-select: none;
            text-align: center;
            min-height: 64px;
            justify-content: center;
        }
        .tower-slot:hover { background: rgba(255,255,255,0.08); }
        .tower-slot.selected { border-color: #ffd700; background: rgba(255,215,0,0.08); }
        .tower-slot.locked { opacity: 0.4; cursor: not-allowed; filter: grayscale(0.6); }
        .tower-slot.locked .tower-icon { filter: grayscale(1); }
        .tower-slot .tower-icon {
            width: 48px;
            height: 48px;
            object-fit: contain;
            display: block;
            margin-bottom: 2px;
            image-rendering: pixelated;
        }
        .tower-slot .tower-cost { font-size: 0.5rem; opacity: 0.7; margin-top: 1px; }
        .tower-slot .indicator {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.5);
            flex-shrink: 0;
        }
        .indicator.green { background: #4eff6e; box-shadow: 0 0 6px rgba(78,255,110,0.5); }
        .indicator.red { background: #ff4444; box-shadow: 0 0 6px rgba(255,68,68,0.4); }
        .indicator.locked-indicator { background: transparent; border: none; font-size: 0.7rem; line-height: 1; top: 0; right: 0; }

        .tower-slot.dragging { opacity: 0.3; }

        .tower-popup { position: fixed; background: rgba(8,18,22,0.95); backdrop-filter: blur(18px); border: 1px solid rgba(244,162,97,0.2); border-radius: 1.2rem; padding: 12px 16px; min-width: 150px; z-index: 90; box-shadow: 0 16px 48px rgba(0,0,0,0.7); pointer-events: auto; color: #f0ece3; font-size: 0.8rem; line-height: 1.5; animation: selectorPop 0.15s ease-out; }
        .tower-popup .popup-close { position: absolute; top: 6px; right: 10px; cursor: pointer; opacity: 0.4; font-size: 0.9rem; transition: 0.15s; }
        .tower-popup .popup-close:hover { opacity: 1; transform: rotate(90deg); }
        .tower-popup .popup-btn { display: inline-block; background: rgba(42,75,62,0.5); border: 1px solid rgba(80,180,140,0.12); border-radius: 0.6rem; padding: 2px 12px; font-size: 0.7rem; font-weight: 600; color: #f0ece3; cursor: pointer; transition: 0.12s; margin: 2px 2px 0 0; user-select: none; }
        .tower-popup .popup-btn:hover { background: rgba(74,110,60,0.7); border-color: rgba(244,162,97,0.3); }
        .tower-popup .popup-btn:active { transform: scale(0.95); }
        .tower-popup .popup-sell { background: rgba(80,30,30,0.4); border-color: rgba(200,80,50,0.15); }
        .tower-popup .popup-sell:hover { background: rgba(120,40,40,0.6); }

        .coin-popup { position: fixed; font-weight: bold; font-size: 1rem; color: #ffdd88; text-shadow: 0 0 12px rgba(255,220,100,0.3); pointer-events: none; z-index: 400; animation: coinFloat 0.6s ease-out forwards; }
        @keyframes coinFloat { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-60px) scale(1.2); } }
        @keyframes farmGlow { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.4) translateY(-20px); } }

        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); z-index: 40; display: none; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: linear-gradient(145deg,#10231e,#07120f); border-radius: 2rem; padding: 1.5rem; max-width: 600px; width: 90%; border: 2px solid #f4a261; color: #f0f0e0; max-height: 80vh; overflow-y: auto; }
        .modal-box h2 { text-align: center; color: #ffcd94; margin-bottom: 1rem; }
        .diff-option { background: #16221e; border-radius: 1rem; padding: 0.8rem; margin-bottom: 0.8rem; border: 1px solid #3a5a4a; cursor: pointer; transition: 0.15s; }
        .diff-option:hover { border-color: #f4a261; background: #1e2e2a; }
        .diff-option.selected { border-color: #ffd700; background: #1a2a1a; }
        .diff-option .name { font-weight: bold; font-size: 1.1rem; }
        .diff-option .desc { font-size: 0.8rem; opacity: 0.85; }
        .diff-option .unlock { font-size: 0.7rem; opacity: 0.6; }
        .diff-option.locked { opacity: 0.5; cursor: not-allowed; }
        .modal-actions { display: flex; gap: 1rem; justify-content: center; margin-top: 1rem; }
        .modal-actions button { padding: 0.5rem 2rem; border-radius: 40px; font-weight: bold; border: none; cursor: pointer; }
        .btn-cancel { background: #6e2f2f; color: #f9e6cf; }
        .btn-confirm { background: #4a6e3c; color: #f9e6cf; }

        @media (max-width: 700px) {
            .hamburger-btn { top: 10px; left: 10px; width: 34px; height: 34px; }
            .hamburger-btn .line { width: 18px; }
            .hamburger-btn .line.middle { width: 14px; margin-left: 4px; }
            .dropdown { top: 52px; left: 10px; min-width: 140px; }
            .canvas-stats-overlay { font-size: 0.6rem; padding: 3px 10px; gap: 8px; top: 10px; left: 56px; }
            .level-progress { font-size: 0.6rem; padding: 3px 10px; top: 10px; right: 10px; }
            .level-progress .track { width: 50px; }
            .tower-sidebar { right: 4px; padding: 6px 4px; min-width: 54px; }
            .tower-slot { width: 48px; min-height: 52px; }
            .tower-slot .tower-icon { width: 36px; height: 36px; }
            .tower-slot .tower-cost { font-size: 0.4rem; }
            .tower-slot .indicator { width: 10px; height: 10px; top: 1px; right: 1px; }
            .indicator.locked-indicator { font-size: 0.5rem; }
        }
        @media (max-width: 500px) {
            .canvas-stats-overlay { font-size: 0.5rem; padding: 2px 8px; gap: 4px; top: 8px; left: 50px; }
            .level-progress { font-size: 0.5rem; padding: 2px 8px; top: 8px; right: 8px; }
            .level-progress .track { width: 40px; }
            .tower-sidebar { right: 2px; padding: 4px 2px; min-width: 44px; gap: 4px; }
            .tower-slot { width: 40px; min-height: 44px; }
            .tower-slot .tower-icon { width: 30px; height: 30px; }
            .tower-slot .tower-cost { display: none; }
            .tower-slot .indicator { width: 8px; height: 8px; top: 0; right: 0; }
        }
    </style>
</head>
<body>
<div class="canvas-wrapper">

    <!-- CANVAS -->
    <canvas id="gameCanvas"></canvas>

    <!-- TOWER SIDEBAR -->
    <div class="tower-sidebar" id="towerSidebar"></div>

    <!-- HAMBURGER MENU -->
    <button class="hamburger-btn" id="hamburgerBtn" aria-label="Menu">
        <span class="line"></span>
        <span class="line middle"></span>
        <span class="line"></span>
    </button>

    <!-- DROPDOWN -->
    <div class="dropdown" id="dropdownMenu">
        <button class="dropdown-item" id="pauseItem"><span class="icon">⏸️</span> Pause</button>
        <button class="dropdown-item" id="musicItem"><span class="icon">🎵</span> Music</button>
        <button class="dropdown-item" id="forceWaveItem"><span class="icon">⚔️</span> Force Wave</button>
        <button class="dropdown-item" id="turboItem"><span class="icon">⏩</span> Toggle Turbo</button>
        <div class="dropdown-divider"></div>
        <button class="dropdown-item" id="menuItem"><span class="icon">🏠</span> Menu</button>
    </div>

    <!-- STATS OVERLAY -->
    <div class="canvas-stats-overlay">
        <span>❤️ <span id="canvasLives">20</span></span>
        <span>🌊 <span id="canvasWave">0</span></span>
        <span>🪙 <span id="canvasCoin">480</span></span>
        <span>💀 <span id="canvasKills">0</span></span>
        <span id="heroDisplay" style="display:none;">🦸 <span id="heroNameDisplay"></span></span>
    </div>

    <!-- LEVEL PROGRESS -->
    <div class="level-progress">
        <span id="levelDisplay">Lv.1</span>
        <span class="track"><span class="fill" id="levelProgressFill" style="width:0%"></span></span>
        <span id="levelKillDisplay">0 / 300</span>
    </div>

    <!-- DIFFICULTY MODAL -->
    <div class="modal-overlay" id="difficultyModal">
        <div class="modal-box">
            <h2>⚔️ Select Difficulty</h2>
            <div id="difficultyOptions"></div>
            <div class="modal-actions">
                <button class="btn-cancel" id="diffModalCancel">Cancel</button>
                <button class="btn-confirm" id="diffModalConfirm">Start Game</button>
            </div>
        </div>
    </div>

</div>

<script>
(function() {
    'use strict';

    // ================================================================
    // URL PARAMETERS
    // ================================================================
    function getURLParams() {
        const params = new URLSearchParams(window.location.search);
        return {
            difficulty: params.get('difficulty') || null,
            mode: params.get('mode') || 'new'
        };
    }
    const urlParams = getURLParams();

    // ================================================================
    // DOM REFS
    // ================================================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const dropdown = document.getElementById('dropdownMenu');
    const pauseItem = document.getElementById('pauseItem');
    const musicItem = document.getElementById('musicItem');
    const forceWaveItem = document.getElementById('forceWaveItem');
    const turboItem = document.getElementById('turboItem');
    const menuItem = document.getElementById('menuItem');
    const diffModal = document.getElementById('difficultyModal');
    const diffOptions = document.getElementById('difficultyOptions');
    const diffCancel = document.getElementById('diffModalCancel');
    const diffConfirm = document.getElementById('diffModalConfirm');

    const canvasLives = document.getElementById('canvasLives');
    const canvasWave = document.getElementById('canvasWave');
    const canvasCoin = document.getElementById('canvasCoin');
    const canvasKills = document.getElementById('canvasKills');
    const heroDisplay = document.getElementById('heroDisplay');
    const heroNameDisplay = document.getElementById('heroNameDisplay');
    const levelDisplay = document.getElementById('levelDisplay');
    const levelProgressFill = document.getElementById('levelProgressFill');
    const levelKillDisplay = document.getElementById('levelKillDisplay');

    const sidebar = document.getElementById('towerSidebar');

    // ================================================================
    // NAVIGATION
    // ================================================================
    function navigateTo(page, params) {
        saveGameState();
        window.parent.postMessage({ type: 'navigate', page: page, params: params }, '*');
    }

    // ================================================================
    // HAMBURGER MENU
    // ================================================================
    let paused = false;
    let turboEnabled = false;

    function toggleDropdown() {
        dropdown.classList.toggle('open');
    }
    function closeDropdown() {
        dropdown.classList.remove('open');
    }

    hamburgerBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleDropdown();
    });

    document.addEventListener('click', (e) => {
        if (!dropdown.contains(e.target) && e.target !== hamburgerBtn) {
            closeDropdown();
        }
    });

    pauseItem.addEventListener('click', () => {
        closeDropdown();
        togglePause();
        const icon = pauseItem.querySelector('.icon');
        if (paused) {
            icon.textContent = '▶️';
            pauseItem.innerHTML = '<span class="icon">▶️</span> Resume';
        } else {
            icon.textContent = '⏸️';
            pauseItem.innerHTML = '<span class="icon">⏸️</span> Pause';
        }
    });

    musicItem.addEventListener('click', () => {
        closeDropdown();
        navigateTo('music');
    });

    forceWaveItem.addEventListener('click', () => {
        closeDropdown();
        forceWave();
    });

    turboItem.addEventListener('click', () => {
        closeDropdown();
        toggleTurbo();
        const icon = turboItem.querySelector('.icon');
        if (turboEnabled) {
            icon.textContent = '⏩';
            turboItem.innerHTML = '<span class="icon">⏩</span> Turbo ON';
        } else {
            icon.textContent = '⏩';
            turboItem.innerHTML = '<span class="icon">⏩</span> Turbo OFF';
        }
    });

    menuItem.addEventListener('click', () => {
        closeDropdown();
        navigateTo('menu');
    });

    // ================================================================
    // PERSISTENT DATA (loaded from localStorage with defaults)
    // ================================================================
    let unlockedTowers = JSON.parse(localStorage.getItem('td_unlockedTowers')) || { archer: true, bomber: false, poison: false, dart: false, farm: false, sniper: false, mage: false };
    let towerMaxLevels = JSON.parse(localStorage.getItem('td_towerMaxLevels')) || { archer: 1, bomber: 1, poison: 1, dart: 1, farm: 1, sniper: 1, mage: 1 };
    let extraStartingCash = parseInt(localStorage.getItem('td_extraCash') || '0');
    let extraLives = parseInt(localStorage.getItem('td_extraLives') || '0');
    let totalGems = parseInt(localStorage.getItem('td_totalGems') || '1');
    let boughtExtraCash = localStorage.getItem('td_boughtExtraCash') === 'true';
    let boughtExtraLives = localStorage.getItem('td_boughtExtraLives') === 'true';
    let playerLevel = parseInt(localStorage.getItem('td_playerLevel') || '1');
    let totalKills = parseInt(localStorage.getItem('td_totalKills') || '0');
    let shards = parseInt(localStorage.getItem('td_shards') || '0');
    let prestigeLevel = parseInt(localStorage.getItem('td_prestigeLevel') || '0');
    let towerUpgrades = JSON.parse(localStorage.getItem('td_towerUpgrades')) || { archer:[false,false,false], bomber:[false,false,false], poison:[false,false,false], dart:[false,false,false], farm:[false,false,false], sniper:[false,false,false], mage:[false,false,false] };
    let knowledgeUpgrades = JSON.parse(localStorage.getItem('td_knowledgeUpgrades')) || { archery:false, serpants:false, heroesChant:false, heroesWallet:false };
    let heroUnlocked = JSON.parse(localStorage.getItem('td_heroUnlocked')) || { clacks:false, spoder:false, minifun:false, trae:false };
    let heroUpgrades = JSON.parse(localStorage.getItem('td_heroUpgrades')) || { clacks:[false,false,false], spoder:[false,false,false], minifun:[false,false,false], trae:[false,false,false] };
    let selectedHero = localStorage.getItem('td_selectedHero') || null;
    let unlimitedHeroesUnlocked = localStorage.getItem('td_unlimitedHeroesUnlocked') === 'true';
    let unlimitedHeroesMode = localStorage.getItem('td_unlimitedHeroesMode') === 'true';
    let freeDrawUnlocked = localStorage.getItem('td_freeDrawUnlocked') === 'true';
    let freeDrawMode = localStorage.getItem('td_freeDrawMode') === 'true';
    let totalCoinsEarned = parseInt(localStorage.getItem('td_totalCoinsEarned') || '0');

    // --- Game constants ---
    const COLS = 24, ROWS = 14;
    let cellW, cellH;
    const baseStartingCoins = 480, baseLives = 20;
    let lives = baseLives + extraLives, coins = baseStartingCoins + extraStartingCash, currentKills = 0, wave = 0;
    let waveActive = false, gameOverFlag = false, autoWaveTimer = null;
    let enemies = [], towers = [], projectiles = [], spikes = [], pathCells = [];
    let selectedTowerIndex = -1, activePopup = null, placementActive = false, pendingPlaceCol = -1, pendingPlaceRow = -1, previewTowerType = null, activeSelectorPanel = null;
    let towerKills = [], towerDamage = [], towerIncome = [];
    let miniWaveActive = false, miniGroupRemaining = 0, groupDelayTimer = 0, spawnRemaining = 0, spawnDelayCounter = 0;
    let explosions = [];
    let flagCarrier = null, flagPlanted = false, flagCarrierActive = false;
    let isScoutWave = false, scoutWaveComplete = false;
    let firstFarmBuilt = false, firstArcherFreeUsed = false, placedHeroes = [];
    let cheatBuffer = "";
    let pausedByParent = false;
    let speedMultiplier = 1.5;
    const DEFAULT_SPEED = 1.5, TURBO_SPEED = 6.0;

    let selectedTowerType = null;

    // --- Difficulty ---
    let currentDifficulty = localStorage.getItem('td_difficulty') || 'easy';
    let unlockedDifficulties = JSON.parse(localStorage.getItem('td_unlockedDifficulties')) || ['easy'];
    let difficultyWaveRecords = JSON.parse(localStorage.getItem('td_difficultyWaveRecords')) || {};

    const DIFFICULTY_UNLOCK = {
        easy: { req: null, label: '🍼 EASY', desc: 'The gentle introduction. Enemies are half as tough.', unlockText: 'Always available' },
        normal: { req: { diff: 'easy', wave: 40 }, label: '🙂 NORMAL', desc: 'The standard experience.', unlockText: 'Reach Wave 40 on EASY' },
        hard: { req: { diff: 'normal', wave: 60 }, label: '🔥 HARD', desc: 'Enemies hit harder and have more health.', unlockText: 'Reach Wave 60 on NORMAL' },
        challenger: { req: { diff: 'normal', wave: 60 }, label: '🥷 CHALLENGER', desc: 'Towers cost 30% more, enemies have double health, only 5 lives.', unlockText: 'Reach Wave 60 on NORMAL' },
        death: { req: [{ diff: 'normal', wave: 80 }, { diff: 'hard', wave: 60 }], label: '💀 DEATH', desc: 'True desperation. Enemies are relentless, and rewards are scarce.', unlockText: 'Reach Wave 80 on NORMAL OR Wave 60 on HARD' },
        hell: { req: [{ diff: 'death', wave: 80 }, { diff: 'hard', wave: 100 }], label: '👿 HELL', desc: 'A true test of skill. Only 1 life, enhancements disabled, and enemies are brutal.', unlockText: 'Reach Wave 80 on DEATH OR Wave 100 on HARD' },
        primal: { req: [{ diff: 'death', wave: 80 }, { diff: 'hard', wave: 100 }], label: '🦍 PRIMAL', desc: 'The ultimate survival challenge. Enemy count ramps up quadratically, bosses are huge, but enemies have half health.', unlockText: 'Reach Wave 80 on DEATH OR Wave 100 on HARD' }
    };

    function checkUnlocks(diff, wave) {
        if (!difficultyWaveRecords[diff] || wave > difficultyWaveRecords[diff]) {
            difficultyWaveRecords[diff] = wave;
            localStorage.setItem('td_difficultyWaveRecords', JSON.stringify(difficultyWaveRecords));
        }
        for (let [key, def] of Object.entries(DIFFICULTY_UNLOCK)) {
            if (unlockedDifficulties.includes(key)) continue;
            let req = def.req;
            if (!req) continue;
            let unlocked = false;
            if (Array.isArray(req)) {
                for (let r of req) {
                    if (difficultyWaveRecords[r.diff] && difficultyWaveRecords[r.diff] >= r.wave) { unlocked = true; break; }
                }
            } else {
                if (difficultyWaveRecords[req.diff] && difficultyWaveRecords[req.diff] >= req.wave) { unlocked = true; }
            }
            if (unlocked) {
                unlockedDifficulties.push(key);
                localStorage.setItem('td_unlockedDifficulties', JSON.stringify(unlockedDifficulties));
                log(`🔓 Unlocked ${key.toUpperCase()} difficulty!`);
            }
        }
    }

    function applyDifficultySettings() {
        let bossHpMult=1, enemyHpMult=1, enemyRewardMult=1, waveBonusMult=1, upgradeCostMult=1, enemySpeedMult=1;
        let deathNoMoneyAfterWave=Infinity, deathNoWaveBonusAfterWave=Infinity;
        let livesOverride=null, enhancementsDisabled=false, enemyCountFormula=null, towerCostMult=1;
        if (currentDifficulty === 'easy') { bossHpMult = 0.5; }
        else if (currentDifficulty === 'normal') { /* base */ }
        else if (currentDifficulty === 'hard') { bossHpMult=4; enemyHpMult=2; enemyRewardMult=0.8; waveBonusMult=0.9; upgradeCostMult=1.2; }

    function getKillsRequiredForLevel(level) {
        if (level <= 1) return 0;
        let total = 0;
        for (let i=2; i<=level; i++) {
            let tierI = Math.floor((i-1)/10);
            total += 300 * (tierI + 1);
        }
        return total;
    }
    const MAX_LEVEL=410, KILLS_FOR_MAX = getKillsRequiredForLevel(MAX_LEVEL), PRESTIGE_KILLS=1000000, MAX_PRESTIGE=999;
    function getLevelProgress() {
        let current = totalKills;
        let lv = playerLevel;
        if (lv >= MAX_LEVEL) {
            let killsSinceMax = Math.max(0, current - KILLS_FOR_MAX);
            let prestige = Math.floor(killsSinceMax / PRESTIGE_KILLS);
            if (prestige > MAX_PRESTIGE) prestige = MAX_PRESTIGE;
            let progress = (killsSinceMax % PRESTIGE_KILLS) / PRESTIGE_KILLS;
            return { level:lv, kills:current, needed:KILLS_FOR_MAX + (prestige+1)*PRESTIGE_KILLS, progress:Math.min(1,progress), prestige:prestige, isMax:true };
        } else {
            let needed = getKillsRequiredForLevel(lv+1);
            let currentForLevel = getKillsRequiredForLevel(lv);
            let progress = (current - currentForLevel) / (needed - currentForLevel);
            return { level:lv, kills:current, needed:needed, progress:Math.min(1,progress), prestige:0, isMax:false };
        }
    }

    function checkLevelUp() {
        let needed = getKillsRequiredForLevel(playerLevel + 1);
        while (playerLevel < MAX_LEVEL && totalKills >= needed) {
            playerLevel++;
            if (playerLevel % 10 === 0) { shards++; log(`🎉 Level ${playerLevel}! +1 Upgrade Shard (total ${shards})`); }
            else { log(`⬆️ Level up! Now level ${playerLevel}`); }
            needed = getKillsRequiredForLevel(playerLevel + 1);
        }
        if (playerLevel >= MAX_LEVEL) {
            let killsSinceMax = Math.max(0, totalKills - KILLS_FOR_MAX);
            let newPrestige = Math.floor(killsSinceMax / PRESTIGE_KILLS);
            if (newPrestige > prestigeLevel && newPrestige <= MAX_PRESTIGE) {
                prestigeLevel = newPrestige;
                log(`⭐ Prestige ${prestigeLevel} reached!`);
                if (prestigeLevel >= 500 && !document.body.classList.contains('gold-theme')) {
                    document.body.classList.add('gold-theme');
                    log('✨ Gold theme unlocked!');
                }
                if (prestigeLevel >= 750 && !document.body.classList.contains('green-theme')) {
                    document.body.classList.remove('gold-theme');
                    document.body.classList.add('green-theme');
                    log('🌿 Green theme unlocked!');
                }
            }
        }
        saveAllPersistent();
        updateLevelDisplay();
    }

    function generateRichOrthogonalPath() {
        const minLength=30, maxLength=35, maxAttempts=800;
        let attempts=0, path=null, bestPath=null, bestProgress=0;
        while (attempts < maxAttempts) {
            attempts++;
            let startY = Math.floor(ROWS/2) + (Math.random()<0.5 ? 0 : (Math.random()<0.5 ? 1 : -1));
            startY = Math.min(ROWS-2, Math.max(1, startY));
            let testPath = [{x:0, y:startY}];
            let currentX=0, currentY=startY;
            let visited = new Set();
            visited.add(`0,${startY}`);
            let stuck=false, steps=0;
            while (!stuck && steps < 200) {
                steps++;
                let r = Math.random(), dx=0, dy=0;
                if (r < 0.50) dx = 1;
                else if (r < 0.58) dx = -1;
                else if (r < 0.79) dy = -1;
                else dy = 1;
                let nx = currentX + dx, ny = currentY + dy;
                if (nx < 0) nx = 0;
                if (nx >= COLS) nx = COLS - 1;
                if (ny < 1) ny = 1;
                if (ny > ROWS - 2) ny = ROWS - 2;
                let key = `${nx},${ny}`;
                let attempts2 = 0;
                while (visited.has(key) && attempts2 < 8) {
                    attempts2++;
                    let options = [];
                    if (currentX+1 < COLS) options.push({x:currentX+1, y:currentY});
                    if (currentY+1 < ROWS-1) options.push({x:currentX, y:currentY+1});
                    if (currentY-1 > 0) options.push({x:currentX, y:currentY-1});
                    if (currentX-1 >= 0) options.push({x:currentX-1, y:currentY});
                    options.sort(()=>Math.random()-0.5);
                    let found = false;
                    for (let opt of options) {
                        let k = `${opt.x},${opt.y}`;
                        if (!visited.has(k)) { nx=opt.x; ny=opt.y; found=true; break; }
                    }
                    if (!found) {
                        if (currentX+1 < COLS && !visited.has(`${currentX+1},${currentY}`)) {
                            nx = currentX+1; ny = currentY;
                        } else { stuck = true; break; }
                    }
                    key = `${nx},${ny}`;
                }
                if (stuck) break;
                currentX = nx; currentY = ny;
                if (!visited.has(key)) { visited.add(key); testPath.push({x:currentX, y:currentY}); }
                if (currentX === COLS-1) break;
            }
            if (currentX === COLS-1 && testPath.length >= minLength && testPath.length <= maxLength) {
                path = testPath; break;
            }
            let progress = currentX;
            if (progress > bestProgress && testPath.length <= maxLength) {
                bestProgress = progress; bestPath = testPath;
            }
        }
        if (!path) {
            path = bestPath || [{x:0, y:Math.floor(ROWS/2)}];
            let last = path[path.length-1];
            while (last.x < COLS-1) {
                let nx = last.x+1, ny = last.y;
                if (ny > ROWS-2) ny = ROWS-2;
                if (ny < 1) ny = 1;
                let key = `${nx},${ny}`;
                if (path.some(p=>p.x===nx && p.y===ny)) {
                    let options = [];
                    if (ny+1 < ROWS-1) options.push({x:nx, y:ny+1});
                    if (ny-1 > 0) options.push({x:nx, y:ny-1});
                    if (options.length > 0) {
                        let chosen = options[Math.floor(Math.random()*options.length)];
                        nx = chosen.x; ny = chosen.y;
                    }
                }
                path.push({x:nx, y:ny});
                last = path[path.length-1];
            }
        }
        let unique = [];
        for (let p of path) {
            if (unique.length===0 || unique[unique.length-1].x !== p.x || unique[unique.length-1].y !== p.y) {
                unique.push(p);
            }
        }
        while (unique.length > maxLength) {
            let removeIdx = Math.floor(unique.length/2);
            if (removeIdx > 0 && removeIdx < unique.length-1) {
                unique.splice(removeIdx, 1);
                if (removeIdx < unique.length) {
                    let prev = unique[removeIdx-1];
                    let next = unique[removeIdx];
                    if (Math.abs(prev.x-next.x) + Math.abs(prev.y-next.y) > 1) {
                        let dx = Math.sign(next.x-prev.x), dy = Math.sign(next.y-prev.y);
                        if (dx !== 0 && dy !== 0) {
                            if (Math.random() < 0.5) { next.x = prev.x + dx; } else { next.y = prev.y + dy; }
                        }
                        next.x = Math.min(COLS-1, Math.max(0, next.x));
                        next.y = Math.min(ROWS-2, Math.max(1, next.y));
                    }
                }
            } else { unique.pop(); }
        }
        while (unique.length < minLength) {
            let last = unique[unique.length-1];
            if (last.x > 1) {
                let nx = last.x-1, ny = last.y + (Math.random()<0.5 ? 1 : -1);
                ny = Math.min(ROWS-2, Math.max(1, ny));
                unique.push({x:nx, y:ny});
                if (unique.length < minLength) unique.push({x:last.x, y:ny});
            } else {
                let nx = last.x+1;
                if (nx >= COLS) nx = last.x-1;
                let ny = last.y + (Math.random()<0.5 ? 1 : -1);
                ny = Math.min(ROWS-2, Math.max(1, ny));
                unique.push({x:Math.min(COLS-1, Math.max(0, nx)), y:ny});
            }
        }
        if (unique.length > 0) {
            unique[0] = {x:0, y:Math.min(ROWS-2, Math.max(1, unique[0].y))};
            unique[unique.length-1] = {x:COLS-1, y:Math.min(ROWS-2, Math.max(1, unique[unique.length-1].y))};
        }
        return unique;
    }

    function isBuildable(col, row){ return !pathCells.some(p=>p.x===col && p.y===row); }

    function getTowerStats(type, level) {
        let base = TOWER_TYPES[type];
        let dmg = base.baseDamage + (level-1)*base.upgradeDamage;
        let range = base.baseRange + (level-1)*base.upgradeRange;
        let cd = base.baseCooldown;
        if (type === 'archer') cd = Math.max(35, base.baseCooldown - (level-1)*base.upgradeCooldownReduction);
        else if (type === 'sniper') cd = Math.max(200, base.baseCooldown - (level-1)*20);
        else if (type !== 'bomber' && type !== 'farm' && type !== 'poison' && type !== 'mage') cd = Math.max(15, base.baseCooldown - (level-1)*1.5);
        let upgrades = towerUpgrades[type] || [false,false,false];
        if (type === 'archer' && upgrades[0]) cd *= 0.9;
        if (type === 'sniper' && upgrades[0]) dmg *= 3;
        if (type === 'dart' && upgrades[0]) dmg *= 1.05;
        if (type === 'mage' && upgrades[2]) cd *= 0.75;
        return { damage:dmg, range:range, cooldownMax:cd };
    }

    function getWaveHpMultiplier(w){ return 1 + Math.floor(w/3)*0.15; }
    function getRewardMultiplier(waveNum){ return Math.max(0.2, 1 - waveNum*0.008) * diffSettings.enemyRewardMult; }
    function getWaveBonusMultiplier() {
        if (currentDifficulty === 'death' && wave >= diffSettings.deathNoWaveBonusAfterWave) return 0;
        return diffSettings.waveBonusMult;
    }
    function getUpgradeCostMultiplier(){ return diffSettings.upgradeCostMult; }

    function getEnemyStats(waveNum, enemyType, isBoss=false, bossId=null) {
        let baseHp = 24 + Math.floor(waveNum*1.5);
        let baseReward = (22 + waveNum*0.8) * 0.5 * 0.6;
        let rewardMult = getRewardMultiplier(waveNum);
        if (isBoss && bossId) {
            let boss = BOSS_BASE[bossId];
            let hpMult = boss.baseHpMult * diffSettings.bossHpMult * (1 + (waveNum - boss.threshold)*0.02);
            let rewardMultBoss = boss.baseRewardMult * (0.5 + rewardMult*0.5);
            let hp = Math.floor(baseHp * hpMult * getWaveHpMultiplier(waveNum));
            hp = Math.floor(hp * 2);
            let reward = Math.floor(baseReward * rewardMultBoss);
            let speed = (0.8 + waveNum*0.008) * boss.speedMod * diffSettings.enemySpeedMult;
            return { maxHp:Math.min(12000,hp), reward:Math.max(20,reward), speed:Math.min(1.8,speed), color:boss.color, name:boss.name, icon:boss.icon };
        } else {
            let type = ENEMY_TYPES[enemyType % ENEMY_TYPES.length];
            let hp = Math.floor(baseHp * type.hpMod * getWaveHpMultiplier(waveNum) * diffSettings.enemyHpMult);
            hp = Math.floor(hp * 1.1);
            let reward = Math.floor(baseReward * type.rewardMod * rewardMult);
            let speed = (0.8 + waveNum*0.008) * type.speedMod * diffSettings.enemySpeedMult;
            return { maxHp:Math.min(880,hp), reward:Math.max(5,reward), speed:Math.min(2.2,speed), color:type.color, name:type.name, icon:"" };
        }
    }

    function getEnemyForWave(waveNum) {
        if (waveNum === 40) return { isBoss:true, bossId:'cerberus' };
        if (waveNum === 80) return { isBoss:true, bossId:'behemoth' };
        if (waveNum === 100) return { isBoss:true, bossId:'titan' };
        let roll = Math.random();
        if (waveNum >= 110 && roll < 0.15) return { isBoss:false, bossType:'cerberus' };
        if (waveNum >= 150 && roll < 0.1) return { isBoss:false, bossType:'behemoth' };
        if (waveNum >= 200 && roll < 0.08) return { isBoss:false, bossType:'titan' };
        return { isBoss:false, normalType:Math.floor(Math.random()*ENEMY_TYPES.length) };
    }

    // ================================================================
    // FARM, POISON, BOMBER
    // ================================================================
    function startFarmIncome(idx) {
        let t = towers[idx];
        if (!t || t.type !== 'farm') return;
        if (t.farmInterval) clearInterval(t.farmInterval);
        let income = TOWER_TYPES.farm.incomePerTick + (t.level-1)*4;
        let interval = TOWER_TYPES.farm.incomeInterval;
        if (towerUpgrades.farm[0]) interval /= 1.5;
        let heroBuff = getHeroGlobalBuff();
        if (heroBuff.farmBonus > 0) income = Math.floor(income * (1 + heroBuff.farmBonus/100));
        t.farmInterval = setInterval(() => {
            if (waveActive && !gameOverFlag && !paused) {
                coins += income;
                totalCoinsEarned += income;
                towerIncome[idx] += income;
                updateUI();
                let rect = canvas.getBoundingClientRect();
                let x = t.col*cellW + cellW/2, y = t.row*cellH + cellH/2;
                let sx = rect.left + (x / (canvas.width/rect.width)), sy = rect.top + (y / (canvas.width/rect.width));
                let div = document.createElement('div');
                div.innerText = `+${income}`;
                div.style.cssText = `position:fixed; left:${sx}px; top:${sy}px; color:#ffdd88; font-weight:bold; font-size:1rem; text-shadow:0 0 5px black; pointer-events:none; z-index:400; animation:farmGlow 0.4s ease-out;`;
                document.body.appendChild(div);
                setTimeout(()=>div.remove(), 400);
            }
        }, interval);
    }

    function startPoisonAura(idx) {
        let t = towers[idx];
        if (!t || t.type !== 'poison') return;
        if (t.auraInterval) clearInterval(t.auraInterval);
        let dmg = TOWER_TYPES.poison.auraBaseDmg + (t.level-1)*3;
        let rad = TOWER_TYPES.poison.auraRadius + (t.level-1)*12;
        t.auraInterval = setInterval(() => {
            if (!waveActive || gameOverFlag || paused) return;
            let tx = t.col*cellW + cellW/2, ty = t.row*cellH + cellH/2;
            let slow = towerUpgrades.poison[1] ? 0.3 : 0;
            for (let i=0; i<enemies.length; i++) {
                let e = enemies[i];
                if (Math.hypot(e.posXWorld-tx, e.posYWorld-ty) <= rad) {
                    e.hp -= dmg;
                    if (slow > 0) { e.slowTimer = (e.slowTimer||0) + 650; e.slowAmount = Math.max(e.slowAmount||0, slow); }
                    if (e.hp <= 0) killEnemy(i, idx);
                }
            }
            drawCanvas();
        }, 650);
    }

    function startSpikeFactory(idx) {
        let t = towers[idx];
        if (!t || t.type !== 'bomber') return;
        if (t.spikeIntervalId) clearInterval(t.spikeIntervalId);
        let interval = Math.max(700, TOWER_TYPES.bomber.spikeInterval - (t.level-1)*60);
        t.spikeIntervalId = setInterval(() => {
            if (!waveActive || gameOverFlag || paused) return;
            let range = TOWER_TYPES.bomber.baseRange + (t.level-1)*TOWER_TYPES.bomber.upgradeRange;
            let tx = t.col*cellW + cellW/2, ty = t.row*cellH + cellH/2;
            let valid = pathCells.filter(cell => {
                let cx = cell.x*cellW + cellW/2, cy = cell.y*cellH + cellH/2;
                return Math.hypot(cx-tx, cy-ty) <= range;
            });
            if (!valid.length) return;
            let target = valid[Math.floor(Math.random()*valid.length)];
            let dmg = TOWER_TYPES.bomber.baseDamage + (t.level-1)*TOWER_TYPES.bomber.upgradeDamage;
            spikes.push({ x:target.x, y:target.y, damage:dmg, lifetime:TOWER_TYPES.bomber.spikeLifetime, towerId:idx });
            drawCanvas();
        }, interval);
    }

    function updateSpikes(delta) {
        for (let i=0; i<spikes.length; i++) {
            let s = spikes[i];
            s.lifetime -= delta;
            if (s.lifetime <= 0) { spikes.splice(i,1); i--; continue; }
            let triggered = false;
            for (let ei=0; ei<enemies.length; ei++) {
                let e = enemies[ei];
                let ex = Math.floor(e.posXWorld / cellW), ey = Math.floor(e.posYWorld / cellH);
                if (ex === s.x && ey === s.y) { triggered = true; break; }
            }
            if (triggered) {
                let spikeX=s.x, spikeY=s.y, damage=s.damage, towerId=s.towerId;
                spikes.splice(i,1); i--;
                let rangeMult = 1;
                let tower = towers[towerId];
                if (tower && tower.type==='bomber' && towerUpgrades.bomber[2]) rangeMult = 2;
                let radius = Math.min(cellW,cellH)*0.6*rangeMult;
                explosions.push({ x:spikeX*cellW+cellW/2, y:spikeY*cellH+cellH/2, radius:radius, life:1.0, maxLife:1.0, imgKey:'bomber' });
                let stunDuration = 0;
                if (tower && tower.type==='bomber' && towerUpgrades.bomber[1]) stunDuration = 500;
                for (let ei=enemies.length-1; ei>=0; ei--) {
                    let e = enemies[ei];
                    let ex = Math.floor(e.posXWorld / cellW), ey = Math.floor(e.posYWorld / cellH);
                    if (Math.abs(ex-spikeX) <= 1 && Math.abs(ey-spikeY) <= 1) {
                        e.hp -= damage;
                        if (stunDuration > 0) e.stunTimer = (e.stunTimer||0) + stunDuration;
                        if (e.hp <= 0) killEnemy(ei, towerId);
                    }
                }
            }
        }
        for (let i=0; i<explosions.length; i++) {
            let exp = explosions[i];
            exp.life -= 0.03 * (delta/16);
            exp.radius *= 1.02;
            if (exp.life <= 0) { explosions.splice(i,1); i--; }
        }
    }

    // ================================================================
    // FLAG CARRIER
    // ================================================================
    function updateFlagCarrier(delta) {
        if (!flagCarrier || flagCarrier.done) return;
        let targetIdx = flagCarrier.waypointIndex;
        if (targetIdx >= pathCells.length) {
            flagCarrier.done = true; flagPlanted = true; flagCarrierActive = false; flagCarrier = null;
            scoutWaveComplete = true; isScoutWave = false;
            log("🏁 Flag planted! Wave 0 complete.");
            if (!waveActive && !gameOverFlag && lives > 0) { wave = 1; startWave(); }
            drawCanvas();
            return;
        }
        let target = pathCells[targetIdx];
        let tx = target.x*cellW + cellW/2, ty = target.y*cellH + cellH/2;
        let dx = tx - flagCarrier.x, dy = ty - flagCarrier.y, dist = Math.hypot(dx,dy), speed = 0.22*(delta/16);
        if (dist < speed) { flagCarrier.x = tx; flagCarrier.y = ty; flagCarrier.waypointIndex++; }
        else { let angle = Math.atan2(dy,dx); flagCarrier.x += Math.cos(angle)*speed; flagCarrier.y += Math.sin(angle)*speed; }
        drawCanvas();
    }

    function startScoutWave() {
        if (pathCells.length === 0) return;
        let start = pathCells[0];
        flagCarrier = { x:start.x*cellW+cellW/2, y:start.y*cellH+cellH/2, waypointIndex:1, done:false };
        flagCarrierActive = true; flagPlanted = false; scoutWaveComplete = false; isScoutWave = true;
        wave = 0; waveActive = true;
        log("🏁 WAVE 0: The trusty scout is showing the path...");
        updateUI(); drawCanvas();
    }

    // ================================================================
    // HERO
    // ================================================================
    function placeHero(col, row, heroType) {
        if (!heroType) heroType = selectedHero;
        if (!heroType) { log("No hero selected!"); return false; }
        let def = HERO_DEFS[heroType];
        if (!heroUnlocked[heroType]) { log(`🔒 ${def.name} not unlocked`); return false; }
        if (placedHeroes.some(h=>h.type===heroType)) { log(`⚠️ ${def.name} already placed!`); return false; }
        if (!unlimitedHeroesMode && placedHeroes.length > 0) { log("⚠️ Only one hero allowed unless Unlimited Heroes is enabled."); return false; }
        if (!isBuildable(col,row)) { log("❌ Path tile!"); return false; }
        let cost = def.goldCost;
        if (heroType === 'spoder' && heroUpgrades.spoder[1]) cost = 500;
        if (heroType === 'minifun' && heroUpgrades.minifun[1]) cost = 800;
        if (heroType === 'trae' && heroUpgrades.trae[2]) cost = 1200;
        if (coins < cost) { log(`💰 Need ${cost} coins`); return false; }
        coins -= cost;
        let newTower = { col, row, type:'hero', level:1, cooldown:0, heroType, damageDealt:0, farmCount:0, direction:0, heroIndex:placedHeroes.length };
        towers.push(newTower);
        let towerIdx = towers.length - 1;
        let heroData = { type:heroType, level:1, damageDealt:0, farmCount:0, x:col*cellW+cellW/2, y:row*cellH+cellH/2, towerIndex:towerIdx, direction:0 };
        placedHeroes.push(heroData);
        towerKills.push(0); towerDamage.push(0); towerIncome.push(0);
        log(`🦸 ${def.name} placed!`);
        updateUI(); drawCanvas();
        localStorage.setItem('td_heroPlaced', '1');
        if (towers.length === 1 && !waveActive && !gameOverFlag) { startScoutWave(); }
        return true;
    }

    function updateHero(delta) {
        for (let hIdx=0; hIdx<placedHeroes.length; hIdx++) {
            let hero = placedHeroes[hIdx];
            let idx = hero.towerIndex;
            let t = towers[idx];
            if (!t) continue;
            let def = HERO_DEFS[hero.type];

            if (hero.type === 'clacks') {
                let range = def.range + (t.level-1)*10;
                if (t.cooldown > 0) { t.cooldown -= delta; continue; }
                let tx = t.col*cellW + cellW/2, ty = t.row*cellH + cellH/2;
                let closest=null, minD=Infinity;
                for (let ei=0; ei<enemies.length; ei++) {
                    let e = enemies[ei];
                    let d = Math.hypot(e.posXWorld-tx, e.posYWorld-ty);
                    if (d < range && d < minD && e.hp > 0) { minD=d; closest={e, idx:ei}; }
                }
                if (closest) {
                    let dmg = def.damage(t.level);
                    let targetX = closest.e.posXWorld, targetY = closest.e.posYWorld;
                    explosions.push({ x:targetX, y:targetY, radius:cellW*0.8, life:1.0, maxLife:1.0, imgKey:'clacks' });
                    let stun = heroUpgrades.clacks[2] ? 500 : 0;
                    let extraRange = heroUpgrades.clacks[1] ? 1 : 0;
                    let maxStun = 5 + t.level;
                    let stunnedCount = 0;
                    for (let ei=enemies.length-1; ei>=0; ei--) {
                        let e = enemies[ei];
                        if (Math.hypot(e.posXWorld-targetX, e.posYWorld-targetY) < cellW*(1.2+extraRange*1.2)) {
                            e.hp -= dmg;
                            if (stun > 0 && stunnedCount < maxStun) {
                                e.stunTimer = (e.stunTimer||0) + stun;
                                stunnedCount++;
                            }
                            if (e.hp <= 0) killEnemy(ei, idx);
                        }
                    }
                    let fireRateBonus = def.fireRateBonus(t.level) + (heroUpgrades.clacks[0] ? 0.05 : 0);
                    let cooldown = 200 / (1 + fireRateBonus);
                    cooldown = cooldown * 2;
                    t.cooldown = cooldown;
                    hero.damageDealt += dmg * (enemies.length);
                    checkHeroLevelUp(hero, hIdx);
                }
            } else if (hero.type === 'spoder') {
                let range = def.range + (heroUpgrades.spoder[0] ? 4*24 : 0);
                if (t.cooldown > 0) { t.cooldown -= delta; continue; }
                let tx = t.col*cellW + cellW/2, ty = t.row*cellH + cellH/2;
                let dmg = def.damage(t.level);
                if (heroUpgrades.spoder[2]) dmg *= 2;
                let poisonDmg = def.poisonDmg(t.level);
                let directions = [{x:0,y:-1},{x:1,y:-1},{x:1,y:0},{x:1,y:1},{x:0,y:1},{x:-1,y:1},{x:-1,y:0},{x:-1,y:-1}];
                for (let d of directions) {
                    projectiles.push({ x:tx, y:ty, dx:d.x, dy:d.y, damage:dmg, speed:4, towerId:idx, poison:poisonDmg, poisonDuration:1000, life:400, imgKey:'spoder' });
                }
                t.cooldown = 1600;
                hero.damageDealt += dmg * 8;
                checkHeroLevelUp(hero, hIdx);
            } else if (hero.type === 'minifun') {
                let dirs = [hero.direction];
                if (heroUpgrades.minifun[0]) dirs = [hero.direction, (hero.direction+2)%4];
                let rate = def.fireRate(t.level);
                if (heroUpgrades.minifun[2]) rate = t.level * 4;
                let interval = 2000 / rate;
                t.cooldown -= delta;
                if (t.cooldown > 0) continue;
                t.cooldown = interval;
                let tx = t.col*cellW + cellW/2, ty = t.row*cellH + cellH/2;
                let dmg = def.damage(t.level);
                for (let dir of dirs) {
                    let dx=0, dy=0;
                    if (dir===0) dy=-1;
                    else if (dir===1) dx=1;
                    else if (dir===2) dy=1;
                    else if (dir===3) dx=-1;
                    projectiles.push({
                        x: tx,
                        y: ty,
                        dx: dx,
                        dy: dy,
                        damage: dmg,
                        speed: 6,
                        towerId: idx,
                        life: 999999,
                        imgKey: 'minifun'
                    });
                }
                checkHeroLevelUp(hero, hIdx);
            } else if (hero.type === 'trae') {
                let farmCount = towers.filter(t=>t.type==='farm').length;
                let newLevel = 1;
                if (farmCount >= 2) {
                    let base = Math.floor(farmCount/2);
                    if (base > 8) { newLevel = 8 + Math.floor((farmCount-30)/2); if (newLevel<8) newLevel=8; }
                    else { newLevel = 1 + Math.floor(farmCount/2); if (newLevel>8) newLevel=8; }
                }
                if (newLevel !== t.level) { t.level = newLevel; hero.level = newLevel; log(`🌳 Trae leveled up to ${newLevel}!`); }
            }
            if (hero.type !== 'trae') checkHeroLevelUp(hero, hIdx);
        }
        updateUI(); drawCanvas();
    }

    function checkHeroLevelUp(hero, hIdx) {
        let required = Math.pow(2, hero.level) * 2000;
        if (knowledgeUpgrades.heroesWallet) required /= 2;
        while (hero.damageDealt >= required && hero.level < 999) {
            hero.level++;
            hero.damageDealt -= required;
            required = Math.pow(2, hero.level) * 2000;
            if (knowledgeUpgrades.heroesWallet) required /= 2;
            log(`🦸 ${HERO_DEFS[hero.type].name} leveled up to ${hero.level}!`);
            let t = towers[hero.towerIndex];
            if (t) t.level = hero.level;
            placedHeroes[hIdx] = hero;
        }
    }

    function getHeroGlobalBuff() {
        let buff = { fireRateMult:1, discount:0, farmBonus:0, killBonus:0, waveGold:0 };
        for (let hero of placedHeroes) {
            if (hero.type === 'clacks') {
                let baseBonus = HERO_DEFS.clacks.fireRateBonus(hero.level);
                if (heroUpgrades.clacks[0]) baseBonus += 0.05;
                buff.fireRateMult *= (1 + baseBonus);
            } else if (hero.type === 'spoder') {
                buff.discount += HERO_DEFS.spoder.discountBonus(hero.level);
            } else if (hero.type === 'trae') {
                buff.farmBonus += hero.level;
                buff.killBonus += hero.level;
                buff.waveGold += 100 * hero.level;
            }
        }
        if (knowledgeUpgrades.heroesChant && placedHeroes.length > 0) buff.fireRateMult *= 1.05;
        return buff;
    }

    // ================================================================
    // TOWER ATTACK
    // ================================================================
    function updateTowers(delta) {
        let heroBuff = getHeroGlobalBuff();
        for (let i=0; i<towers.length; i++) {
            let t = towers[i];
            if (t.type === 'farm' || t.type === 'poison' || t.type === 'bomber' || t.type === 'hero') continue;
            if (t.cooldown > 0) { t.cooldown -= delta; continue; }
            let stats = getTowerStats(t.type, t.level);
            let tx = t.col*cellW + cellW/2, ty = t.row*cellH + cellH/2;
            let maxTargets = 1;
            if (t.type === 'archer' && towerUpgrades.archer[2]) maxTargets = 2;
            let mageHits = 2;
            if (t.type === 'mage' && towerUpgrades.mage[1]) mageHits = 3;
            let targets = [];
            for (let ei=0; ei<enemies.length; ei++) {
                let e = enemies[ei];
                let d = Math.hypot(e.posXWorld-tx, e.posYWorld-ty);
                if (d < stats.range && e.hp > 0) targets.push({e, idx:ei, dist:d});
            }
            targets.sort((a,b)=>a.dist-b.dist);
            let toAttack = targets.slice(0, maxTargets);
            for (let target of toAttack) {
                let cd = stats.cooldownMax / heroBuff.fireRateMult;
                t.cooldown = cd;
                let projSpeed = 5.8;
                if (t.type === 'dart' && towerUpgrades.dart[2]) projSpeed *= 3;
                if (t.type === 'sniper' && towerUpgrades.sniper[1]) projSpeed *= 3;
                let proj = { x:tx, y:ty, target:target.e, damage:stats.damage, speed:projSpeed, towerId:i, type:t.type, critical:false, instakill:false, hits:1, imgKey:t.type };
                if (t.type === 'mage') { proj.hits = mageHits; proj.chainRange = TOWER_TYPES.mage.chainRange || 300; }
                projectiles.push(proj);
                let critChance = 0;
                if (t.type === 'archer') { if (towerUpgrades.archer[0]) critChance += 0.04; if (towerUpgrades.archer[1]) critChance += 0.08; }
                if (t.type === 'dart') { if (towerUpgrades.dart[1]) critChance += 0.08; if (towerUpgrades.dart[2]) critChance += 0.12; }
                if (critChance > 0 && Math.random() < critChance) {
                    projectiles[projectiles.length-1].critical = true;
                    projectiles[projectiles.length-1].damage *= 1.5;
                }
                if (t.type === 'sniper' && towerUpgrades.sniper[2] && t.level >= 30 && Math.random() < 0.05) {
                    projectiles[projectiles.length-1].instakill = true;
                }
            }
        }
    }

    function updateProjectiles(delta) {
        for (let i=0; i<projectiles.length; i++) {
            let p = projectiles[i];
            let step = p.speed * (delta/16);
            if (p.dx !== undefined && p.dy !== undefined) {
                p.x += p.dx * step; p.y += p.dy * step; p.life -= delta;
                let hit = false;
                for (let ei=0; ei<enemies.length; ei++) {
                    let e = enemies[ei];
                    if (Math.hypot(e.posXWorld-p.x, e.posYWorld-p.y) < 15) {
                        let dmg = p.damage;
                        e.hp -= dmg;
                        if (p.poison && p.poison > 0) { e.poisonTimer = (e.poisonTimer||0) + p.poisonDuration; e.poisonDmg = (e.poisonDmg||0) + p.poison; }
                        if (e.hp <= 0) killEnemy(ei, p.towerId);
                        else if (p.towerId !== undefined && towers[p.towerId] && towers[p.towerId].type !== 'farm') towerDamage[p.towerId] += dmg;
                        hit = true; break;
                    }
                }
                if (hit || p.life <= 0 || p.x<0 || p.x>canvas.width || p.y<0 || p.y>canvas.height) {
                    projectiles.splice(i,1); i--;
                }
                continue;
            }
            if (!p.target || p.target.hp <= 0) {
                if (p.type === 'mage' && p.hits > 0) {
                    let tx=p.x, ty=p.y;
                    let best=null, bestD=Infinity;
                    for (let ei=0; ei<enemies.length; ei++) {
                        let e = enemies[ei];
                        if (e.hp <= 0) continue;
                        let d = Math.hypot(e.posXWorld-tx, e.posYWorld-ty);
                        if (d < p.chainRange && d < bestD) { bestD=d; best={e, idx:ei}; }
                    }
                    if (best) { p.target = best.e; p.hits--; continue; }
                    else { projectiles.splice(i,1); i--; continue; }
                } else { projectiles.splice(i,1); i--; continue; }
            }
            let dx = p.target.posXWorld - p.x, dy = p.target.posYWorld - p.y;
            let dist = Math.hypot(dx,dy);
            if (dist < step) {
                let idx = enemies.indexOf(p.target);
                if (idx !== -1) {
                    let dmg = p.damage;
                    if (p.instakill) dmg = p.target.hp;
                    p.target.hp -= dmg;
                    if (p.poison && p.poison > 0) { p.target.poisonTimer = (p.target.poisonTimer||0) + p.poisonDuration; p.target.poisonDmg = (p.target.poisonDmg||0) + p.poison; }
                    if (p.target.hp <= 0) killEnemy(idx, p.towerId);
                    else if (p.towerId !== undefined && towers[p.towerId] && towers[p.towerId].type !== 'farm') towerDamage[p.towerId] += dmg;
                    if (p.type === 'mage' && p.hits > 0) {
                        let tx=p.x, ty=p.y;
                        let best=null, bestD=Infinity;
                        for (let ei=0; ei<enemies.length; ei++) {
                            let e = enemies[ei];
                            if (e.hp <= 0) continue;
                            let d = Math.hypot(e.posXWorld-tx, e.posYWorld-ty);
                            if (d < p.chainRange && d < bestD) { bestD=d; best={e, idx:ei}; }
                        }
                        if (best) { p.target = best.e; p.hits--; p.x = p.target.posXWorld; p.y = p.target.posYWorld; continue; }
                        else { projectiles.splice(i,1); i--; continue; }
                    } else { projectiles.splice(i,1); i--; continue; }
                } else { projectiles.splice(i,1); i--; continue; }
            } else {
                let angle = Math.atan2(dy,dx);
                p.x += Math.cos(angle)*step; p.y += Math.sin(angle)*step;
            }
        }
    }

    function updateEnemies(delta) {
        if (!waveActive || paused) return;
        let move = 0.22*(delta/16);
        for (let i=0; i<enemies.length; i++) {
            let e = enemies[i];
            if (e.stunTimer > 0) { e.stunTimer -= delta; continue; }
            if (e.poisonTimer > 0) {
                e.hp -= e.poisonDmg * (delta/1000);
                e.poisonTimer -= delta;
                if (e.hp <= 0) { killEnemy(i); continue; }
            }
            let speedMod = 1;
            if (e.slowTimer > 0) {
                speedMod = 1 - (e.slowAmount||0);
                e.slowTimer -= delta;
                if (e.slowTimer < 0) e.slowTimer = 0;
            }
            let step = e.speed * move * speedMod;
            if (e.waypointIndex >= pathCells.length) {
                lives--;
                enemies.splice(i,1); i--;
                updateUI();
                if (lives <= 0) gameOver();
                continue;
            }
            let target = pathCells[e.waypointIndex];
            let tx = target.x*cellW + cellW/2, ty = target.y*cellH + cellH/2;
            let dx = tx - e.posXWorld, dy = ty - e.posYWorld, dist = Math.hypot(dx,dy);
            if (dist < step) { e.posXWorld = tx; e.posYWorld = ty; e.waypointIndex++; }
            else { let angle = Math.atan2(dy,dx); e.posXWorld += Math.cos(angle)*step; e.posYWorld += Math.sin(angle)*step; }
        }
    }

    function spawnSingleEnemy() {
        if (!waveActive || gameOverFlag || paused) return;
        if (spawnRemaining <= 0) return;
        let start = pathCells[0];
        let decision = getEnemyForWave(wave);
        let stats;
        if (decision.isBoss) { stats = getEnemyStats(wave, 0, true, decision.bossId); }
        else if (decision.bossType) {
            let boss = BOSS_BASE[decision.bossType];
            let baseHp = 24 + Math.floor(wave*1.5);
            let hpMult = boss.baseHpMult * diffSettings.bossHpMult * 0.4;
            let rewardMult = boss.baseRewardMult * 0.3;
            let hp = Math.floor(baseHp * hpMult * getWaveHpMultiplier(wave));
            hp = Math.floor(hp * 2);
            let reward = Math.floor((22+wave*0.8)*0.5*0.6 * rewardMult * getRewardMultiplier(wave));
            let speed = (0.8+wave*0.008) * boss.speedMod * diffSettings.enemySpeedMult * 1.1;
            stats = { maxHp:Math.min(6000,hp), reward:Math.max(10,reward), speed:Math.min(1.9,speed), color:boss.color, name:boss.name, icon:boss.icon };
        } else {
            stats = getEnemyStats(wave, decision.normalType, false);
        }
        enemies.push({
            waypointIndex:1,
            hp:stats.maxHp, maxHp:stats.maxHp, reward:stats.reward, speed:stats.speed,
            posXWorld:start.x*cellW+cellW/2, posYWorld:start.y*cellH+cellH/2,
            color:stats.color, name:stats.name||(decision.bossType?BOSS_BASE[decision.bossType].name:"Enemy"),
            icon:stats.icon||(decision.bossType?BOSS_BASE[decision.bossType].icon:""),
            stunTimer:0, slowTimer:0, slowAmount:0
        });
        spawnRemaining--;
        if (miniGroupRemaining > 0) miniGroupRemaining--;
    }

    function updateSpawning(delta) {
        if (paused) return;
        if (!waveActive || gameOverFlag) return;
        if (isScoutWave) return;
        if (spawnRemaining <= 0 && miniGroupRemaining === 0) return;
        if (wave >= 5 && miniWaveActive) {
            if (miniGroupRemaining > 0) {
                spawnDelayCounter += delta;
                if (spawnDelayCounter >= 80) { spawnDelayCounter = 0; spawnSingleEnemy(); }
            } else if (spawnRemaining > 0) {
                if (groupDelayTimer <= 0) {
                    let groupSize = Math.min(spawnRemaining, 3 + Math.floor(Math.random()*3));
                    miniGroupRemaining = groupSize;
                    groupDelayTimer = 1500;
                } else { groupDelayTimer -= delta; }
            }
        } else {
            if (spawnRemaining > 0) {
                spawnDelayCounter += delta;
                if (spawnDelayCounter >= (300+Math.random()*700)) { spawnDelayCounter = 0; spawnSingleEnemy(); }
            }
        }
    }

    function killEnemy(idx, towerId) {
        let e = enemies[idx];
        if (!e) return;
        let rewardAmount = e.reward;
        if (currentDifficulty === 'death' && wave >= diffSettings.deathNoMoneyAfterWave) rewardAmount = 0;
        coins += rewardAmount;
        totalCoinsEarned += rewardAmount;
        currentKills++; totalKills++;
        if (towerId !== undefined && towerId >= 0 && towers[towerId] && towers[towerId].type !== 'farm') {
            towerKills[towerId]++; towerDamage[towerId] += e.maxHp;
        }
        enemies.splice(idx,1);
        updateUI();
        checkLevelUp();
        if (enemies.length===0 && spawnRemaining===0 && miniGroupRemaining===0 && waveActive) endWave(true);
    }

    // ================================================================
    // WAVE CONTROL
    // ================================================================
    function startWave() {
        if (gameOverFlag || waveActive) return;
        if (wave === 0 && !scoutWaveComplete) return;
        if (wave === 0 && scoutWaveComplete) wave = 1;
        waveActive = true;
        let enemyCount;
        if (diffSettings.enemyCountFormula) { enemyCount = diffSettings.enemyCountFormula(wave); }
        else { enemyCount = 4 + Math.floor(wave*0.8); }
        if (wave === 40 || wave === 80 || wave === 100) enemyCount = 1;
        spawnRemaining = enemyCount;
        spawnDelayCounter = 0;
        miniGroupRemaining = 0;
        groupDelayTimer = 0;
        miniWaveActive = (wave >= 5);
        for (let i=0; i<towers.length; i++) {
            if (towers[i].type === 'farm') startFarmIncome(i);
            if (towers[i].type === 'poison') startPoisonAura(i);
            if (towers[i].type === 'bomber') startSpikeFactory(i);
        }
        let traeHeroes = placedHeroes.filter(h=>h.type==='trae');
        for (let hero of traeHeroes) {
            let gold = 100 * hero.level;
            coins += gold;
            totalCoinsEarned += gold;
            if (hero.towerIndex !== undefined) { towerIncome[hero.towerIndex] = (towerIncome[hero.towerIndex]||0) + gold; }
            log(`🌳 Trae gave +${gold} gold this wave`);
        }
        log(`🌊 WAVE ${wave} — ${enemyCount} enemies`);
        updateUI();
    }

    function endWave(victory) {
        waveActive = false;
        stopAllIntervals();
        if (victory) {
            if (wave > 0) {
                let bonus = Math.floor((70 + wave*3) * 0.5 * getWaveBonusMultiplier());
                coins += bonus;
                totalCoinsEarned += bonus;
                totalGems += 1;
                log(`🏆 CLEAR! +${bonus}🪙 +1💎`);
                if (towerUpgrades.bomber[0]) {
                    let extra = spikes.length;
                    if (extra > 0) {
                        coins += extra;
                        totalCoinsEarned += extra;
                        log(`💣 Bombs away: +${extra}🪙 for unexploded bombs`);
                        let bomberTower = towers.find(t=>t.type==='bomber');
                        if (bomberTower) showCoinPopup(bomberTower.col*cellW+cellW/2, bomberTower.row*cellH+cellH/2, `+${extra}🪙`);
                        else showCoinPopup(canvas.width/2, canvas.height/2, `+${extra}🪙`);
                        spikes = [];
                    }
                }
                if (towerUpgrades.poison[2]) {
                    let poisonTowers = towers.filter(t=>t.type==='poison' && t.level>=30);
                    let extraLivesGain = poisonTowers.length;
                    if (extraLivesGain > 0) {
                        let maxLives = knowledgeUpgrades.serpants ? Infinity : 25;
                        let newLives = Math.min(lives + extraLivesGain, maxLives);
                        if (newLives > lives) { let gained = newLives - lives; lives = newLives; log(`🐍 Venom extra lives: +${gained} ❤️`); updateUI(); }
                    }
                }
                for (let hero of placedHeroes) {
                    if (hero.type === 'trae' && heroUpgrades.trae[0] && hero.level >= 5) { lives += 1; log(`🌳 Trae gave +1 life (Life Giver)`); }
                }
                checkUnlocks(currentDifficulty, wave);
                saveAllPersistent();
                updateUI();
                if (autoWaveTimer) clearTimeout(autoWaveTimer);
                autoWaveTimer = setTimeout(() => {
                    if (!waveActive && !gameOverFlag && lives > 0 && !paused) { wave++; startWave(); }
                }, 4000);
            } else {
                log("Wave 0 complete (scout)");
                if (autoWaveTimer) clearTimeout(autoWaveTimer);
                autoWaveTimer = setTimeout(() => {
                    if (!waveActive && !gameOverFlag && lives > 0 && !paused) { wave = 1; startWave(); }
                }, 1500);
            }
        }
        enemies = []; projectiles = []; spikes = [];
    }

    function showCoinPopup(x,y,text) {
        let rect = canvas.getBoundingClientRect();
        let sx = rect.left + (x/(canvas.width/rect.width)), sy = rect.top + (y/(canvas.width/rect.width));
        let div = document.createElement('div');
        div.className = 'coin-popup';
        div.innerText = text;
        div.style.left = `${sx}px`;
        div.style.top = `${sy}px`;
        document.body.appendChild(div);
        setTimeout(()=>div.remove(), 800);
    }

    function gameOver() {
        gameOverFlag = true; waveActive = false; stopAllIntervals();
        log(`💀 GAME OVER — wave ${wave}`);
    }

    // ================================================================
    // MAP HANDLING
    // ================================================================
    function clearCustomMap() {
        localStorage.removeItem('td_customMap');
        log('🗺️ Custom map cleared.');
    }

    function regenerateMap(ignoreCustom = false) {
        if (!ignoreCustom) {
            const stored = localStorage.getItem('td_customMap');
            if (stored) {
                try {
                    const pathData = JSON.parse(stored);
                    if (pathData && pathData.length > 1) {
                        let valid = true;
                        for (let i=1; i<pathData.length; i++) {
                            let dx = Math.abs(pathData[i].x - pathData[i-1].x);
                            let dy = Math.abs(pathData[i].y - pathData[i-1].y);
                            if (dx + dy !== 1) { valid = false; break; }
                        }
                        if (pathData[0].x !== 0) valid = false;
                        if (pathData[pathData.length-1].x !== 23) valid = false;
                        if (valid) {
                            pathCells = pathData.map(p => ({x:p.x, y:p.y}));
                            log("🗺️ Custom map loaded from storage.");
                            return;
                        } else {
                            localStorage.removeItem('td_customMap');
                        }
                    }
                } catch(e) {
                    localStorage.removeItem('td_customMap');
                }
            }
        }
        pathCells = generateRichOrthogonalPath();
        log("🗺️ New random map generated.");
    }

    // ================================================================
    // FULL RESET
    // ================================================================
    function fullReset() {
        if (autoWaveTimer) clearTimeout(autoWaveTimer);
        stopAllIntervals();
        let livesOverride = diffSettings.livesOverride;
        if (livesOverride !== null) lives = livesOverride;
        else lives = baseLives + extraLives;
        coins = baseStartingCoins + extraStartingCash;
        currentKills = 0; wave = 0;
        waveActive = false; gameOverFlag = false;
        enemies = []; towers = []; projectiles = []; spikes = []; explosions = [];
        towerKills = []; towerDamage = []; towerIncome = [];
        selectedTowerIndex = -1; closePopup();
        firstFarmBuilt = false; firstArcherFreeUsed = false; placedHeroes = [];
        localStorage.removeItem('td_saveGame');
        drawCanvas();
        updateUI();
        log("🔄 Game reset – map unchanged. Build a tower to start!");
    }

    // ================================================================
    // ADD, UPGRADE, SELL TOWER
    // ================================================================
    function addTower(col, row, type) {
        if (!isBuildable(col,row)) { log("❌ Path tile!"); return false; }
        if (towers.some(t=>t.col===col && t.row===row)) { log("Tower exists"); return false; }
        if (!unlockedTowers[type]) { log(`🔒 ${TOWER_TYPES[type].name} locked`); return false; }
        let cost = TOWER_TYPES[type].baseCost;
        let discount = 0;
        if (type === 'archer' && towerUpgrades.archer[1]) discount += 0.10;
        if (type === 'dart' && towerUpgrades.dart[0]) discount += 0.10;
        if (type === 'farm') {
            if (towerUpgrades.farm[1]) discount += 0.10;
            if (towerUpgrades.farm[2] && !firstFarmBuilt) { discount += 0.30; firstFarmBuilt = true; }
        }
        if (type === 'poison' && towerUpgrades.poison[0]) discount += 0.10;
        if (type === 'bomber' && towerUpgrades.bomber[2]) discount += 0.20;
        if (type === 'mage' && towerUpgrades.mage[0]) discount += 0.08;
        let isFree = false;
        if (type === 'archer' && knowledgeUpgrades.archery && !firstArcherFreeUsed) {
            cost = 0; isFree = true; firstArcherFreeUsed = true;
            log("🏹 First archer is free (Archery Knowledge)");
        } else {
            cost = Math.floor(cost * (1 - discount));
            if (cost < 0) cost = 0;
            let heroBuff = getHeroGlobalBuff();
            if (heroBuff.discount > 0) cost = Math.floor(cost * (1 - heroBuff.discount));
            if (diffSettings.towerCostMult) cost = Math.floor(cost * diffSettings.towerCostMult);
        }
        if (coins < cost) { log(`💰 Need ${cost} coins`); return false; }
        coins -= cost;
        let newTower = { col, row, type, level:1, cooldown:0, farmInterval:null, auraInterval:null, spikeIntervalId:null, stunTimer:0, freeArcher:isFree };
        towers.push(newTower);
        let idx = towers.length - 1;
        towerKills.push(0); towerDamage.push(0); towerIncome.push(0);
        if (type === 'farm') startFarmIncome(idx);
        if (type === 'poison') startPoisonAura(idx);
        if (type === 'bomber') startSpikeFactory(idx);
        log(`✅ Built ${TOWER_TYPES[type].name} Lv1`);
        updateUI(); drawCanvas();
        let totalBuilt = parseInt(localStorage.getItem('td_totalTowersBuilt') || '0');
        localStorage.setItem('td_totalTowersBuilt', totalBuilt + 1);
        if (towers.length === 1 && !waveActive && !gameOverFlag) startScoutWave();
        saveGameState();
        return true;
    }

    function upgradeTower(idx) {
        let t = towers[idx];
        if (t.type === 'hero') { log("Hero upgrades via damage only"); return false; }
        let maxLvl = towerMaxLevels[t.type] || 1;
        if (t.level >= maxLvl) { log(`Max level ${maxLvl}`); return false; }
        let baseCost = TOWER_TYPES[t.type].upgradeCost + (t.level-1)*25;
        let cost = Math.floor(baseCost * getUpgradeCostMultiplier());
        if (t.type === 'poison' && towerUpgrades.poison[0]) cost = Math.floor(cost * 0.95);
        if (t.type === 'mage' && towerUpgrades.mage[0]) cost = Math.floor(cost * 0.92);
        let heroBuff = getHeroGlobalBuff();
        if (heroBuff.discount > 0) cost = Math.floor(cost * (1 - heroBuff.discount));
        if (coins < cost) { log(`💰 Need ${cost}`); return false; }
        coins -= cost;
        t.level++;
        if (t.type === 'farm') { if (t.farmInterval) clearInterval(t.farmInterval); if (waveActive) startFarmIncome(idx); }
        if (t.type === 'poison') { if (t.auraInterval) clearInterval(t.auraInterval); startPoisonAura(idx); }
        if (t.type === 'bomber') { if (t.spikeIntervalId) clearInterval(t.spikeIntervalId); startSpikeFactory(idx); }
        log(`⬆️ Upgraded to Lv${t.level}`);
        updateUI(); drawCanvas(); closePopup(); showTowerPopup(idx);
        saveGameState();
        return true;
    }

    function sellTower(idx) {
        let t = towers[idx];
        if (t.type === 'hero') {
            let heroIndex = placedHeroes.findIndex(h=>h.towerIndex===idx);
            if (heroIndex !== -1) { placedHeroes.splice(heroIndex,1); }
            if (t.farmInterval) clearInterval(t.farmInterval);
            if (t.auraInterval) clearInterval(t.auraInterval);
            if (t.spikeIntervalId) clearInterval(t.spikeIntervalId);
            towers.splice(idx,1);
            towerKills.splice(idx,1); towerDamage.splice(idx,1); towerIncome.splice(idx,1);
            log(`🦸 Hero sold (reappears in shop)`);
            updateUI(); drawCanvas();
            saveGameState();
            return;
        }
        let refund;
        if (t.freeArcher) { refund = 0; log("💰 Free archer sells for 0"); }
        else { refund = Math.floor((TOWER_TYPES[t.type].baseCost + (t.level-1)*TOWER_TYPES[t.type].upgradeCost*0.6) * 0.6); }
        coins += refund;
        if (t.farmInterval) clearInterval(t.farmInterval);
        if (t.auraInterval) clearInterval(t.auraInterval);
        if (t.spikeIntervalId) clearInterval(t.spikeIntervalId);
        towers.splice(idx,1);
        towerKills.splice(idx,1); towerDamage.splice(idx,1); towerIncome.splice(idx,1);
        if (selectedTowerIndex === idx) selectedTowerIndex = -1;
        else if (selectedTowerIndex > idx) selectedTowerIndex--;
        closePopup();
        log(`💰 Sold +${refund} coins`);
        updateUI(); drawCanvas();
        saveGameState();
    }

    // ================================================================
    // CHEAT
    // ================================================================
    function cheatSkipWaves() {
        if (gameOverFlag) { log("Game over"); return; }
        if (isScoutWave) { log("Scout wave in progress, cannot skip"); return; }
        let skip=10, bonusCoins=0, bonusGems=0;
        for (let i=1; i<=skip; i++) {
            let w = wave + i;
            bonusCoins += Math.floor((70 + w*3) * 0.5 * getWaveBonusMultiplier());
            bonusGems += 1;
        }
        wave += skip; coins += bonusCoins; totalGems += bonusGems;
        totalCoinsEarned += bonusCoins;
        saveAllPersistent();
        if (waveActive) endWave(true);
        if (autoWaveTimer) clearTimeout(autoWaveTimer);
        if (!waveActive && !gameOverFlag && lives > 0) startWave();
        updateUI();
        log(`✨ CHEAT 1024: Skipped 10 waves! +${bonusCoins}🪙 +${bonusGems}💎`);
        saveGameState();
    }

    // ================================================================
    // KEYBOARD
    // ================================================================
    window.addEventListener('keydown', (e) => {
        if (e.key >= '0' && e.key <= '9') {
            cheatBuffer += e.key;
            if (cheatBuffer.length > 4) cheatBuffer = cheatBuffer.slice(-4);
            if (cheatBuffer === "1024") { cheatSkipWaves(); cheatBuffer = ""; }
        } else { cheatBuffer = ""; }
        if (e.code === 'Space') { e.preventDefault(); speedMultiplier = turboEnabled ? TURBO_SPEED : TURBO_SPEED; }
    });
    window.addEventListener('keyup', (e) => {
        if (e.code === 'Space') { speedMultiplier = turboEnabled ? TURBO_SPEED : DEFAULT_SPEED; }
    });

    // ================================================================
    // TOGGLE PAUSE
    // ================================================================
    function togglePause() {
        paused = !paused;
        const icon = pauseItem.querySelector('.icon');
        if (paused) {
            icon.textContent = '▶️';
            pauseItem.innerHTML = '<span class="icon">▶️</span> Resume';
        } else {
            icon.textContent = '⏸️';
            pauseItem.innerHTML = '<span class="icon">⏸️</span> Pause';
        }
        log(paused ? "Game Paused" : "Game Resumed");
    }

    // ================================================================
    // TURBO TOGGLE
    // ================================================================
    function toggleTurbo() {
