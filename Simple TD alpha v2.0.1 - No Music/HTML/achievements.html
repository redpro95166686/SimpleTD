<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 Achievements</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at 30% 20%, #0a0c16, #020308);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            color: #f0ece3;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(8, 18, 22, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 2.5rem;
            padding: 1.8rem 2rem 2rem;
            border: 1px solid rgba(80, 180, 140, 0.15);
            box-shadow: 0 30px 60px rgba(0,0,0,0.7);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffcd94, #ffaa66);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 1px;
        }
        .back-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 0.5rem 1.5rem;
            border-radius: 60px;
            color: #f0ece3;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .back-btn:hover {
            background: rgba(255,255,255,0.1);
            transform: scale(1.02);
        }

        /* -------- FILTER / SORT BAR -------- */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.6rem;
            margin: 0.5rem 0 1.2rem;
            background: rgba(0,0,0,0.2);
            border-radius: 1.2rem;
            padding: 0.5rem 1rem;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .filter-bar label {
            font-size: 0.7rem;
            font-weight: 600;
            opacity: 0.6;
            letter-spacing: 0.5px;
            margin-right: 0.2rem;
        }
        .filter-bar select {
            background: rgba(20, 34, 30, 0.6);
            border: 1px solid rgba(80, 180, 140, 0.15);
            border-radius: 40px;
            padding: 0.3rem 1rem;
            color: #f0ece3;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            transition: 0.2s;
        }
        .filter-bar select:hover {
            border-color: rgba(244, 162, 97, 0.3);
        }
        .filter-bar select option {
            background: #0a0c16;
            color: #f0ece3;
        }
        .filter-bar .filter-count {
            font-size: 0.65rem;
            opacity: 0.4;
            margin-left: auto;
        }

        /* -------- PROGRESS BAR -------- */
        .progress-section {
            margin: 0.5rem 0 1.2rem;
            background: rgba(0,0,0,0.3);
            border-radius: 1.2rem;
            padding: 0.6rem 1rem;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .progress-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            font-weight: 600;
            color: #ffecb3;
            margin-bottom: 0.2rem;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.06);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
        }
        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #f4a261, #ffd700);
            border-radius: 20px;
            width: 0%;
            transition: width 0.6s ease;
        }

        /* -------- TROPHY MILESTONES -------- */
        .trophy-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.4rem 1.2rem;
            margin: 0.8rem 0 1.2rem;
            padding: 0.4rem 0.6rem;
            background: rgba(0,0,0,0.15);
            border-radius: 1.2rem;
        }
        .trophy-item {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.7rem;
            font-weight: 600;
            opacity: 0.3;
            transition: 0.3s;
            color: #888;
        }
        .trophy-item.unlocked {
            opacity: 1;
            color: #ffd700;
            text-shadow: 0 0 12px rgba(255,215,0,0.2);
        }
        .trophy-item .trophy-icon {
            font-size: 1.2rem;
        }
        .trophy-item .pct {
            font-size: 0.65rem;
            background: rgba(255,255,255,0.06);
            padding: 0.05rem 0.4rem;
            border-radius: 20px;
        }
        .trophy-item.unlocked .pct {
            background: rgba(255,215,0,0.12);
            color: #ffd700;
        }

        /* -------- GRID -------- */
        .ach-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 0.8rem;
        }
        .ach-card {
            background: rgba(20, 34, 30, 0.35);
            border-radius: 1.2rem;
            padding: 0.8rem 1rem;
            border: 1px solid rgba(80, 180, 140, 0.06);
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .ach-card.unlocked {
            border-color: rgba(255, 215, 0, 0.2);
            background: rgba(30, 50, 40, 0.35);
        }
        .ach-card.locked {
            opacity: 0.5;
            filter: grayscale(0.5);
        }
        .ach-card:hover {
            transform: translateX(4px);
            border-color: rgba(244, 162, 97, 0.15);
        }
        .ach-card .ach-icon {
            font-size: 2rem;
            width: 48px;
            text-align: center;
            flex-shrink: 0;
        }
        .ach-card .ach-info {
            flex: 1;
        }
        .ach-card .ach-info .name {
            font-weight: 600;
            font-size: 0.9rem;
        }
        .ach-card .ach-info .desc {
            font-size: 0.7rem;
            opacity: 0.5;
        }
        .ach-card .ach-status {
            font-size: 0.8rem;
            flex-shrink: 0;
        }
        .ach-card.unlocked .ach-status { color: #ffd700; }
        .ach-card.locked .ach-status { color: #555; }

        .footer {
            margin-top: 1.8rem;
            text-align: center;
            font-size: 0.6rem;
            opacity: 0.25;
            letter-spacing: 0.5px;
        }

        @media (max-width: 640px) {
            .container { padding: 1rem; }
            .ach-grid { grid-template-columns: 1fr; }
            .ach-card { padding: 0.6rem 0.8rem; }
            .trophy-row { gap: 0.3rem; }
            .trophy-item { font-size: 0.6rem; }
            .filter-bar { flex-wrap: wrap; }
            .filter-bar .filter-count { margin-left: 0; width: 100%; text-align: right; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🏆 ACHIEVEMENTS</h1>
        <span class="progress-text" id="progressText">0 / 0</span>
        <button class="back-btn" id="backBtn">⬅ BACK</button>
    </div>

    <!-- Filter / Sort Bar -->
    <div class="filter-bar">
        <label for="filterSelect">🔍 Filter:</label>
        <select id="filterSelect">
            <option value="all">All</option>
            <option value="completed">Completed</option>
            <option value="incomplete">Incomplete</option>
            <option value="normal">Normal Mode</option>
            <option value="rogue">Rogue Mode</option>
            <option value="difficulty">Difficulty Unlocks</option>
        </select>
        <span class="filter-count" id="filterCount">0 achievements</span>
    </div>

    <!-- Progress Bar -->
    <div class="progress-section">
        <div class="progress-top">
            <span>Progress</span>
            <span id="percentageLabel">0%</span>
        </div>
        <div class="progress-bar">
            <div class="fill" id="progressFill" style="width:0%;"></div>
        </div>
    </div>

    <!-- Trophy Milestones -->
    <div class="trophy-row" id="trophyRow">
        <!-- will be filled by JS -->
    </div>

    <!-- Achievement Grid -->
    <div class="ach-grid" id="achGrid"></div>

    <div class="footer">🏆 Achievements unlock automatically as you play</div>
</div>

        { id: 'rogue_kills_100', icon: '💀', name: '100 Rogue Kills', desc: 'Kill 100 enemies in Rogue‑like mode (cumulative)', tags: ['rogue'], check: () => getInt('td_rogue_totalKills') >= 100 },
        { id: 'rogue_kills_1000', icon: '💀', name: '1000 Rogue Kills', desc: 'Kill 1000 enemies in Rogue‑like mode (cumulative)', tags: ['rogue'], check: () => getInt('td_rogue_totalKills') >= 1000 },
        { id: 'rogue_kills_10000', icon: '💀', name: '10000 Rogue Kills', desc: 'Kill 10000 enemies in Rogue‑like mode (cumulative)', tags: ['rogue'], check: () => getInt('td_rogue_totalKills') >= 10000 },
        { id: 'rogue_coins_10000', icon: '🪙', name: '10k Rogue Coins', desc: 'Earn 10,000 coins in Rogue‑like mode (cumulative)', tags: ['rogue'], check: () => getInt('td_rogue_totalCoins') >= 10000 },
        { id: 'rogue_coins_100000', icon: '🪙', name: '100k Rogue Coins', desc: 'Earn 100,000 coins in Rogue‑like mode (cumulative)', tags: ['rogue'], check: () => getInt('td_rogue_totalCoins') >= 100000 },
        { id: 'rogue_coins_1000000', icon: '🪙', name: '1M Rogue Coins', desc: 'Earn 1,000,000 coins in Rogue‑like mode (cumulative)', tags: ['rogue'], check: () => getInt('td_rogue_totalCoins') >= 1000000 },
        { id: 'rogue_archer_only', icon: '🏹', name: 'Archer Only', desc: 'Win a Rogue‑like run using only Archers', tags: ['rogue'], check: () => getInt('td_rogue_archer_only') >= 1 },
    ];

    // ================================================================
    // HELPERS
    // ================================================================
    function getData(key, fallback) {
        const val = localStorage.getItem(key);
        if (val === null || val === undefined) return fallback;
        try { return JSON.parse(val); } catch(e) { return val; }
    }
    function getInt(key, fallback = 0) {
        const val = localStorage.getItem(key);
        if (val === null || val === undefined) return fallback;
        return parseInt(val) || fallback;
    }
    function getWaveBest() {
        const records = getData('td_difficultyWaveRecords', {});
        let best = 0;
        for (let key in records) {
            if (records[key] > best) best = records[key];
        }
        return best;
    }

    // ================================================================
    // LOAD / CHECK ACHIEVEMENTS
    // ================================================================
    function checkAchievements() {
        const unlocked = getData('td_achievements', {});
        let total = ACHIEVEMENTS.length;
        let count = 0;

        ACHIEVEMENTS.forEach(ach => {
            const isUnlocked = unlocked[ach.id] || false;
            if (isUnlocked) count++;
        });

        let changed = false;
        ACHIEVEMENTS.forEach(ach => {
            if (!unlocked[ach.id] && ach.check()) {
                unlocked[ach.id] = true;
                changed = true;
                console.log(`🏆 Achievement Unlocked: ${ach.name}!`);
            }
        });

        if (changed) {
            localStorage.setItem('td_achievements', JSON.stringify(unlocked));
        }

        return { unlocked, total, count };
    }

    // ================================================================
    // FILTER & RENDER
    // ================================================================
    let currentFilter = 'all';

    function getFilteredAchievements(unlocked) {
        const filter = document.getElementById('filterSelect').value;
        currentFilter = filter;
        let filtered = ACHIEVEMENTS.filter(ach => {
            const isUnlocked = unlocked[ach.id] || false;
            // Filter by status
            if (filter === 'completed' && !isUnlocked) return false;
            if (filter === 'incomplete' && isUnlocked) return false;
            // Filter by mode
            if (filter === 'normal' && !ach.tags.includes('normal')) return false;
            if (filter === 'rogue' && !ach.tags.includes('rogue')) return false;
            if (filter === 'difficulty' && !ach.tags.includes('difficulty')) return false;
            return true;
        });
        return filtered;
    }

    function renderAchievements() {
        const { unlocked, total, count } = checkAchievements();
        const pct = total > 0 ? Math.round((count / total) * 100) : 0;

        // Update progress bar (global)
        document.getElementById('progressFill').style.width = pct + '%';
        document.getElementById('percentageLabel').textContent = pct + '%';
        document.getElementById('progressText').textContent = `${count} / ${total}`;

        // Trophy milestones (global)
        const milestones = [10, 25, 33, 50, 65, 75, 90, 95, 100];
        const trophyRow = document.getElementById('trophyRow');
        trophyRow.innerHTML = '';
        milestones.forEach(m => {
            const div = document.createElement('div');
            div.className = 'trophy-item' + (pct >= m ? ' unlocked' : '');
            div.innerHTML = `
                <span class="trophy-icon">${pct >= m ? '🏆' : '🏅'}</span>
                <span class="pct">${m}%</span>
            `;
            trophyRow.appendChild(div);
        });

        // Filtered achievements
        const filtered = getFilteredAchievements(unlocked);
        const filteredCount = filtered.length;
        const filteredUnlocked = filtered.filter(ach => unlocked[ach.id] || false).length;
        document.getElementById('filterCount').textContent = `${filteredUnlocked} / ${filteredCount} achievements`;

        // Grid
        const grid = document.getElementById('achGrid');
        grid.innerHTML = '';
        filtered.forEach(ach => {
            const isUnlocked = unlocked[ach.id] || false;
            const card = document.createElement('div');
            card.className = `ach-card ${isUnlocked ? 'unlocked' : 'locked'}`;
            card.innerHTML = `
                <div class="ach-icon">${ach.icon}</div>
                <div class="ach-info">
                    <div class="name">${ach.name}</div>
                    <div class="desc">${ach.desc}</div>
                </div>
                <div class="ach-status">${isUnlocked ? '✅' : '🔒'}</div>
            `;
            grid.appendChild(card);
        });
    }

    // ================================================================
    // EVENT LISTENERS
    // ================================================================
    document.getElementById('filterSelect').addEventListener('change', renderAchievements);

    // ================================================================
    // NAVIGATION – BACK TO MENU
    // ================================================================
    document.getElementById('backBtn').addEventListener('click', () => {
        window.parent.postMessage({ type: 'navigate', page: 'menu' }, '*');
    });

    // ================================================================
    // INIT
    // ================================================================
    renderAchievements();
    setInterval(renderAchievements, 5000);

    console.log('🏆 Achievements page loaded (with filters & new normal achievements)');
</script>
</body>
</html>
