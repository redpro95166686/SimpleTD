<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏪 Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* ===== RESET & BASE – shop interior ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        body {
            background: #2a1a0e;
            background-image:
                repeating-linear-gradient(90deg, #3d2a18 0px, #3d2a18 4px, #4d3822 4px, #4d3822 8px);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Press Start 2P', 'Courier New', monospace;
            position: relative;
        }

        /* ===== shop interior – walls, floor, shelves ===== */
        .shop-interior {
            max-width: 1100px;
            width: 100%;
            background: #5a3d2b;
            background-image:
                repeating-linear-gradient(0deg, #4d3220 0px, #4d3220 2px, #5a3d2b 2px, #5a3d2b 6px);
            border: 8px solid #3a2418;
            border-radius: 20px 20px 12px 12px;
            box-shadow:
                inset 0 0 0 4px #6b4f38,
                0 20px 60px rgba(0,0,0,0.7);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* wooden floor pattern */
        .shop-interior::before {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: repeating-linear-gradient(90deg, #4d3220 0px, #4d3220 10px, #5a3d2b 10px, #5a3d2b 12px);
            border-top: 4px solid #3a2418;
            z-index: 0;
            opacity: 0.5;
        }

        /* shelf background – top area */
        .shop-interior::after {
            content: "🛒  🧾  🪙  ⚔️  🛡️  🧪  📦  🔮";
            position: absolute;
            top: 12px;
            right: 20px;
            font-size: 16px;
            letter-spacing: 6px;
            opacity: 0.15;
            color: #d4b080;
            z-index: 0;
            pointer-events: none;
            white-space: nowrap;
        }

        /* ===== main container – like a counter ===== */
        .shop-container {
            max-width: 1024px;
            width: 100%;
            margin: 0 auto;
            background: #3a2418;
            padding: 16px;
            border: 6px solid #6b4f38;
            border-radius: 12px;
            box-shadow:
                inset 0 -6px 0 #2a1a0e,
                inset 0 6px 0 #8b6b4a,
                0 8px 32px rgba(0,0,0,0.5);
            position: relative;
            z-index: 1;
            backdrop-filter: blur(2px);
        }

        /* shop sign – header */
        .shop-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 10px 16px 8px;
            background: #4d3220;
            border: 4px solid #8b6b4a;
            border-radius: 8px 8px 0 0;
            border-bottom: 6px solid #2a1a0e;
            margin-bottom: 16px;
            box-shadow: inset 0 2px 0 #6b4f38;
            position: relative;
        }

        .shop-header::before {
            content: "🏪";
            font-size: 24px;
            position: absolute;
            left: -8px;
            top: -12px;
            background: #3a2418;
            border: 4px solid #8b6b4a;
            border-radius: 50%;
            padding: 4px 6px;
            line-height: 1;
            box-shadow: 0 0 0 2px #2a1a0e;
        }

        .shop-header h1 {
            font-size: 20px;
            font-weight: 400;
            color: #f0d4b0;
            text-shadow: 3px 3px 0 #2a1a0e, 0 0 12px #b08050;
            letter-spacing: 2px;
            font-family: 'Press Start 2P', monospace;
            background: #2a1a0e;
            padding: 4px 20px 6px 36px;
            border: 4px solid #8b6b4a;
            border-radius: 40px;
            box-shadow: inset -3px -3px 0 #1a0e08, inset 3px 3px 0 #6b4f38;
            margin-left: 20px;
        }

        .shop-header .stats {
            display: flex;
            gap: 12px;
            font-size: 10px;
            font-weight: 400;
            font-family: 'Press Start 2P', monospace;
            flex-wrap: wrap;
        }

        .shop-header .stats span {
            background: #1f1008;
            padding: 4px 14px 6px;
            border: 4px solid #8b6b4a;
            border-radius: 40px;
            box-shadow: inset -3px -3px 0 #2a1a0e, inset 3px 3px 0 #6b4f38;
            font-size: 9px;
            color: #f0d4b0;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .shop-header .stats .gem-stat {
            border-color: #5a6a7a;
            color: #b0d8e8;
            text-shadow: 0 0 8px #4080a0;
        }
        .shop-header .stats .shard-stat {
            border-color: #8a6a1a;
            color: #f0d080;
            text-shadow: 0 0 8px #c08020;
        }

        .shop-header .back-btn {
            background: #4d3220;
            border: 4px solid #8b6b4a;
            border-radius: 40px;
            box-shadow: inset -4px -4px 0 #2a1a0e, inset 4px 4px 0 #6b4f38;
            padding: 6px 20px 8px;
            color: #f0d4b0;
            font-size: 10px;
            font-weight: 400;
            cursor: pointer;
            transition: 0.05s linear;
            font-family: 'Press Start 2P', monospace;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .shop-header .back-btn:hover {
            background: #5a3d2b;
            transform: translate(1px, 1px);
            box-shadow: inset -3px -3px 0 #2a1a0e, inset 3px 3px 0 #6b4f38;
        }

        .shop-header .back-btn:active {
            transform: translate(2px, 2px);
            box-shadow: inset -2px -2px 0 #2a1a0e, inset 2px 2px 0 #6b4f38;
        }

        /* ===== TAB BAR – like shelf labels ===== */
        .tab-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 14px;
            padding-bottom: 0;
            border-bottom: 6px solid #2a1a0e;
            flex-wrap: wrap;
            padding-left: 4px;
        }

        .tab-btn {
            background: #4d3220;
            border: 4px solid #8b6b4a;
            border-bottom: none;
            border-radius: 12px 12px 0 0;
            box-shadow: inset -3px -3px 0 #2a1a0e, inset 3px 3px 0 #6b4f38;
            padding: 6px 18px 8px;
            color: #b09080;
            font-weight: 400;
            font-size: 10px;
            cursor: pointer;
            transition: 0.05s linear;
            font-family: 'Press Start 2P', monospace;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: -2px;
            position: relative;
        }

        .tab-btn:hover {
            background: #5a3d2b;
            color: #f0d4b0;
            transform: translate(1px, 1px);
        }

        .tab-btn.active {
            background: #3a2418;
            border-color: #8b6b4a;
            border-bottom: 4px solid #3a2418;
            box-shadow: inset -3px -3px 0 #2a1a0e, inset 3px 3px 0 #6b4f38;
            transform: translateY(2px);
            color: #f0d4b0;
            text-shadow: 0 0 8px #b08050;
        }

        .tab-btn.active::after {
            content: "";
            position: absolute;
            bottom: -5px;
            left: 0;
            right: 0;
            height: 4px;
            background: #3a2418;
        }

        /* ===== TAB CONTENT – like items on a shelf ===== */
        .tab-content {
            display: none;
            animation: pixelFade 0.2s steps(4);
            padding: 4px 0;
        }
        .tab-content.active {
            display: block;
        }

        @keyframes pixelFade {
            0% { opacity: 0; transform: translateY(4px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ===== SHOP ITEMS – like products on a counter ===== */
        .shop-item,
        .hero-card {
            background: #4d3220;
            border: 4px solid #8b6b4a;
            border-radius: 8px;
            box-shadow: inset -4px -4px 0 #2a1a0e, inset 4px 4px 0 #6b4f38;
            padding: 8px 12px;
            margin-bottom: 8px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            transition: 0.05s linear;
            gap: 6px;
            position: relative;
        }

        .shop-item::before,
        .hero-card::before {
            content: "📦";
            position: absolute;
            right: -8px;
            top: -8px;
            font-size: 14px;
            opacity: 0.2;
            transform: rotate(15deg);
        }

        .shop-item:hover,
        .hero-card:hover {
            background: #5a3d2b;
            transform: translateX(4px) scale(1.01);
            border-color: #b08050;
        }

        .shop-item .left,
        .hero-card .left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 160px;
        }

        .shop-item .left img,
        .hero-card .left img {
            width: 38px;
            height: 38px;
            object-fit: contain;
            background: #2a1a0e;
            border: 3px solid #6b4f38;
            border-radius: 4px;
            padding: 3px;
            image-rendering: pixelated;
        }

        .shop-item .left .info .name,
        .hero-card .left .info .name {
            font-weight: 400;
            font-size: 11px;
            color: #f0d4b0;
            font-family: 'Press Start 2P', monospace;
            letter-spacing: 0.3px;
            text-shadow: 1px 1px 0 #1a0e08;
        }

        .shop-item .left .info .sub,
        .hero-card .left .info .desc {
            font-size: 8px;
            opacity: 0.7;
            color: #b09080;
            font-family: 'Press Start 2P', monospace;
            letter-spacing: 0.2px;
            margin-top: 2px;
            line-height: 1.4;
        }

        .shop-item .right,
        .hero-card .right {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        .shop-item .right button,
        .hero-card .right button {
            background: #4d3220;
            border: 4px solid #8b6b4a;
            border-radius: 40px;
            box-shadow: inset -4px -4px 0 #2a1a0e, inset 4px 4px 0 #6b4f38;
            padding: 4px 14px 6px;
            font-size: 8px;
            font-weight: 400;
            color: #f0d4b0;
            cursor: pointer;
            transition: 0.05s linear;
            font-family: 'Press Start 2P', monospace;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        .shop-item .right button:hover:not(:disabled),
        .hero-card .right button:hover:not(:disabled) {
            background: #5a3d2b;
            transform: translate(1px, 1px);
            box-shadow: inset -3px -3px 0 #2a1a0e, inset 3px 3px 0 #6b4f38;
        }

        .shop-item .right button:active:not(:disabled),
        .hero-card .right button:active:not(:disabled) {
            transform: translate(2px, 2px);
            box-shadow: inset -2px -2px 0 #2a1a0e, inset 2px 2px 0 #6b4f38;
        }

        .shop-item .right button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            filter: grayscale(0.5);
        }

        .shop-item .right .btn-gem,
        .hero-card .right .btn-gem {
            background: #1a2a2a;
            border-color: #2a5a5a;
            box-shadow: inset -4px -4px 0 #0a1a1a, inset 4px 4px 0 #3a6a6a;
            color: #a0d0d0;
        }

        .shop-item .right .btn-gem:hover:not(:disabled),
        .hero-card .right .btn-gem:hover:not(:disabled) {
            background: #2a3a3a;
        }

        .shop-item .right .btn-owned {
            background: #2a2218;
            border-color: #5a4a3a;
            box-shadow: inset -3px -3px 0 #1a1208, inset 3px 3px 0 #4a3a2a;
            color: #8a7a5a;
            cursor: default;
        }

        .shop-item .right .btn-owned:hover {
            transform: none !important;
            background: #2a2218;
        }

        .hero-card.selected {
            border-color: #b08050;
            background: #5a3d2b;
            box-shadow: inset -4px -4px 0 #2a1a0e, inset 4px 4px 0 #8b6b4a, 0 0 30px rgba(180, 120, 70, 0.15);
        }

        .hero-card .right .btn-selected {
            background: #6b4f38;
            border-color: #8b6b4a;
            box-shadow: inset -4px -4px 0 #3a2418, inset 4px 4px 0 #8b6b4a;
            color: #f0d4b0;
            cursor: default;
        }

        .hero-card .right .btn-selected:hover {
            transform: none !important;
            background: #6b4f38;
        }

        /* ===== SKILL TREE – like a book / scroll ===== */
        .skill-tree {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .tree-branch {
            background: #4d3220;
            border: 4px solid #8b6b4a;
            border-radius: 8px;
            box-shadow: inset -3px -3px 0 #2a1a0e, inset 3px 3px 0 #6b4f38;
            padding: 10px 14px;
            border-left: 10px solid #6b4f38;
            transition: 0.05s linear;
        }

        .tree-branch:hover {
            border-left-color: #b08050;
            background: #5a3d2b;
        }

        .tree-branch h3 {
            color: #f0d4b0;
            font-size: 11px;
            font-weight: 400;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Press Start 2P', monospace;
            letter-spacing: 0.3px;
            text-shadow: 1px 1px 0 #1a0e08;
        }

        .tree-branch h3 img {
            width: 28px;
            height: 28px;
            object-fit: contain;
            background: #2a1a0e;
            border: 3px solid #6b4f38;
            border-radius: 4px;
            padding: 3px;
            image-rendering: pixelated;
        }

        .tree-node {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            background: #2a1a0e;
            border: 3px solid #6b4f38;
            border-radius: 4px;
            padding: 4px 10px;
            margin-bottom: 4px;
            gap: 4px;
            transition: 0.05s linear;
        }

        .tree-node:hover {
            border-color: #8b6b4a;
            background: #3a2418;
        }

        .tree-node .node-info {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 140px;
        }

        .tree-node .node-info .node-icon {
            font-size: 14px;
            width: 24px;
            text-align: center;
            font-family: 'Press Start 2P', monospace;
        }

        .tree-node .node-info .node-desc {
            font-size: 8px;
            color: #b09080;
            font-family: 'Press Start 2P', monospace;
            line-height: 1.5;
            letter-spacing: 0.2px;
        }

        .tree-node .node-info .node-desc .name {
            font-weight: 400;
            color: #f0d4b0;
        }

        .tree-node .node-info .node-desc .sub {
            opacity: 0.6;
            font-size: 7px;
            color: #8a7a6a;
        }

        .tree-node .node-action button {
            background: #4d3220;
            border: 4px solid #8b6b4a;
            border-radius: 40px;
            box-shadow: inset -4px -4px 0 #2a1a0e, inset 4px 4px 0 #6b4f38;
            padding: 3px 12px 5px;
            font-size: 7px;
            font-weight: 400;
            color: #f0d4b0;
            cursor: pointer;
            transition: 0.05s linear;
            font-family: 'Press Start 2P', monospace;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        .tree-node .node-action button:hover:not(:disabled) {
            background: #5a3d2b;
            transform: translate(1px, 1px);
            box-shadow: inset -3px -3px 0 #2a1a0e, inset 3px 3px 0 #6b4f38;
        }

        .tree-node .node-action button:active:not(:disabled) {
            transform: translate(2px, 2px);
            box-shadow: inset -2px -2px 0 #2a1a0e, inset 2px 2px 0 #6b4f38;
        }

        .tree-node .node-action button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            filter: grayscale(0.5);
        }

        .tree-node .node-action button.purchased {
            background: #2a2218;
            border-color: #5a4a3a;
            box-shadow: inset -3px -3px 0 #1a1208, inset 3px 3px 0 #4a3a2a;
            color: #8a7a5a;
            cursor: default;
        }

        .tree-node .node-action button.purchased:hover {
            transform: none !important;
            background: #2a2218;
        }

        .tree-node .node-action button.knowledge {
            background: #4d3220;
            border-color: #8a6a1a;
            box-shadow: inset -4px -4px 0 #2a1a0e, inset 4px 4px 0 #6a4a1a;
            color: #f0c080;
        }

        .tree-node .node-action button.knowledge:hover:not(:disabled) {
            background: #5a3d2b;
        }

        /* ===== KNOWLEDGE SECTION ===== */
        .knowledge-section {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 4px solid #6b4f38;
        }

        .knowledge-section h3 {
            color: #d08040;
            font-size: 11px;
            font-weight: 400;
            margin-bottom: 8px;
            font-family: 'Press Start 2P', monospace;
            letter-spacing: 1px;
            text-shadow: 0 0 8px #a06030;
        }

        /* ===== MINI TRACK ===== */
        .mini-track {
            width: 50px;
            height: 6px;
            background: #1f0c08;
            border: 3px solid #6b4f38;
            border-radius: 4px;
            overflow: hidden;
            display: inline-block;
            vertical-align: middle;
        }
        .mini-fill {
            height: 100%;
            background: #b08050;
            transition: width 0.2s steps(4);
        }

        /* ===== FOOTER – like a receipt ===== */
        .footer {
            margin-top: 16px;
            text-align: center;
            font-size: 7px;
            opacity: 0.5;
            letter-spacing: 1px;
            color: #b09080;
            font-family: 'Press Start 2P', monospace;
            border-top: 3px solid #6b4f38;
            padding-top: 12px;
            background: #2a1a0e;
            border-radius: 0 0 8px 8px;
            padding: 8px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            .shop-interior {
                padding: 10px;
                border-width: 4px;
            }
            .shop-container {
                padding: 10px;
            }
            .shop-header::before {
                font-size: 18px;
                left: -4px;
                top: -8px;
                padding: 2px 4px;
            }
            .shop-header h1 {
                font-size: 14px;
                padding: 3px 12px 5px 30px;
                margin-left: 12px;
            }
            .shop-header .stats span {
                font-size: 7px;
                padding: 3px 10px 5px;
            }
            .shop-header .back-btn {
                font-size: 7px;
                padding: 4px 12px 6px;
            }
            .tab-btn {
                font-size: 7px;
                padding: 4px 10px 6px;
            }
            .shop-item,
            .hero-card {
                flex-direction: column;
                align-items: stretch;
                padding: 8px 10px;
            }
            .shop-item .right,
            .hero-card .right {
                justify-content: flex-start;
                margin-top: 4px;
            }
            .shop-item .left,
            .hero-card .left {
                min-width: 100%;
            }
            .tree-node {
                flex-direction: column;
                align-items: stretch;
            }
            .tree-node .node-action {
                margin-top: 4px;
                text-align: right;
            }
            .shop-item .right button,
            .hero-card .right button {
                font-size: 7px;
                padding: 3px 10px 5px;
            }
            .shop-item .left .info .name,
            .hero-card .left .info .name {
                font-size: 9px;
            }
            .shop-item .left .info .sub,
            .hero-card .left .info .desc {
                font-size: 7px;
            }
            .tree-branch {
                padding: 8px 10px;
            }
            .tree-branch h3 {
                font-size: 9px;
            }
            .tree-node .node-info .node-desc {
                font-size: 7px;
            }
        }

        @media (max-width: 480px) {
            .shop-header {
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
                padding: 8px 10px;
            }
            .shop-header .stats {
                justify-content: center;
            }
            .shop-header .back-btn {
                align-self: center;
            }
            .tab-bar {
                justify-content: center;
            }
            .tab-btn {
                font-size: 6px;
                padding: 3px 8px 5px;
            }
        }

        /* ===== pixel scrollbar ===== */
        ::-webkit-scrollbar {
            width: 12px;
            background: #2a1a0e;
        }
        ::-webkit-scrollbar-track {
            background: #2a1a0e;
            border: 2px solid #6b4f38;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #6b4f38;
            border: 3px solid #8b6b4a;
            border-radius: 4px;
            box-shadow: inset -3px -3px 0 #2a1a0e, inset 3px 3px 0 #8b6b4a;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #8b6b4a;
        }
    </style>
</head>
<body>
    <!-- ===== SHOP INTERIOR WRAPPER ===== -->
    <div class="shop-interior">
        <div class="shop-container">
            <!-- ===== HEADER ===== -->
            <div class="shop-header">
                <h1>🏪 SHOP</h1>
                <div class="stats">
                    <span class="gem-stat">💎 <span id="gemDisplay">0</span></span>
                    <span class="shard-stat">🔮 <span id="shardDisplay">0</span></span>
                </div>
                <button class="back-btn" id="backBtn">⬅ BACK</button>
            </div>

            <!-- ===== TABS ===== -->
            <div class="tab-bar">
                <button class="tab-btn active" data-tab="gems">💎 Gems</button>
                <button class="tab-btn" data-tab="shards">🔮 Skill Tree</button>

        // ================================================================
        // SAVE / UI – unchanged
        // ================================================================
        function saveAllPersistent() {
            localStorage.setItem('td_totalGems', totalGems);
            localStorage.setItem('td_shards', shards);
            localStorage.setItem('td_unlockedTowers', JSON.stringify(unlockedTowers));
            localStorage.setItem('td_towerMaxLevels', JSON.stringify(towerMaxLevels));
            localStorage.setItem('td_boughtExtraCash', boughtExtraCash);
            localStorage.setItem('td_boughtExtraLives', boughtExtraLives);
            localStorage.setItem('td_extraCash', extraStartingCash);
            localStorage.setItem('td_extraLives', extraLives);
            localStorage.setItem('td_towerUpgrades', JSON.stringify(towerUpgrades));
            localStorage.setItem('td_knowledgeUpgrades', JSON.stringify(knowledgeUpgrades));
            localStorage.setItem('td_heroUnlocked', JSON.stringify(heroUnlocked));
            localStorage.setItem('td_heroUpgrades', JSON.stringify(heroUpgrades));
            localStorage.setItem('td_selectedHero', selectedHero);
            updateUI();
        }

        function updateUI() {
            document.getElementById('gemDisplay').innerText = totalGems;
            document.getElementById('shardDisplay').innerText = shards;
        }

        // ================================================================
        // GEMS TAB – unchanged
        // ================================================================
        function refreshShop() {
            let container = document.getElementById('shopList');
            container.innerHTML = '';
            for (let [id, data] of Object.entries(TOWER_TYPES)) {
                const owned = unlockedTowers[id];
                const maxLvl = towerMaxLevels[id] || 1;
                const div = document.createElement('div');
                div.className = 'shop-item';
                const left = document.createElement('div');
                left.className = 'left';
                const img = document.createElement('img');
                img.src = IMG_BASE + (id === 'bomber' ? 'bomb.png' : id + '.png');
                img.alt = data.name;
                const info = document.createElement('div');
                info.className = 'info';
                const nameSpan = document.createElement('div');
                nameSpan.className = 'name';
                nameSpan.textContent = data.name;
                const subSpan = document.createElement('div');
                subSpan.className = 'sub';
                subSpan.textContent = `💎 unlock: ${data.gemCost || 0} | MAX LV: ${maxLvl}`;
                info.appendChild(nameSpan);
                info.appendChild(subSpan);
                left.appendChild(img);
                left.appendChild(info);
                const right = document.createElement('div');
                right.className = 'right';
                if (!owned && data.gemCost > 0) {
                    const btn = document.createElement('button');
                    btn.className = 'btn-gem';
                    btn.textContent = `UNLOCK (${data.gemCost}💎)`;
                    btn.onclick = () => {
                        if (totalGems >= data.gemCost) {
                            totalGems -= data.gemCost;
                            unlockedTowers[id] = true;
                            saveAllPersistent();
                            refreshShop();
                        } else alert('Not enough gems');
                    };
                    right.appendChild(btn);
                } else if (owned) {
                    const btn = document.createElement('button');
                    btn.className = 'btn-owned';
                    btn.textContent = '✓ OWNED';
                    right.appendChild(btn);
                }
                if (owned) {
                    const btn = document.createElement('button');
                    btn.textContent = `⬆ MAX LV+1 (${maxLvl}💎)`;
                    btn.onclick = () => {
                        if (totalGems >= maxLvl) {
                            totalGems -= maxLvl;
                            towerMaxLevels[id] = maxLvl + 1;
                            saveAllPersistent();
                            refreshShop();
                        } else alert('Not enough gems');
                    };
                    right.appendChild(btn);
                }
                div.appendChild(left);
                div.appendChild(right);
                container.appendChild(div);
            }

            const extraCash = document.createElement('div');
            extraCash.className = 'shop-item';
            extraCash.innerHTML = `
                <div class="left">
                    <div class="info"><div class="name">💰 Extra Starting Cash</div><div class="sub">+200 coins (one time)</div></div>
                </div>
                <div class="right">
                    <button class="btn-gem" id="buyExtraCash" ${boughtExtraCash ? 'disabled' : ''}>
                        ${boughtExtraCash ? '✓ BOUGHT' : 'BUY (35💎)'}
                    </button>
                </div>
            `;
            container.appendChild(extraCash);

            const extraLivesDiv = document.createElement('div');
            extraLivesDiv.className = 'shop-item';
            extraLivesDiv.innerHTML = `
                <div class="left">
                    <div class="info"><div class="name">❤️ Fortifications</div><div class="sub">+5 lives (one time)</div></div>
                </div>
                <div class="right">
                    <button class="btn-gem" id="buyExtraLives" ${boughtExtraLives ? 'disabled' : ''}>
                        ${boughtExtraLives ? '✓ BOUGHT' : 'BUY (50💎)'}
                    </button>
                </div>
            `;
            container.appendChild(extraLivesDiv);

            document.getElementById('buyExtraCash')?.addEventListener('click', () => {
                if (!boughtExtraCash && totalGems >= 35) {
                    totalGems -= 35;
                    extraStartingCash += 200;
                    boughtExtraCash = true;
                    saveAllPersistent();
                    refreshShop();
                } else alert('Cannot buy');
            });
            document.getElementById('buyExtraLives')?.addEventListener('click', () => {
                if (!boughtExtraLives && totalGems >= 50) {
                    totalGems -= 50;
                    extraLives += 5;
                    boughtExtraLives = true;
                    saveAllPersistent();
                    refreshShop();
                } else alert('Cannot buy');
            });
        }

        // ================================================================
        // SKILL TREE – unchanged
        // ================================================================
        function buildSkillTree() {
            const container = document.getElementById('skillTreeContainer');
            container.innerHTML = '';

            const towerKeys = ['archer', 'bomber', 'poison', 'dart', 'farm', 'sniper', 'mage'];
            for (let key of towerKeys) {
                const def = UPGRADE_DEFS[key];
                if (!def) continue;
                const upgrades = towerUpgrades[key] || [false, false, false];
                const branch = document.createElement('div');
                branch.className = 'tree-branch';
                const header = document.createElement('h3');
                const img = document.createElement('img');
                img.src = IMG_BASE + (key === 'bomber' ? 'bomb.png' : key + '.png');
                img.alt = def.name;
                header.appendChild(img);
                header.appendChild(document.createTextNode(` ${def.name} Upgrades`));
                branch.appendChild(header);

                def.upgrades.forEach((upg, idx) => {
                    const purchased = upgrades[idx];
                    const available = (idx === 0 || upgrades[idx - 1]) && playerLevel >= upg.levelReq;
                    const node = document.createElement('div');
                    node.className = 'tree-node';
                    const info = document.createElement('div');
                    info.className = 'node-info';
                    const iconSpan = document.createElement('span');
                    iconSpan.className = 'node-icon';
                    iconSpan.textContent = purchased ? '✅' : (available ? '🔓' : '🔒');
                    const desc = document.createElement('div');
                    desc.className = 'node-desc';
                    desc.innerHTML = `<span class="name">${upg.name}</span> <span class="sub">– ${upg.desc}</span>`;
                    info.appendChild(iconSpan);
                    info.appendChild(desc);
                    const action = document.createElement('div');
                    action.className = 'node-action';
                    const btn = document.createElement('button');
                    if (purchased) {
                        btn.className = 'purchased';
                        btn.textContent = '✓ Bought';
                        btn.disabled = true;
                    } else if (!available) {
                        btn.textContent = `🔒 Lv${upg.levelReq}`;
                        btn.disabled = true;
                    } else {
                        btn.textContent = `Buy (1🔮)`;
                        btn.onclick = () => {
                            if (shards < 1) { alert('Not enough shards'); return; }
                            shards--;
                            upgrades[idx] = true;
                            towerUpgrades[key] = upgrades;
                            saveAllPersistent();
                            buildSkillTree();
                        };
                    }
                    action.appendChild(btn);
                    node.appendChild(info);
                    node.appendChild(action);
                    branch.appendChild(node);
                });
                container.appendChild(branch);
            }

            // Hero upgrades branch
            const heroBranch = document.createElement('div');
            heroBranch.className = 'tree-branch';
            heroBranch.style.borderLeftColor = '#b08050';
            const heroHeader = document.createElement('h3');
            heroHeader.innerHTML = '🦸 Hero Upgrades';
            heroBranch.appendChild(heroHeader);

            for (let [hkey, hdef] of Object.entries(HERO_UPGRADE_DEFS)) {
                const upgrades = heroUpgrades[hkey] || [false, false, false];
                const hBranch = document.createElement('div');
                hBranch.style.marginLeft = '0.5rem';
                hBranch.style.marginBottom = '0.5rem';
                hBranch.style.borderLeft = '4px solid rgba(180, 120, 70, 0.2)';
                hBranch.style.paddingLeft = '0.8rem';
                const hTitle = document.createElement('div');
                hTitle.style.fontWeight = '400';
                hTitle.style.color = '#d08040';
                hTitle.style.fontSize = '9px';
                hTitle.style.fontFamily = "'Press Start 2P', monospace";
                hTitle.textContent = HERO_DEFS[hkey]?.name || hkey;
                hBranch.appendChild(hTitle);

                hdef.upgrades.forEach((upg, idx) => {
                    const purchased = upgrades[idx];
                    const reqLevel = [100, 180, 200][idx];
                    const available = (idx === 0 || upgrades[idx - 1]) && playerLevel >= reqLevel;
                    const node = document.createElement('div');
                    node.className = 'tree-node';
                    node.style.marginBottom = '2px';
                    const info = document.createElement('div');
                    info.className = 'node-info';
                    const iconSpan = document.createElement('span');
                    iconSpan.className = 'node-icon';
                    iconSpan.textContent = purchased ? '✅' : (available ? '🔓' : '🔒');
                    const desc = document.createElement('div');
                    desc.className = 'node-desc';
                    desc.innerHTML = `<span class="name">${upg.name}</span> <span class="sub">– ${upg.desc}</span>`;
                    info.appendChild(iconSpan);
                    info.appendChild(desc);
                    const action = document.createElement('div');
                    action.className = 'node-action';
                    const btn = document.createElement('button');
                    if (purchased) {
                        btn.className = 'purchased';
                        btn.textContent = '✓ Bought';
                        btn.disabled = true;
                    } else if (!available) {
                        btn.textContent = `🔒 Lv${reqLevel}`;
                        btn.disabled = true;
                    } else {
                        btn.textContent = `Buy (1🔮)`;
                        btn.onclick = () => {
                            if (shards < 1) { alert('Not enough shards'); return; }
                            shards--;
                            upgrades[idx] = true;
                            heroUpgrades[hkey] = upgrades;
                            saveAllPersistent();
                            buildSkillTree();
                        };
                    }
                    action.appendChild(btn);
                    node.appendChild(info);
                    node.appendChild(action);
                    hBranch.appendChild(node);
                });
                heroBranch.appendChild(hBranch);
            }
            container.appendChild(heroBranch);

            // Knowledge
            const knowledgeSection = document.createElement('div');
            knowledgeSection.className = 'knowledge-section';
            const kHeader = document.createElement('h3');
            kHeader.textContent = '📜 THE KNOWLEDGE';
            knowledgeSection.appendChild(kHeader);

            for (let k of KNOWLEDGE_UPGRADES) {
                const purchased = knowledgeUpgrades[k.id] || false;
                let available = true;
                if (k.reqs.playerLevel && playerLevel < k.reqs.playerLevel) available = false;
                if (k.reqs.tower) {
                    const towerUpg = towerUpgrades[k.reqs.tower] || [false, false, false];
                    if (k.reqs.upgradeIndex !== undefined && !towerUpg[k.reqs.upgradeIndex]) available = false;
                }
                if (k.reqs.extraLivesPurchased && !boughtExtraLives) available = false;
                const node = document.createElement('div');
                node.className = 'tree-node';
                node.style.borderColor = 'rgba(180, 120, 70, 0.2)';
                const info = document.createElement('div');
                info.className = 'node-info';
                const iconSpan = document.createElement('span');
                iconSpan.className = 'node-icon';
                iconSpan.textContent = purchased ? '✅' : (available ? '🔓' : '🔒');
                const desc = document.createElement('div');
                desc.className = 'node-desc';
                desc.innerHTML = `<span class="name">${k.name}</span> <span class="sub">– ${k.desc}</span>`;
                info.appendChild(iconSpan);
                info.appendChild(desc);
                const action = document.createElement('div');
                action.className = 'node-action';
                const btn = document.createElement('button');
                btn.className = 'knowledge';
                if (purchased) {
                    btn.className = 'purchased knowledge';
                    btn.textContent = '✓ Bought';
                    btn.disabled = true;
                } else if (!available) {
                    btn.textContent = `🔒 locked`;
                    btn.disabled = true;
                } else {
                    btn.textContent = `Buy (${k.cost}🔮)`;
                    btn.onclick = () => {
                        if (shards < k.cost) { alert('Not enough shards'); return; }
                        shards -= k.cost;
                        knowledgeUpgrades[k.id] = true;
                        saveAllPersistent();
                        buildSkillTree();
                    };
                }
                action.appendChild(btn);
                node.appendChild(info);
                node.appendChild(action);
                knowledgeSection.appendChild(node);
            }
            container.appendChild(knowledgeSection);
        }

        // ================================================================
        // HEROES TAB – unchanged
        // ================================================================
        function refreshHeroShop() {
            const container = document.getElementById('heroShopList');
            container.innerHTML = '';
            for (let [key, def] of Object.entries(HERO_DEFS)) {
                const unlocked = heroUnlocked[key];
                const card = document.createElement('div');
                card.className = 'hero-card' + (selectedHero === key ? ' selected' : '');
                const left = document.createElement('div');
                left.className = 'left';
                const img = document.createElement('img');
                const imgFile = key === 'minifun' ? 'miniFun.png' : key + '.png';
                img.src = HERO_IMG_BASE + imgFile;
                img.alt = def.name;
                const info = document.createElement('div');
                info.className = 'info';
                const nameSpan = document.createElement('div');
                nameSpan.className = 'name';
                nameSpan.textContent = def.name;
                const descSpan = document.createElement('div');
                descSpan.className = 'desc';
                descSpan.textContent = def.desc;
                info.appendChild(nameSpan);
                info.appendChild(descSpan);
                left.appendChild(img);
                left.appendChild(info);
                const right = document.createElement('div');
                right.className = 'right';
                if (!unlocked) {
                    const btn = document.createElement('button');
                    btn.className = 'btn-gem';
                    btn.textContent = `UNLOCK (${def.gemCost}💎)`;
                    btn.onclick = () => {
                        if (totalGems >= def.gemCost) {
                            totalGems -= def.gemCost;
                            heroUnlocked[key] = true;
                            saveAllPersistent();
                            refreshHeroShop();
                        } else alert('Not enough gems');
                    };
                    right.appendChild(btn);
                } else {
                    if (selectedHero === key) {
                        const btn = document.createElement('button');
                        btn.className = 'btn-selected';
                        btn.textContent = '✅ SELECTED';
                        right.appendChild(btn);
                    } else {
                        const btn = document.createElement('button');
                        btn.textContent = 'SELECT';
                        btn.onclick = () => {
                            selectedHero = key;
                            localStorage.setItem('td_selectedHero', key);
                            refreshHeroShop();
                            window.parent.postMessage({ type: 'heroSelected', hero: key }, '*');
                        };
                        right.appendChild(btn);
                    }
                }
                card.appendChild(left);
                card.appendChild(right);
                container.appendChild(card);
            }
        }

        // ================================================================
        // TABS
        // ================================================================
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.getElementById('tab-' + this.dataset.tab).classList.add('active');
                if (this.dataset.tab === 'gems') refreshShop();
                if (this.dataset.tab === 'shards') buildSkillTree();
                if (this.dataset.tab === 'heroes') refreshHeroShop();
            });
        });

        // ================================================================
        // NAVIGATION – BACK TO MENU
        // ================================================================
        document.getElementById('backBtn').addEventListener('click', () => {
            window.parent.postMessage({ type: 'navigate', page: 'menu' }, '*');
        });

        // ================================================================
        // INIT
        // ================================================================
        refreshShop();
        buildSkillTree();
        refreshHeroShop();
        updateUI();
    </script>
</body>
</html>
