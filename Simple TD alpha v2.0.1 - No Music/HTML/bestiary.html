<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📖 BESTIARY</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0c16;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            color: #f0ece3;
            overflow-x: hidden;
            padding: 20px;
        }
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .bg-particles span {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 205, 148, 0.12);
            border-radius: 50%;
            animation: float 20s infinite alternate ease-in-out;
        }
        @keyframes float {
            0% { transform: translate(0, 0) scale(0.8); opacity: 0.2; }
            100% { transform: translate(40px, -60px) scale(1.2); opacity: 0.8; }
        }
        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(8, 18, 22, 0.75);
            backdrop-filter: blur(18px);
            border-radius: 2.5rem;
            padding: 1.5rem 1.8rem 2rem;
            border: 1px solid rgba(80, 180, 140, 0.2);
            box-shadow: 0 30px 60px rgba(0,0,0,0.7);
        }
        .bestiary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.8rem;
        }
        .bestiary-header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffcd94, #ffaa66);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 2px;
        }
        .bestiary-header .sub {
            font-size: 0.85rem;
            opacity: 0.6;
            font-family: monospace;
            margin-top: 2px;
        }
        .back-btn {
            background: rgba(255,255,255,0.06);
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 60px;
            color: #f0ece3;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            backdrop-filter: blur(6px);
        }
        .back-btn:hover {
            background: rgba(255,255,255,0.12);
            transform: scale(1.02);
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: #ffcd94;
            margin: 1.8rem 0 1rem 0;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            border-bottom: 1px solid rgba(255,205,148,0.15);
            padding-bottom: 0.5rem;
        }
        .section-title .badge {
            font-size: 0.6rem;
            background: rgba(255,205,148,0.15);
            padding: 0.1rem 0.6rem;
            border-radius: 30px;
            color: #ffcd94;
            font-weight: 400;
        }

        .enemy-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.2rem;
        }
        .enemy-card {
            background: rgba(20, 34, 30, 0.6);
            backdrop-filter: blur(4px);
            border-radius: 1.5rem;
            padding: 1rem 0.8rem;
            border: 1px solid rgba(80, 180, 140, 0.12);
            transition: 0.25s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 6px 16px rgba(0,0,0,0.3);
            cursor: pointer;
        }
        .enemy-card:hover {
            transform: translateY(-6px);
            border-color: rgba(244, 162, 97, 0.4);
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
            background: rgba(30, 50, 44, 0.7);
        }
        .enemy-card:active { transform: scale(0.96); }
        .enemy-card .icon {
            font-size: 2.8rem;
            line-height: 1;
            margin-bottom: 0.2rem;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
        }
        .enemy-card .name {
            font-weight: 700;
            font-size: 1.1rem;
            color: #f0ece3;
            margin-bottom: 0.2rem;
        }
        .enemy-card .stats {
            font-size: 0.75rem;
            opacity: 0.7;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.8rem;
            margin: 0.3rem 0 0.2rem;
        }
        .enemy-card .stats span {
            background: rgba(0,0,0,0.3);
            padding: 0.1rem 0.6rem;
            border-radius: 30px;
        }
        .enemy-card .lore {
            font-size: 0.7rem;
            opacity: 0.5;
            font-style: italic;
            margin-top: 0.3rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 0.3rem;
            width: 100%;
        }
        .enemy-card .click-hint {
            font-size: 0.5rem;
            opacity: 0.2;
            margin-top: 0.3rem;
            letter-spacing: 0.5px;
        }

        .boss-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.2rem;
        }
        .boss-card {
            background: rgba(40, 20, 20, 0.5);
            border: 1px solid rgba(200, 80, 50, 0.2);
            border-radius: 1.5rem;
            padding: 1rem 0.8rem;
            text-align: center;
            backdrop-filter: blur(4px);
            transition: 0.25s;
            box-shadow: 0 6px 16px rgba(0,0,0,0.3);
            cursor: pointer;
        }
        .boss-card:hover {
            transform: scale(1.02);
            border-color: #ff8c00;
            box-shadow: 0 0 30px rgba(255, 140, 0, 0.15);
        }
        .boss-card:active { transform: scale(0.96); }
        .boss-card .icon { font-size: 3rem; }
        .boss-card .name {
            font-weight: 700;
            font-size: 1.2rem;
            color: #ff8c00;
        }
        .boss-card .threshold {
            font-size: 0.7rem;
            opacity: 0.6;
            background: rgba(0,0,0,0.3);
            padding: 0.1rem 0.6rem;
            border-radius: 30px;
            display: inline-block;
            margin-top: 0.2rem;
        }
        .boss-card .lore {
            font-size: 0.7rem;
            opacity: 0.5;
            font-style: italic;
            margin-top: 0.3rem;
        }
        .boss-card .click-hint {
            font-size: 0.5rem;
            opacity: 0.2;
            margin-top: 0.3rem;
            letter-spacing: 0.5px;
        }

        .difficulty-tree {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-top: 0.5rem;
        }
        .diff-node {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(16, 28, 24, 0.6);
            border-radius: 1.2rem;
            padding: 0.8rem 1.2rem;
            border-left: 4px solid #3a5a4a;
            transition: 0.2s;
            backdrop-filter: blur(4px);
            flex-wrap: wrap;
        }
        .diff-node.unlocked {
            border-left-color: #ffd700;
            background: rgba(30, 50, 40, 0.5);
        }
        .diff-node.locked {
            opacity: 0.5;
            filter: grayscale(0.5);
        }
        .diff-node .diff-icon { font-size: 1.6rem; width: 40px; text-align: center; }
        .diff-node .diff-info { flex: 1; }
        .diff-node .diff-info .diff-name { font-weight: 700; font-size: 1.1rem; }
        .diff-node .diff-info .diff-desc { font-size: 0.75rem; opacity: 0.7; }
        .diff-node .diff-info .diff-unlock { font-size: 0.65rem; opacity: 0.5; margin-top: 2px; }
        .diff-node .diff-status {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            background: rgba(255,255,255,0.06);
            white-space: nowrap;
        }
        .diff-node.unlocked .diff-status {
            background: rgba(255,215,0,0.15);
            color: #ffd700;
        }
        .diff-node.locked .diff-status {
            background: rgba(255,0,0,0.08);
            color: #ff6b6b;
        }
        .diff-arrow {
            text-align: center;
            font-size: 0.8rem;
            opacity: 0.2;
            margin: -0.2rem 0;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(12px);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            max-width: 480px;
            width: 100%;
            background: linear-gradient(145deg, #10231e, #07120f);
            border-radius: 2rem;
            padding: 1.5rem 1.8rem;
            border: 2px solid rgba(244, 162, 97, 0.3);
            color: #f0ece3;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            animation: modalIn 0.25s ease-out;
            position: relative;
        }
        @keyframes modalIn {
            0% { opacity: 0; transform: scale(0.92) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-box .close-btn {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            color: rgba(255,255,255,0.3);
            font-size: 1.4rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .modal-box .close-btn:hover {
            color: #fff;
            transform: rotate(90deg);
        }
        .modal-box .modal-icon { font-size: 3.6rem; text-align: center; margin-bottom: 0.2rem; }
        .modal-box .modal-name {
            font-size: 1.6rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 0.2rem;
        }
        .modal-box .modal-sub {
            text-align: center;
            font-size: 0.85rem;
            opacity: 0.6;
            margin-bottom: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding-bottom: 0.6rem;
        }
        .modal-box .modal-stats {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            font-size: 0.8rem;
            opacity: 0.7;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
        }
        .modal-box .modal-stats span {
            background: rgba(0,0,0,0.3);
            padding: 0.1rem 0.7rem;
            border-radius: 30px;
        }
        .modal-box .modal-lore {
            font-style: italic;
            opacity: 0.6;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 1rem;
            padding: 0.4rem;
            border-left: 2px solid rgba(244,162,97,0.2);
            border-right: 2px solid rgba(244,162,97,0.2);
        }
        .modal-box .modal-tip {
            background: rgba(244,162,97,0.06);
            border-radius: 0.8rem;
            padding: 0.6rem 0.8rem;
            font-size: 0.8rem;
            border: 1px solid rgba(244,162,97,0.1);
        }
        .modal-box .modal-tip strong { color: #ffcd94; }
        .modal-box .modal-threat {
            text-align: center;
            margin-top: 0.8rem;
            font-size: 0.7rem;
            opacity: 0.4;
        }

        @media (max-width: 640px) {
            .container { padding: 1rem; }
            .bestiary-header h1 { font-size: 1.6rem; }
            .enemy-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
            .boss-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
            .diff-node { flex-direction: column; align-items: stretch; gap: 0.4rem; }
            .modal-box { padding: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="bg-particles" id="particles"></div>

    <div class="container">
        <div class="bestiary-header">
            <div>
                <h1>🐉 BESTIARY</h1>
                <div class="sub">— Know thy enemy —</div>
            </div>
            <button class="back-btn" id="backBtn">⬅ BACK</button>
        </div>

        <div class="section-title">
            🗡️ Common Foes
            <span class="badge">5 types</span>
        </div>
        <div class="enemy-grid" id="enemyGrid"></div>

        <div class="section-title">
            👑 Bosses
            <span class="badge">3 legends</span>
        </div>
        <div class="boss-grid" id="bossGrid"></div>

        <div class="section-title">
            ⚔️ Difficulty Unlocks
            <span class="badge">7 tiers + Roguelike</span>
        </div>
        <div class="difficulty-tree" id="difficultyTree"></div>
    </div>

    <div class="modal-overlay" id="detailModal">
        <div class="modal-box">
            <button class="close-btn" id="modalCloseBtn">✕</button>
            <div class="modal-icon" id="modalIcon">🟢</div>
            <div class="modal-name" id="modalName">Sprout</div>
            <div class="modal-sub" id="modalSub">Common Foe</div>
            <div class="modal-stats" id="modalStats"></div>
            <div class="modal-lore" id="modalLore">“...”</div>
            <div class="modal-tip" id="modalTip">
                <strong>💡 Combat Tip:</strong> Use area damage to clear groups quickly.
            </div>
            <div class="modal-threat" id="modalThreat">⚠️ Threat Level: Low</div>
        </div>
    </div>

    <script>
        // ================================================================
        // DATA
        // ================================================================
        const ENEMY_TYPES = [
            { name: "🟢 Sprout", color: "#7cb518", hpMod: 0.8, speedMod: 1.0, rewardMod: 0.85,
              phrase: "Just a little guy, but there's always more where he came from.",
              threat: "Low", tip: "A single archer tower can handle them early on." },
            { name: "🔵 Frostling", color: "#5dade2", hpMod: 1.15, speedMod: 0.85, rewardMod: 1.05,
              phrase: "He moves slowly, but his chill lingers.",
              threat: "Low", tip: "Slow movement means you have time to aim – snipers are effective." },
            { name: "🟠 Charger", color: "#e67e22", hpMod: 0.7, speedMod: 1.5, rewardMod: 0.95,
              phrase: "Speed demon. Don't blink.",
              threat: "Medium", tip: "Place towers early in the path to catch these rushers." },
            { name: "🔴 Brute", color: "#c0392b", hpMod: 1.9, speedMod: 0.68, rewardMod: 1.35,
              phrase: "Big, mean, and takes a beating.",
              threat: "High", tip: "Poison or splash damage works best against his high HP." },
            { name: "🟣 Shade", color: "#9b59b6", hpMod: 1.25, speedMod: 1.12, rewardMod: 1.15,
              phrase: "Elusive and slippery. Hard to pin down.",
              threat: "Medium", tip: "Mage towers with chain lightning can hit her even when she dodges." }
        ];

        const BOSS_BASE = {
            cerberus: { name: "🔥 Cerberus", color: "#ff8c00", icon: "🐕", baseHpMult: 8, baseRewardMult: 5,
                speedMod: 0.7, threshold: 40, phrase: "Three heads, one purpose: your doom.",
                threat: "High", tip: "Focus fire – take down one head at a time with concentrated damage." },
            behemoth: { name: "💀 Behemoth", color: "#8b0000", icon: "🐘", baseHpMult: 16, baseRewardMult: 10,
                speedMod: 0.5, threshold: 80, phrase: "The earth trembles when he walks.",
                threat: "Extreme", tip: "Use multiple damage types – he's resistant to physical but weak to magic." },
            titan: { name: "👑 Titan", color: "#b8860b", icon: "👑", baseHpMult: 30, baseRewardMult: 20,
                speedMod: 0.4, threshold: 100, phrase: "King of the monsters. Bow or burn.",
                threat: "LEGENDARY", tip: "Coordinate all towers and use hero abilities wisely – this is the ultimate test." }
        };

        const DIFFICULTY_UNLOCK = {
            easy: { req: null, label: '🍼 EASY', desc: 'The gentle introduction. Enemies are half as tough.',
                unlockText: 'Always available' },
            normal: { req: { diff: 'easy', wave: 40 }, label: '🙂 NORMAL', desc: 'The standard experience.',
                unlockText: 'Reach Wave 40 on EASY' },
            hard: { req: { diff: 'normal', wave: 60 }, label: '🔥 HARD', desc: 'Enemies hit harder and have more health.',
                unlockText: 'Reach Wave 60 on NORMAL' },
            challenger: { req: { diff: 'normal', wave: 60 }, label: '🥷 CHALLENGER',
                desc: 'Towers cost 30% more, enemies have double health, only 5 lives.',
                unlockText: 'Reach Wave 60 on NORMAL' },
            death: { req: [{ diff: 'normal', wave: 80 }, { diff: 'hard', wave: 60 }], label: '💀 DEATH',
                desc: 'True desperation. Enemies are relentless, and rewards are scarce.',
                unlockText: 'Reach Wave 80 on NORMAL OR Wave 60 on HARD' },
            hell: { req: [{ diff: 'death', wave: 80 }, { diff: 'hard', wave: 100 }], label: '👿 HELL',
                desc: 'A true test of skill. Only 1 life, enhancements disabled, and enemies are brutal.',
                unlockText: 'Reach Wave 80 on DEATH OR Wave 100 on HARD' },
            primal: { req: [{ diff: 'death', wave: 80 }, { diff: 'hard', wave: 100 }], label: '🦍 PRIMAL',
                desc: 'The ultimate survival challenge. Enemy count ramps up quadratically, bosses are huge, but enemies have half health.',
                unlockText: 'Reach Wave 80 on DEATH OR Wave 100 on HARD' }
        };

        // ================================================================
        // RENDER FUNCTIONS
        // ================================================================
        function renderEnemies() {
            const grid = document.getElementById('enemyGrid');
            grid.innerHTML = '';
            const baseReward = Math.floor((22 + 0.8) * 0.5 * 0.6);
            ENEMY_TYPES.forEach(e => {
                const card = document.createElement('div');
                card.className = 'enemy-card';
                const reward = Math.floor(baseReward * e.rewardMod);
                card.dataset.id = e.name;
                card.innerHTML = `
                    <div class="icon" style="color:${e.color};">${e.name.split(' ')[0]}</div>
                    <div class="name">${e.name}</div>
                    <div class="stats">
                        <span>❤️ ${e.hpMod}x</span>
                        <span>💨 ${e.speedMod}x</span>
                        <span>🪙 ~${reward}</span>
                    </div>
                    <div class="lore">“${e.phrase}”</div>
                    <div class="click-hint">📖 click for details</div>
                `;
                card.addEventListener('click', () => openDetail('enemy', e));
                grid.appendChild(card);
            });
        }

        function renderBosses() {
            const grid = document.getElementById('bossGrid');
            grid.innerHTML = '';
            Object.values(BOSS_BASE).forEach(b => {
                const card = document.createElement('div');
                card.className = 'boss-card';
                card.dataset.id = b.name;
                card.innerHTML = `
                    <div class="icon">${b.icon}</div>
                    <div class="name">${b.name}</div>
                    <div class="threshold">⚔️ Wave ${b.threshold}</div>
                    <div class="lore">“${b.phrase}”</div>
                    <div class="click-hint">📖 click for details</div>
                `;
                card.addEventListener('click', () => openDetail('boss', b));
                grid.appendChild(card);
            });
        }

        function renderDifficultyTree() {
            const container = document.getElementById('difficultyTree');
            container.innerHTML = '';
            const unlocked = JSON.parse(localStorage.getItem('td_unlockedDifficulties')) || ['easy'];
            const keys = Object.keys(DIFFICULTY_UNLOCK);
            
            // Render each difficulty node with arrows between
            keys.forEach((key, idx) => {
                const def = DIFFICULTY_UNLOCK[key];
                const isUnlocked = unlocked.includes(key);
                const node = document.createElement('div');
                node.className = `diff-node ${isUnlocked ? 'unlocked' : 'locked'}`;
                node.innerHTML = `
                    <div class="diff-icon">${def.label.split(' ')[0]}</div>
                    <div class="diff-info">
                        <div class="diff-name">${def.label}</div>
                        <div class="diff-desc">${def.desc}</div>
                        <div class="diff-unlock">🔑 ${def.unlockText}</div>
                    </div>
                    <div class="diff-status">${isUnlocked ? '✅ Unlocked' : '🔒 Locked'}</div>
                `;
                container.appendChild(node);
                
                // Add arrow after every node (including after Primal, before Roguelike)
                const arrow = document.createElement('div');
                arrow.className = 'diff-arrow';
                arrow.textContent = '⬇';
                container.appendChild(arrow);
            });

            // ---- Roguelike unlock node (with arrow already added above) ----
            const required = ['easy', 'normal', 'hard', 'challenger', 'death', 'hell', 'primal'];
            const allUnlocked = required.every(d => unlocked.includes(d));
            const rogueNode = document.createElement('div');
            rogueNode.className = `diff-node ${allUnlocked ? 'unlocked' : 'locked'}`;
            rogueNode.innerHTML = `
                <div class="diff-icon">${allUnlocked ? '✅' : '🎲'}</div>
                <div class="diff-info">
                    <div class="diff-name">Roguelike Mode</div>
                    <div class="diff-desc">${allUnlocked ? 'All difficulties mastered! Roguelike mode is available in the Play menu.' : 'Unlock all 7 difficulties to access Roguelike mode.'}</div>
                    <div class="diff-unlock">Required: ${required.map(d => d.charAt(0).toUpperCase() + d.slice(1)).join(', ')}</div>
                </div>
                <div class="diff-status">${allUnlocked ? '✅ Unlocked' : '🔒 Locked'}</div>
            `;
            container.appendChild(rogueNode);
            // No arrow after Roguelike
        }

        // ================================================================
        // DETAIL MODAL
        // ================================================================
        const modal = document.getElementById('detailModal');
        const modalClose = document.getElementById('modalCloseBtn');
        const modalIcon = document.getElementById('modalIcon');
        const modalName = document.getElementById('modalName');
        const modalSub = document.getElementById('modalSub');
        const modalStats = document.getElementById('modalStats');
        const modalLore = document.getElementById('modalLore');
        const modalTip = document.getElementById('modalTip');
        const modalThreat = document.getElementById('modalThreat');

        function openDetail(type, data) {
            if (type === 'enemy') {
                modalIcon.textContent = data.name.split(' ')[0];
                modalIcon.style.color = data.color;
                modalName.textContent = data.name;
                modalSub.textContent = 'Common Foe';
                const baseReward = Math.floor((22 + 0.8) * 0.5 * 0.6);
                const reward = Math.floor(baseReward * data.rewardMod);
                modalStats.innerHTML = `
                    <span>❤️ HP: ${data.hpMod}x</span>
                    <span>💨 Speed: ${data.speedMod}x</span>
                    <span>🪙 Reward: ~${reward}</span>
                `;
                modalLore.textContent = `“${data.phrase}”`;
                modalTip.innerHTML = `<strong>💡 Combat Tip:</strong> ${data.tip || 'Use standard tactics.'}`;
                modalThreat.textContent = `⚠️ Threat Level: ${data.threat || 'Unknown'}`;
            } else if (type === 'boss') {
                modalIcon.textContent = data.icon;
                modalIcon.style.color = data.color;
                modalName.textContent = data.name;
                modalSub.textContent = `👑 Boss – Wave ${data.threshold}`;
                modalStats.innerHTML = `
                    <span>❤️ HP: ${data.baseHpMult}x</span>
                    <span>💨 Speed: ${data.speedMod}x</span>
                    <span>🪙 Reward: ${data.baseRewardMult}x</span>
                `;
                modalLore.textContent = `“${data.phrase}”`;
                modalTip.innerHTML = `<strong>💡 Combat Tip:</strong> ${data.tip || 'Prepare for a tough fight.'}`;
                modalThreat.textContent = `⚠️ Threat Level: ${data.threat || 'Extreme'}`;
            }
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        modalClose.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // ================================================================
        // PARTICLES
        // ================================================================
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 60; i++) {
                const span = document.createElement('span');
                const size = 2 + Math.random() * 6;
                span.style.width = size + 'px';
                span.style.height = size + 'px';
                span.style.left = Math.random() * 100 + '%';
                span.style.top = Math.random() * 100 + '%';
                span.style.animationDelay = Math.random() * 20 + 's';
                span.style.animationDuration = 15 + Math.random() * 20 + 's';
                container.appendChild(span);
            }
        }
        createParticles();

        // ================================================================
        // NAVIGATION – BACK TO MENU
        // ================================================================
        document.getElementById('backBtn').addEventListener('click', () => {
            window.parent.postMessage({ type: 'navigate', page: 'menu' }, '*');
        });

        // ================================================================
        // INIT
        // ================================================================
        renderEnemies();
        renderBosses();
        renderDifficultyTree();

        console.log('📖 Bestiary loaded – back to menu');
    </script>
</body>
</html>
